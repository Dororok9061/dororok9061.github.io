name: Validate and deploy Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1, 2026-07-22
        with:
          ruby-version: "3.3.11"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source src --destination _site --trace

      - name: Validate generated site
        run: python3 scripts/check_site.py _site

      - name: Validate recruiter and publication metadata
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_contact_metadata.py
          python3 scripts/check_recruitment_dates.py
          python3 scripts/check_linkedin_canonical.py
          python3 scripts/check_publication_metadata.py
          python3 scripts/check_publication_images.py

      - name: Validate structured engineering blog
        run: |
          python3 scripts/blog/validate_blog_frontmatter.py
          python3 scripts/blog/validate_blog_taxonomy.py
          python3 scripts/blog/validate_blog_series.py
          python3 scripts/blog/validate_series_order.py
          python3 scripts/blog/check_blog_assets.py
          python3 scripts/blog/check_blog_sources.py
          python3 scripts/blog/check_blog_links.py
          python3 scripts/blog/check_blog_i18n.py
          python3 scripts/blog/check_blog_search_index.py
          python3 scripts/blog/check_blog_copy_style.py
          python3 scripts/blog/check_human_study_voice.py src _site
          python3 scripts/blog/check_post_depth.py
          python3 scripts/blog/validate_study_hubs.py _site

      - name: Validate external learning publication boundaries
        run: |
          python3 scripts/learning/validate_learning_programs.py
          python3 scripts/learning/validate_competitions.py
          python3 scripts/learning/check_classroom_privacy.py
          python3 scripts/learning/check_kaggle_secrets.py
          python3 scripts/learning/check_kaggle_metrics.py
          python3 scripts/learning/check_outta_reruns.py
          python3 scripts/learning/check_learning_assets.py
          python3 scripts/learning/check_certificates.py
          python3 scripts/learning/check_learning_i18n.py
          python3 scripts/learning/check_publication_boundaries.py
          python3 scripts/learning/inventory_course_sources.py
          python3 scripts/learning/extract_pptx_content.py
          python3 scripts/learning/extract_pdf_content.py
          python3 scripts/learning/extract_course_figures.py
          python3 scripts/learning/map_course_topics.py
          python3 scripts/learning/check_day_topic_coverage.py
          python3 scripts/learning/check_slide_coverage.py
          python3 scripts/learning/check_pdf_page_coverage.py
          python3 scripts/learning/check_figure_coverage.py
          python3 scripts/learning/check_practice_file_coverage.py
          python3 scripts/learning/check_notion_blog_parity.py
          python3 scripts/learning/check_private_course_data.py

      - name: Scan source and public build
        shell: pwsh
        run: |
          ./scripts/security/verify-site-security.ps1 -SiteRoot .
          ./scripts/security/verify-site-security.ps1 -SiteRoot _site -BuiltSite

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload generated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
