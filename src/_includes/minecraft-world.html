<section class="minecraft-entry" data-minecraft-entry aria-labelledby="minecraft-entry-title" aria-live="polite">
  <div class="minecraft-entry__panel">
    <p class="minecraft-entry__hello" id="minecraft-entry-title">
      {% if page.lang == 'en' %}Hi 👋! Thanks for stopping by!! ❤️{% else %}Hi 👋! 홈페이지에 들러주셔서 감사합니다!! ❤️{% endif %}
    </p>
    <p class="minecraft-entry__loading-title">
      {% if page.lang == 'en' %}Generating level{% else %}Generating level{% endif %}
    </p>
    <p class="minecraft-entry__guide">
      {% if page.lang == 'en' %}Loading chunks...{% else %}Loading chunks...{% endif %}
    </p>
    <div class="minecraft-entry__progress" data-minecraft-progress aria-hidden="true">
      <span data-minecraft-progress-bar></span>
    </div>
    <p class="minecraft-entry__percent" data-minecraft-percent>0%</p>
    <button class="minecraft-entry__enter" type="button" data-minecraft-enter hidden>
      {% if page.lang == 'en' %}Enter Homepage{% else %}홈페이지 들어가기{% endif %}
    </button>
  </div>
</section>
<button class="minecraft-sound-toggle" type="button" data-minecraft-sound-toggle aria-pressed="true" hidden>
  <span data-minecraft-sound-label>Sound On</span>
</button>
