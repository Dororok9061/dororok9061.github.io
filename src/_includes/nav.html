<ul class="site-navigation__list">
  {% for item in include.items %}
  <li class="site-navigation__item">
    {% if item.children %}
    <details class="site-navigation__group">
      <summary>{{ item.title }}</summary>
      <ul class="site-navigation__sublist">
        {% for child in item.children %}
        <li><a href="{{ child.url | relative_url }}">{{ child.title }}</a></li>
        {% endfor %}
      </ul>
    </details>
    {% else %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endif %}
  </li>
  {% endfor %}
</ul>
