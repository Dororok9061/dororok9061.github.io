<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Publication Workbench</title>
  <meta name="description" content="Reusable research publication portal for papers, projects, blogs, assignments, and study notes.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
  <link rel="canonical" href="https://dororok9061.github.io/projects/pcb-visual-inspection/research-portal/">
  <link rel="stylesheet" href="style.css?v=20260808-public-mirror-v1">
  <script src="portal-data.js?v=20260808-public-mirror-v1"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="#top"><span class="material-symbols-outlined">science</span><span data-bind="paper_title">Research Publication Workbench</span></a>
    <div class="nav-links" id="navLinks"></div>
    <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme"><span class="material-symbols-outlined">contrast</span></button>
  </nav>
  <header id="top" class="hero">
    <div class="hero-copy">
      <p class="eyebrow">YAML-driven research homepage template</p>
      <h1 data-bind="paper_title">Research Publication Workbench</h1>
      <p class="subtitle" data-bind="subtitle"></p>
      <div class="badges" id="badges"></div>
      <div class="actions" id="actions"></div>
    </div>
    <figure class="hero-figure">
      <img src="AssetsWeb/research_portal_matrix.webp?v=20260808-public-mirror-v1" alt="Research portal coverage matrix" width="1200" height="1200">
    </figure>
  </header>
  <main id="content">
    <section class="metrics" id="metrics" aria-label="Summary metrics"></section>
    <div id="sections"></div>
  </main>
  <div class="lightbox" id="imageLightbox" aria-hidden="true">
    <button class="lightbox-close icon-button" type="button" aria-label="Close enlarged figure"><span class="material-symbols-outlined">close</span></button>
    <img alt="Enlarged publication figure" width="1200" height="1200">
  </div>
  <button class="scroll-top icon-button" id="scrollTop" type="button" aria-label="Scroll to top"><span class="material-symbols-outlined">arrow_upward</span></button>
  <footer>
    <strong>Reusable publication system.</strong>
    <span>Template pattern: YAML data, modular sections, galleries, BibTeX, Material icons, and evidence-gated claims.</span>
  </footer>
  <script src="script.js?v=20260808-public-mirror-v1"></script>
</body>
</html>
