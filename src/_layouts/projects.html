---
layout: default
---
<main id="main" class="page page-shell page-shell--wide">
  <header class="page-heading">
    <p class="eyebrow">{{ page.eyebrow }}</p>
    <h1>{{ page.title }}</h1>
    <p class="page-heading__lead">{{ page.lead }}</p>
  </header>
  <div class="project-grid">
    {% for project in site.data.projects %}
      {% include project-card.html project=project lang=page.lang %}
    {% endfor %}
  </div>
</main>
