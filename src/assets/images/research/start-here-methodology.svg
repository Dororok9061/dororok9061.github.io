<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Engineering portfolio methodology</title>
  <desc id="desc">A source-based diagram connecting problem definition, system architecture, implementation, verification, and publication across radar, AI, embedded, FPGA, RF, PCB, and control projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#174e6d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64b5f6"/><stop offset="1" stop-color="#80deea"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64b5f6"/></marker>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <text x="100" y="90" fill="#8bd3ff" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">ENGINEERING RESEARCH WORKFLOW</text>
  <text x="100" y="150" fill="#fff" font-family="Arial, sans-serif" font-size="58" font-weight="800">Problem → Architecture → Build → Verify → Publish</text>
  <text x="100" y="205" fill="#c9e7f8" font-family="Arial, sans-serif" font-size="26">The shared reading order used for projects, papers, coursework, and technical notes</text>
