    <path d="M260 125h52" stroke="#64b5f6" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(325 0)"><rect width="250" height="250" rx="24" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#e0f7fa"/><path d="M39 61h30M45 45h18v32H45z" fill="none" stroke="#00838f" stroke-width="5"/><text x="32" y="116" fill="#00838f" font-family="Arial" font-size="20" font-weight="800">02</text><text x="32" y="155" fill="#102b4c" font-family="Arial" font-size="29" font-weight="800">Architecture</text><text x="32" y="194" fill="#516879" font-family="Arial" font-size="19">Sensor · compute ·</text><text x="32" y="224" fill="#516879" font-family="Arial" font-size="19">network · control</text></g>
    <path d="M585 125h52" stroke="#64b5f6" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(650 0)"><rect width="250" height="250" rx="24" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#ede7f6"/><path d="M38 54 49 43M38 54l11 11M70 54 59 43M70 54 59 65M51 73l7-38" fill="none" stroke="#5e35b1" stroke-width="5" stroke-linecap="round"/><text x="32" y="116" fill="#5e35b1" font-family="Arial" font-size="20" font-weight="800">03</text><text x="32" y="155" fill="#102b4c" font-family="Arial" font-size="29" font-weight="800">Build</text><text x="32" y="194" fill="#516879" font-family="Arial" font-size="19">Firmware · RTL · AI ·</text><text x="32" y="224" fill="#516879" font-family="Arial" font-size="19">signal processing · UI</text></g>
    <path d="M910 125h52" stroke="#64b5f6" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(975 0)"><rect width="250" height="250" rx="24" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#e8f5e9"/><path d="m39 55 10 10 20-23" fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="116" fill="#2e7d32" font-family="Arial" font-size="20" font-weight="800">04</text><text x="32" y="155" fill="#102b4c" font-family="Arial" font-size="29" font-weight="800">Verify</text><text x="32" y="194" fill="#516879" font-family="Arial" font-size="19">Synchronized data ·</text><text x="32" y="224" fill="#516879" font-family="Arial" font-size="19">regression · failure tests</text></g>
    <path d="M1235 125h52" stroke="#64b5f6" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(1300 0)"><rect width="250" height="250" rx="24" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#fff3e0"/><path d="M40 39h28v30H40zM46 47h16M46 54h16M46 61h10" fill="none" stroke="#ef6c00" stroke-width="4"/><text x="32" y="116" fill="#ef6c00" font-family="Arial" font-size="20" font-weight="800">05</text><text x="32" y="155" fill="#102b4c" font-family="Arial" font-size="29" font-weight="800">Publish</text><text x="32" y="194" fill="#516879" font-family="Arial" font-size="19">Figures · code · paper ·</text><text x="32" y="224" fill="#516879" font-family="Arial" font-size="19">report · reproducibility</text></g>
  </g>
  <g transform="translate(100 650)">
    <rect width="1400" height="120" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="40" y="45" fill="#8bd3ff" font-family="Arial" font-size="20" font-weight="800">APPLIED ACROSS</text>
    <text x="40" y="85" fill="#fff" font-family="Arial" font-size="25" font-weight="700">FMCW Radar · Vision AI · Sensor Fusion · Biomedical Signals · STM32 · FPGA RTL/DV · RF/Microwave · PADS PCB · Motor Control</text>
  </g>
  <text x="100" y="840" fill="#9fc4dc" font-family="Arial" font-size="18">Explanatory redraw based on the public portfolio structure; no fabricated measurements or experiment imagery.</text>
</svg>
