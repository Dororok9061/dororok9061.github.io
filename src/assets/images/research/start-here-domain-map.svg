    <text x="800" y="418" text-anchor="middle" class="center-title">류형록</text>
    <text x="800" y="458" text-anchor="middle" class="center-title">Engineering Research</text>
    <text x="800" y="498" text-anchor="middle" class="center-copy">Problem → Method → Results → Figures</text>
  </g>

