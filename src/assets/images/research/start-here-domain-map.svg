<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hyeongrok Ryu engineering research domain map</title>
  <desc id="desc">A central engineering research portfolio connects radar, vision AI, FPGA, biomedical AI, coursework, and PCB/control studies.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".15"/>
    </filter>
    <style>
      .heading{font:800 44px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#0f172a}
      .sub{font:500 21px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#526078}
      .node-title{font:800 25px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#0f172a}
      .node-copy{font:500 18px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#526078}
      .center-title{font:800 34px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#fff}
      .center-copy{font:600 19px system-ui,-apple-system,"Noto Sans KR",sans-serif;fill:#dbeafe}
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="80" y="78" class="heading">Engineering Research Portfolio Map</text>
  <text x="80" y="116" class="sub">대표 연구·프로젝트·전공과제·공부 기록을 한 페이지 구조로 연결합니다.</text>

  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M800 450 430 250"/>
    <path d="M800 450 1170 250"/>
    <path d="M800 450 370 520"/>
    <path d="M800 450 1230 520"/>
    <path d="M800 450 520 735"/>
    <path d="M800 450 1080 735"/>
  </g>

  <g filter="url(#shadow)">
