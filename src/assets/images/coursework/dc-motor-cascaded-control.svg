<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DC motor cascaded speed and current control</title>
  <desc id="desc">A speed reference passes through a speed PI controller, current limiter, current PI controller, H bridge and DC motor, with current and speed feedback loops.</desc>
  <rect width="1200" height="630" fill="#f7f7f4"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="70" y="82" font-size="34" font-weight="700">Cascaded DC motor control</text>
    <text x="70" y="118" font-size="20" fill="#4b5563">outer speed loop · inner current loop · H-bridge plant</text>
  </g>
  <g stroke="#1f6f8b" stroke-width="4" fill="#ffffff">
    <rect x="80" y="235" width="170" height="100" rx="14"/>
    <rect x="310" y="235" width="170" height="100" rx="14"/>
    <rect x="540" y="235" width="170" height="100" rx="14"/>
    <rect x="770" y="235" width="150" height="100" rx="14"/>
    <rect x="980" y="235" width="150" height="100" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#171717">
    <text x="165" y="278" font-size="23" font-weight="700">Speed PI</text><text x="165" y="308" font-size="17">24.8 + 3898/s</text>
    <text x="395" y="278" font-size="23" font-weight="700">Limiter</text><text x="395" y="308" font-size="17">current command</text>
    <text x="625" y="278" font-size="23" font-weight="700">Current PI</text><text x="625" y="308" font-size="17">62.832 + 314.16/s</text>
    <text x="845" y="278" font-size="23" font-weight="700">H-bridge</text><text x="845" y="308" font-size="17">PWM voltage</text>
    <text x="1055" y="278" font-size="23" font-weight="700">DC motor</text><text x="1055" y="308" font-size="17">electrical + mechanical</text>
  </g>
  <g stroke="#ef6c57" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M35 285H80"/><path d="M250 285H310"/><path d="M480 285H540"/><path d="M710 285H770"/><path d="M920 285H980"/>
    <path d="M1055 335V440H165V335"/>
    <path d="M1055 335V515H625V335"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ef6c57"/></marker></defs>
  <g font-family="Arial, sans-serif" fill="#4b5563" font-size="18">
    <text x="40" y="264">ω*</text><text x="270" y="264">i*</text><text x="500" y="264">v*</text>
    <text x="730" y="264">duty</text><text x="415" y="432">speed feedback ω</text><text x="755" y="507">current feedback i</text>
    <text x="70" y="585">Redrawn from the archived coursework control diagram; values are report settings, not fresh measurements.</text>
  </g>
</svg>
