<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Diffusion과 latent diffusion 흐름</title><desc id="desc">깨끗한 데이터에 잡음을 더하는 forward process와 잡음을 제거하는 reverse process, latent space 비교</desc><rect width="1200" height="630" rx="32" fill="#f4f1ea"/>
  <text x="600" y="75" fill="#111" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle">Forward noise and learned reverse denoising</text><g fill="#fff" stroke="#1e6f9f" stroke-width="4"><circle cx="150" cy="235" r="72"/><circle cx="410" cy="235" r="72"/><circle cx="670" cy="235" r="72"/><circle cx="930" cy="235" r="72"/></g><g fill="#111" font-family="Arial,sans-serif" text-anchor="middle"><text x="150" y="247" font-size="34">x₀</text><text x="410" y="247" font-size="34">xₜ</text><text x="670" y="247" font-size="34">xₜ₊₁</text><text x="930" y="247" font-size="34">xₜ</text></g><g stroke="#e06f54" stroke-width="8" fill="none" marker-end="url(#a)"><path d="M222 215h110"/><path d="M482 215h110"/></g><g stroke="#2d8a6e" stroke-width="8" fill="none" marker-end="url(#b)"><path d="M858 260H748"/><path d="M598 260H488"/><path d="M338 260H228"/></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#e06f54"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2d8a6e"/></marker></defs><text x="405" y="160" font-family="Arial,sans-serif" font-size="23" fill="#e06f54" text-anchor="middle">q: add Gaussian noise</text><text x="680" y="335" font-family="Arial,sans-serif" font-size="23" fill="#2d8a6e" text-anchor="middle">pθ: predict noise and denoise</text>
  <rect x="180" y="435" width="840" height="100" rx="22" fill="#17324d"/><text x="600" y="478" fill="#fff" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">Latent diffusion: encode image → denoise latent → decode image</text><text x="600" y="515" fill="#bfe3f5" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">DiT replaces the U-Net backbone with a transformer over latent patches.</text></svg>
