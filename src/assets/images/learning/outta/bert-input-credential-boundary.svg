<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BERT input flow and sanitized public credential pattern</title>
  <desc id="desc">The left panel adds token, position, and segment embeddings before a BERT encoder. The right panel shows the sanitized public pattern: the raw notebook is excluded and the replacement reads a credential from the runtime environment.</desc>
  <rect width="1200" height="630" fill="#f7f7f4"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="65" y="78" font-size="32" font-weight="700">BERT input + sanitized public pattern</text>
    <text x="65" y="112" font-size="19" fill="#4b5563">Redrawn from the course topics; not a notebook output</text>
  </g>
  <rect x="55" y="150" width="635" height="410" rx="18" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <rect x="720" y="150" width="425" height="410" rx="18" fill="#fff" stroke="#1f6f8b" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="85" y="195" font-size="24" font-weight="700">Input representation</text>
    <text x="750" y="195" font-size="24" font-weight="700">Credential boundary</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="90" y="235" width="160" height="70" rx="10"/><rect x="90" y="330" width="160" height="70" rx="10"/><rect x="90" y="425" width="160" height="70" rx="10"/></g>
    <g fill="#171717" font-size="19"><text x="170" y="277">Token embedding</text><text x="170" y="372">Position embedding</text><text x="170" y="467">Segment embedding</text></g>
    <circle cx="320" cy="365" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="320" y="374" font-size="30" fill="#171717">+</text>
    <rect x="400" y="305" width="235" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="518" y="355" font-size="23" font-weight="700" fill="#171717">BERT encoder</text><text x="518" y="388" font-size="18" fill="#374151">mask + hidden states</text>
  </g>
  <g stroke="#ef6c57" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M250 270H285V340"/><path d="M250 365H285"/><path d="M250 460H285V390"/><path d="M354 365H400"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="760" y="235" width="345" height="78" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="932" y="270" font-size="21" font-weight="700" fill="#171717">Runtime-provided key</text><text x="932" y="295" font-size="17" fill="#4b5563">raw notebook excluded</text>
    <rect x="760" y="360" width="345" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="932" y="395" font-size="21" font-weight="700" fill="#171717">SDK client at runtime</text><text x="932" y="420" font-size="17" fill="#4b5563">reads environment variable</text>
    <text x="932" y="500" font-size="17" fill="#4b5563">public replacement: no secret value in source or outputs</text>
  </g>
  <path d="M932 313V360" stroke="#ef6c57" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ef6c57"/></marker></defs>
</svg>
