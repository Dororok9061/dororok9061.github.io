<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mealy 101 detector and standalone 8-to-1 multiplexer</title>
  <desc id="desc">Left panel traces three states of an overlapping 101 detector. Right panel maps three select bits to eight multiplexer inputs.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <rect x="48" y="70" width="528" height="500" rx="18" fill="#ffffff" stroke="#c9c5bd" stroke-width="2"/>
  <rect x="624" y="70" width="528" height="500" rx="18" fill="#ffffff" stroke="#c9c5bd" stroke-width="2"/>
  <text x="76" y="118" fill="#111111" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">A. Mealy 101 detector</text>
  <text x="652" y="118" fill="#111111" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">B. 8-to-1 MUX</text>
  <g fill="#edf5fb" stroke="#1677a8" stroke-width="3">
    <circle cx="160" cy="270" r="58"/>
    <circle cx="312" cy="270" r="58"/>
    <circle cx="464" cy="270" r="58"/>
  </g>
  <g fill="#111111" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <text x="160" y="278">st0</text>
    <text x="312" y="278">st1</text>
    <text x="464" y="278">st2</text>
  </g>
  <g fill="none" stroke="#d14f45" stroke-width="4" marker-end="url(#arrow)">
    <path d="M218 270 H250"/>
    <path d="M370 270 H402"/>
    <path d="M452 212 C410 150 340 150 324 210"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d14f45"/>
    </marker>
  </defs>
  <g fill="#5b554d" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle">
    <text x="234" y="248">1 / 0</text>
    <text x="386" y="248">0 / 0</text>
    <text x="386" y="168">1 / 1</text>
    <text x="312" y="390">01010101 → three overlapping 101 windows</text>
    <text x="312" y="430">state path uses st0, st1, st2</text>
  </g>
  <g fill="#eef4ec" stroke="#4c7b54" stroke-width="2">
    <rect x="674" y="168" width="112" height="46" rx="6"/>
    <rect x="674" y="226" width="112" height="46" rx="6"/>
    <rect x="674" y="284" width="112" height="46" rx="6"/>
    <rect x="674" y="342" width="112" height="46" rx="6"/>
    <rect x="674" y="400" width="112" height="46" rx="6"/>
    <rect x="674" y="458" width="112" height="46" rx="6"/>
    <rect x="812" y="226" width="112" height="46" rx="6"/>
    <rect x="812" y="342" width="112" height="46" rx="6"/>
  </g>
  <g fill="#111111" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle">
    <text x="730" y="198">a · 000</text>
    <text x="730" y="256">b · 001</text>
    <text x="730" y="314">c · 010</text>
    <text x="730" y="372">d · 011</text>
    <text x="730" y="430">e · 100</text>
    <text x="730" y="488">f · 101</text>
    <text x="868" y="256">g · 110</text>
    <text x="868" y="372">h · 111</text>
  </g>
  <path d="M934 336 H1018" stroke="#1677a8" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1677a8"/>
    </marker>
  </defs>
  <text x="1062" y="344" fill="#111111" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">y</text>
  <text x="912" y="520" fill="#5b554d" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle">with-select form removes the missing decoder dependency</text>
</svg>
