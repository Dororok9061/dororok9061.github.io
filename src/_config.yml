title: Hyeongrok Ryu Engineering Portfolio
short_title: Hyeongrok Ryu
description: Hyeongrok Ryu's bilingual engineering portfolio for radar and embedded signal processing, FPGA RTL and digital verification, research, and publications.
url: https://dororok9061.github.io
baseurl: ""
lang: ko
timezone: Asia/Seoul
encoding: utf-8
copyright: "© 2026 Hyeongrok Ryu"

theme: jekyll-theme-simplex

author:
  name: Hyeongrok Ryu
  name_ko: 류형록
  github: https://github.com/Dororok9061
  email: hnryu0515@gmail.com
  linkedin: https://www.linkedin.com/in/hyeongrok-ryu-842231224/

logo_img:
favicon: /assets/images/favicon.png

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  blog_series:
    output: true
    permalink: /blog/series/:name/

permalink: /blog/:year/:month/:day/:title/
strict_front_matter: true
show_excerpts: true

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: ko
      image: /assets/images/og.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Hyeongrok Ryu
      image: /assets/images/og.jpg
  - scope:
      path: ""
      type: blog_series
    values:
      layout: series
      lang: ko

include:
  - projects/pcb-visual-inspection/research-portal/AssetsWeb

exclude:
  - assets/js/jquery.slim.min.js
  - assets/js/lity.min.js
  - assets/js/lity.min.css
  - assets/js/tools.js
  - assets/fonts/Roboto-Regular.ttf
  - assets/fonts/Roboto-Regular.woff
  - assets/fonts/Roboto-Bold.ttf
  - assets/fonts/Roboto-Bold.woff
  - assets/fonts/RobotoSlab-Regular.ttf
  - assets/fonts/RobotoSlab-Regular.woff
  - assets/fonts/RobotoSlab-Bold.ttf
  - assets/fonts/RobotoSlab-Bold.woff
  - assets/fonts/RobotoMono-Regular.ttf
  - assets/fonts/RobotoMono-Regular.woff
  - assets/fonts/RobotoMono-Bold.ttf
  - assets/fonts/RobotoMono-Bold.woff
  - assets/images/study/coursework/digital-communications.webp
  - assets/images/study/coursework/electronic-circuits-1.webp
  - assets/images/study/coursework/electronic-circuits-2.webp
  - assets/images/study/coursework/embedded-systems.webp
  - assets/images/study/coursework/power-electronics.webp
  - projects/pcb-visual-inspection/research-portal/data.yaml
  - projects/pcb-visual-inspection/research-portal/Assets/**
  - projects/pcb-visual-inspection/research-portal/AssetsWeb/paper_style/pcb_paper_style_contact_sheet.webp
  - projects/pcb-visual-inspection/research-portal/AssetsWeb/paper_style/pcb_style_fig31_methodology_statistics_board.webp

sass:
  style: compressed
  sourcemap: never
