      "concept_ko": "Sij의 두 번째 index j가 excitation port, 첫 번째 i가 response port다. 측정하지 않는 port는 reference impedance로 terminate해야 하며, 다중 port network의 match, transmission, reverse transmission, isolation을 행렬로 읽는다.",
      "concept_en": "For Sij, index j is the excited port and i is the observed response. Other ports are terminated in the reference impedance, and the matrix separates match, forward/reverse transmission, and isolation.",
      "formulas": [
        "b = S a",
        "S21 = b2 / a1 when all other incident waves are zero"
      ],
      "example_ko": "equal split ideal divider의 각 출력 power는 입력보다 3.0103 dB 낮다. 따라서 |S21|=|S31|≈0.707이고 20log10(0.707)≈−3.01 dB다.",
      "example_en": "Each output of an ideal equal power divider is 3.0103 dB below the input, so |S21|=|S31|≈0.707 and 20log10(0.707)≈−3.01 dB.",
      "connection_ko": "내 Cadence Wilkinson 화면에서는 S21/S31 split과 S23 isolation을 함께 읽었다. branch-line 화면은 S21/S31 amplitude만으로 90도 phase balance를 입증하지 않는다.",
      "connection_en": "In my stored Cadence Wilkinson view I read S21/S31 split with S23 isolation. The branch-line amplitude curves alone do not prove 90-degree phase balance.",
      "caution_ko": "simulation port와 VNA calibration port는 같은 말이 아니다. fixture de-embedding과 reference-plane 이동이 없으면 화면의 S-parameter를 DUT 단자 측정으로 바꾸어 말하지 않는다.",
      "caution_en": "A simulation port is not automatically a calibrated VNA port. Without fixture de-embedding and reference-plane control, a plot is not described as a DUT-terminal measurement.",
