      "concept_en": "Effective permittivity and guided wavelength set microstrip length, while matching networks move the load toward the reference impedance. Wilkinson and branch-line circuits both use quarter-wave sections but have different port and isolation mechanisms.",
      "formulas": [
        "l = theta lambda_g / (2 pi)",
        "Z_branch = sqrt(2) Z_0 for an equal Wilkinson"
      ],
      "example_ko": "Z0=50 Ω이면 equal Wilkinson branch는 70.71 Ω, isolation resistor는 ideal case 100 Ω다. 내 저장 설계는 tuning 값과 실제 line width/length를 별도로 보여준다.",
      "example_en": "For Z0=50 ohms, an equal Wilkinson uses 70.71-ohm branches and an ideal 100-ohm isolation resistor. My stored design separately shows tuned values and physical line dimensions.",
      "connection_ko": "3.7 GHz에서 읽힌 microstrip marker를 3.5 GHz 정확 검증으로 바꾸지 않았다. Wilkinson S21/S31, S23과 branch-line schematic·S-parameter 화면도 기존 archive임을 유지했다.",
      "connection_en": "I do not turn the stored 3.7 GHz microstrip marker into exact 3.5 GHz validation. The Wilkinson and branch-line screens remain an existing simulation archive.",
