      "description_ko": "50 Ω, port, matching을 따로 외우니 S-parameter 설정과 회로 연결이 자주 섞였다. 이번에는 source–line–load의 기준면을 먼저 그리고 세 용어를 한 경로로 연결했다.",
      "description_en": "Memorizing 50 ohms, ports, and matching separately made S-parameter setups confusing. I drew the source-line-load reference planes first and connected all three terms on one path.",
