      "title_ko": "RF 공부를 시작하며: 파장과 전기적 길이",
      "title_en": "Starting RF Study: Wavelength and Electrical Length",
      "description_ko": "먼저 RF가 단순히 높은 주파수라는 말에서 끝나지 않는 이유를 정리했다. 회로의 물리 크기가 파장에 비해 무시되지 않을 때 위치에 따른 위상과 반사를 함께 보게 된다.",
      "description_en": "I started by asking why RF is more than a label for high frequency. When physical size is no longer negligible relative to wavelength, phase and reflection must be tracked along position.",
      "focus_ko": "먼저 RF가 단순히 높은 주파수라는 말에서 끝나지 않는 이유를 정리했다. 회로의 물리 크기가 파장에 비해 무시되지 않을 때 위치에 따른 위상과 반사를 함께 보게 된다.",
      "focus_en": "I started by asking why RF is more than a label for high frequency. When physical size is no longer negligible relative to wavelength, phase and reflection must be tracked along position.",
      "concept_ko": "낮은 주파수의 lumped 회로에서는 한 node의 전압을 하나의 값으로 다루지만, distributed 회로에서는 V(z)와 I(z)가 진행파와 반사파의 합이 된다. 주파수, 매질의 위상속도, 선로 길이를 먼저 적어야 같은 구조의 전기적 길이를 비교할 수 있다.",
      "concept_en": "A lumped node can be represented by one voltage, while a distributed line uses V(z) and I(z) as sums of forward and reflected waves. Frequency, phase velocity, and physical length must be recorded before comparing electrical length.",
      "formulas": [
        "lambda = v_p / f",
        "theta = beta l = 2 pi l / lambda"
      ],
      "example_ko": "3.5 GHz에서 자유공간 파장은 약 85.7 mm다. 유효 유전율이 6이라고 가정하면 유도파장은 약 35.0 mm로 줄고, 같은 25 mm 선로는 약 257도의 전기적 길이가 된다.",
      "example_en": "At 3.5 GHz the free-space wavelength is about 85.7 mm. With an assumed effective permittivity of 6, the guided wavelength is about 35.0 mm, so a 25 mm line is roughly 257 electrical degrees.",
      "connection_ko": "내 고주파공학 과제의 alumina microstrip은 3.5 GHz와 270도 조건을 사용했다. 여기서는 당시 치수를 측정값으로 바꾸지 않고, 유효 유전율이 길이 계산에 들어가는 순서만 다시 확인했다.",
      "connection_en": "My high-frequency coursework used a 3.5 GHz, 270-degree alumina microstrip. I keep its stored dimensions separate from measurement and revisit only how effective permittivity enters the length calculation.",
      "caution_ko": "유전율만으로 실제 위상속도를 확정하면 안 된다. microstrip은 장이 공기와 기판에 나뉘므로 유효 유전율 모델과 주파수 범위를 함께 확인한다.",
      "caution_en": "Relative permittivity alone does not fix the actual phase velocity of microstrip because fields occupy both air and substrate; the effective-permittivity model and frequency range matter.",
