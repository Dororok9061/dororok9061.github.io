      "description_ko": "전송 구조 이름만 나열하지 않고 각 구조의 return path, field confinement, mode, 제작 변수를 기준으로 다시 비교했다.",
      "description_en": "Instead of listing line names, I compared each structure by return path, field confinement, mode, and fabrication variables.",
      "focus_ko": "전송 구조 이름만 나열하지 않고 각 구조의 return path, field confinement, mode, 제작 변수를 기준으로 다시 비교했다.",
      "focus_en": "Instead of listing line names, I compared each structure by return path, field confinement, mode, and fabrication variables.",
      "concept_ko": "microstrip은 공기와 기판의 경계에 장이 걸쳐 quasi-TEM으로 다루고, stripline은 유전체 내부에 도체가 묻힌다. CPW는 같은 면의 ground가 probe와 shunt 연결에 유리하며, coax와 waveguide는 각각 TEM과 cutoff를 가진 도파 모드 관점이 중요하다.",
      "concept_en": "Microstrip spans air and substrate and is commonly treated as quasi-TEM; stripline embeds the conductor in dielectric. CPW keeps grounds on the same plane, while coax and waveguide emphasize TEM behavior and cutoff modes respectively.",
      "formulas": [
        "Z_0 = sqrt(L prime / C prime)",
        "gamma = alpha + j beta"
      ],
      "example_ko": "길이 20 mm, λg=40 mm인 lossless line은 180도 전기적 길이다. 같은 물리 길이라도 유효 유전율이 커져 λg가 30 mm로 줄면 240도가 된다.",
      "example_en": "A 20 mm lossless line with λg=40 mm is 180 degrees long. If higher effective permittivity reduces λg to 30 mm, the same line becomes 240 degrees.",
      "connection_ko": "alumina 과제의 width와 length는 microstrip stack-up에 종속된다. 기존 Cadence 화면의 W=480 µm와 L≈24.9 mm를 다른 기판의 보편값으로 사용하지 않았다.",
