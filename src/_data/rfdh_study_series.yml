      "description_ko": "이번에는 RFDH의 Smith chart 설명을 읽고 복소 reflection과 impedance를 한 원에서 왕복 변환하는 목적을 손계산과 자체 도식으로 다시 정리했다.",
      "description_en": "I used the RFDH Smith-chart notes to revisit mapping complex reflection and impedance on one bounded plane with a hand calculation and my own diagram.",
      "focus_ko": "이번에는 RFDH의 Smith chart 설명을 읽고 복소 reflection과 impedance를 한 원에서 왕복 변환하는 목적을 손계산과 자체 도식으로 다시 정리했다.",
