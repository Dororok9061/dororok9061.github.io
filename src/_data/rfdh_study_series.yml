      "focus_en": "I write the reference and unit first to avoid mixing a dB ratio with absolute dBm power.",
      "concept_ko": "dB는 두 양의 ratio이고 dBm은 1 mW 기준의 power level이다. gain/loss를 dB로 더한 뒤 input dBm에 합하면 output dBm을 얻지만, 실제 available power와 compression 조건은 별도로 확인한다.",
