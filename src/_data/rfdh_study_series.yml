      "focus_en": "Memorizing 50 ohms, ports, and matching separately made S-parameter setups confusing. I drew the source-line-load reference planes first and connected all three terms on one path.",
      "concept_ko": "port는 단순한 선 이름이 아니라 입사파와 반사파를 정의하는 기준면이다. ZL=Z0이면 반사계수는 0이고, 일반적인 conjugate match와 transmission-line match는 목표 조건이 다를 수 있다.",
      "concept_en": "A port is a reference plane for incident and reflected waves, not merely a wire label. ZL=Z0 gives zero reflection, while conjugate matching and transmission-line matching can serve different objectives.",
