      "focus_ko": "RF 회로 공부와 FMCW signal processing 사이를 chirp 생성, 송수신 chain, mixer, IF sampling 순서로 연결했다.",
      "focus_en": "I connected RF-circuit study to FMCW signal processing through chirp generation, transmit/receive chains, mixing, and IF sampling.",
      "concept_ko": "PLL/VCO가 chirp slope를 만들고 송신 신호와 지연된 echo를 mixer에 넣으면 beat frequency가 생긴다. 그 뒤 ADC sample, range FFT, slow-time Doppler, antenna phase processing은 RF block 설명과 구분한다.",
      "concept_en": "A PLL/VCO creates chirp slope; mixing the transmitted chirp with a delayed echo produces beat frequency. ADC sampling, range FFT, slow-time Doppler, and antenna-phase processing follow as distinct processing stages.",
