      "title_en": "Converting Reflection Coefficient, Return Loss, and VSWR",
      "description_ko": "같은 mismatch를 세 단위로 표현할 때 부호와 ratio를 섞지 않도록 계산 순서를 다시 적었다.",
      "description_en": "I rewrote the conversion order so that sign conventions and ratios are not mixed when one mismatch is expressed three ways.",
      "focus_ko": "같은 mismatch를 세 단위로 표현할 때 부호와 ratio를 섞지 않도록 계산 순서를 다시 적었다.",
      "focus_en": "I rewrote the conversion order so that sign conventions and ratios are not mixed when one mismatch is expressed three ways.",
      "concept_ko": "복소 Γ는 크기와 위상을 가지며 return loss와 VSWR은 그 크기만 사용한다. S11을 음수 dB로 표시하는 plot과 양수 return loss를 같은 숫자의 반대 부호로 읽을 때 정의를 먼저 확인한다.",
      "concept_en": "Complex Γ has magnitude and phase; return loss and VSWR use only its magnitude. A negative-dB S11 plot and positive return loss can carry opposite signs, so the displayed definition must be checked.",
      "formulas": [
