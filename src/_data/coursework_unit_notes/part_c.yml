power-electronics:
  switching-devices:
    body_ko: 'Power diode는 전류 방향을 수동으로 정하고, MOSFET과 IGBT는 Gate 신호로 전류를 끊고 잇는다. MOSFET의 저항성 도통 특성과 IGBT의 포화전압 특성을 구분한 뒤, Turn-on과 Turn-off 동안 전압과 전류가 겹치는 Switching trajectory를 보면 소자 선택과 손실 계산이 한 흐름으로 연결된다.'
    body_en: 'A power diode passively fixes the current direction, while MOSFETs and IGBTs interrupt or establish current through gate commands. Separating MOSFET resistive conduction from IGBT saturation voltage and then tracing the voltage-current overlap during turn-on and turn-off connects device choice directly to loss analysis.'
    anchor_ko: '스위칭 1회의 에너지는 E_sw = integral(v_D(t) i_D(t) dt)로 볼 수 있으며, v-i 평면의 궤적이 넓어질수록 한 번의 전환에서 겹침 손실이 커진다.'
    anchor_en: 'One switching event can be framed as E_sw = integral(v_D(t) i_D(t) dt); a wider trajectory in the v-i plane means more overlap energy during the transition.'
    practice_ko: '정격전압과 RMS 전류만 보지 않고 Gate 구동전압, dv/dt, di/dt, 역회복 전류까지 같은 스위칭 구간에 표시해 소자별 취약 조건을 점검한다.'
    practice_en: 'Check rated voltage and RMS current together with gate-drive voltage, dv/dt, di/dt, and reverse-recovery current on the same switching interval to expose each device constraint.'
  device-loss-thermal:
    body_ko: 'On-state loss는 도통 중 전압강하에서, Turn-on loss와 Turn-off loss는 전환 구간의 전압·전류 겹침에서 생긴다. 이 세 손실의 합이 열원으로 Junction temperature를 올리므로 전기 파형과 열저항망을 따로 계산하면 안 된다.'
    body_en: 'On-state loss comes from the conducting voltage drop, whereas turn-on and turn-off losses arise from voltage-current overlap during transitions. Their sum becomes the heat source that raises junction temperature, so the electrical waveform and thermal-resistance network must be evaluated together.'
    anchor_ko: 'MOSFET은 P_cond = I_rms^2 R_DS(on), 스위칭은 P_sw = f_s(E_on + E_off), 열은 T_j = T_a + P_loss R_thetaJA로 1차 점검할 수 있다.'
    anchor_en: 'First-pass checks are P_cond = I_rms^2 R_DS(on) for a MOSFET, P_sw = f_s(E_on + E_off) for switching, and T_j = T_a + P_loss R_thetaJA for the thermal path.'
    practice_ko: '상온 정격값 대신 예상 최고 Junction temperature에서의 R_DS(on) 또는 V_CE(sat)를 넣고, 방열판·PCB·주변온도를 포함한 열경로에 여유가 남는지 확인한다.'
    practice_en: 'Use R_DS(on) or V_CE(sat) at the expected hot junction rather than the room-temperature headline value, then check margin across the heatsink, PCB, and ambient thermal path.'
  diode-rectifiers:
    body_ko: 'Single-phase bridge는 반주기마다 두 diode가 전류를 이어 주고, Three-phase bridge는 가장 높은 상과 가장 낮은 상이 차례로 DC 단자에 연결된다. Source inductance가 있으면 전류가 즉시 넘어가지 않아 Commutation overlap이 생기며, 그 구간이 평균 DC 전압과 Ripple에 함께 영향을 준다.'
    body_en: 'A single-phase bridge conducts through two diodes each half-cycle, while a three-phase bridge successively connects the highest and lowest phases to the DC terminals. Source inductance prevents instantaneous current transfer, creating commutation overlap that changes both average DC voltage and ripple.'
    anchor_ko: '이상적인 capacitor 없는 전파정류의 평균값은 V_dc = 2 V_m/pi이고, 이상적인 3상 6-pulse bridge는 V_dc 약 1.35 V_LL로 정리된다.'
    anchor_en: 'For ideal full-wave rectification without a smoothing capacitor, V_dc = 2 V_m/pi; an ideal three-phase six-pulse bridge gives approximately V_dc = 1.35 V_LL.'
    practice_ko: '각 60도 또는 180도 구간의 실제 전류 경로를 먼저 그린 뒤 Source inductance의 전압강하와 capacitor 충전 pulse가 입력전류 파형을 어떻게 바꾸는지 점검한다.'
    practice_en: 'Draw the conducting path for each 60-degree or 180-degree interval, then inspect how source-inductance drop and capacitor charging pulses reshape the input-current waveform.'
  controlled-rectifiers:
    body_ko: 'Thyristor는 순방향전압만으로 켜지지 않고 Firing angle의 Gate pulse 이후에 도통한다. 따라서 점호를 늦추면 평균 출력전압이 바뀌며, 기존 소자에서 다음 소자로 전류가 넘어가는 Commutation 조건이 부하전류의 연속성과 함께 결정된다.'
    body_en: 'A thyristor does not turn on from forward voltage alone; it conducts after a gate pulse at the firing angle. Delaying that pulse changes average output voltage, while commutation from one device to the next depends on load-current continuity.'
    anchor_ko: '연속전류를 가정한 단상 전제어 bridge의 이상 평균값은 V_dc = (2 V_m/pi) cos(alpha)이므로 alpha = 90도 전후에서 전력 흐름의 부호가 갈리는 이유를 식으로 확인할 수 있다.'
    anchor_en: 'With continuous current, an ideal single-phase fully controlled bridge has V_dc = (2 V_m/pi) cos(alpha), which shows why the power-flow sign changes around alpha = 90 degrees.'
    practice_ko: 'Gate pulse 순서, 최소 pulse 폭, 가능한 alpha 범위와 Commutation overlap을 한 주기 도통표에 넣고 부하전류가 불연속일 때 식의 가정이 깨지는지 확인한다.'
    practice_en: 'Place gate sequence, minimum pulse width, allowed alpha range, and commutation overlap on one conduction table, then identify where discontinuous load current invalidates the average-voltage assumption.'
  buck-converter:
    body_ko: 'Buck Converter에서 switch ON 동안 inductor가 Vin과 Vout의 차로 충전되고, OFF 동안 freewheel 경로로 에너지를 내보낸다. Duty ratio가 평균전압을 정하지만 Inductor ripple이 0에 닿는지에 따라 CCM과 DCM이 갈리고, Output capacitor가 남은 전류 차이를 받아 출력 ripple을 줄인다.'
    body_en: 'In a buck converter, the inductor charges from the Vin-to-Vout difference while the switch is on and releases energy through the freewheel path while it is off. Duty ratio sets the average voltage, but whether inductor ripple reaches zero separates CCM from DCM, and the output capacitor absorbs the remaining current mismatch.'
    anchor_ko: '이상적인 CCM에서 V_out = D V_in이고, ON 구간의 전류 변화는 Delta I_L = (V_in - V_out)D/(L f_s)로 계산한다.'
    anchor_en: 'For ideal CCM operation, V_out = D V_in, and the on-interval current change is Delta I_L = (V_in - V_out)D/(L f_s).'
    practice_ko: '최소 부하에서 I_L,min이 0보다 큰지, capacitor ESR을 포함한 출력 ripple과 switch·diode의 peak current가 정격 안에 있는지 같은 계산표에서 확인한다.'
    practice_en: 'At minimum load, check whether I_L,min stays above zero and whether output ripple including capacitor ESR and switch-diode peak currents remain within ratings on the same design sheet.'
  boost-converter:
    body_ko: 'Boost Converter는 switch ON 동안 diode를 막고 inductor에 에너지를 저장한 뒤, OFF 동안 입력과 inductor 전압을 더해 capacitor와 부하로 보낸다. 이 두 상태의 volt-second balance가 Step-up ratio를 만들며, 출력전압이 diode와 switch stress의 기준이 된다.'
    body_en: 'A boost converter blocks the diode and stores energy in the inductor during switch on-time, then adds the input and inductor voltages to feed the capacitor and load during off-time. Volt-second balance across these states creates the step-up ratio, while output voltage sets the main diode and switch stress.'
    anchor_ko: '이상적인 CCM에서 V_out = V_in/(1-D)이고, ON 구간의 ripple은 Delta I_L = V_in D/(L f_s)이다.'
    anchor_en: 'For ideal CCM operation, V_out = V_in/(1-D), and the on-interval ripple is Delta I_L = V_in D/(L f_s).'
    practice_ko: 'ON·OFF 등가회로에 inductor 전류 방향을 표시하고, 최대 Duty에서 switch 전압, diode 역전압, inductor peak current가 동시에 만족되는지 점검한다.'
    practice_en: 'Mark inductor-current direction on the on-state and off-state circuits, then verify switch voltage, diode reverse voltage, and inductor peak current together at maximum duty.'
  buck-boost-converter:
    body_ko: 'Inverting Buck-Boost는 저장과 전달을 분리해 출력 극성을 뒤집고, Flyback은 같은 원리를 결합 inductor와 권선비로 확장해 Transformer isolation을 얻는다. 대신 누설 inductance와 권선비가 switch·diode의 Device stress를 키우므로 이상적인 변환비만 보면 부족하다.'
    body_en: 'An inverting buck-boost separates energy storage from delivery and reverses output polarity; a flyback extends the same idea with coupled inductance and turns ratio to obtain transformer isolation. Leakage inductance and turns ratio also increase switch and diode stress, so the ideal conversion ratio is not sufficient for design.'
    anchor_ko: '이상적인 inverting CCM의 변환비는 V_out/V_in = -D/(1-D)이며, Flyback에서는 여기에 2차측 대 1차측 권선비가 곱해진다.'
    anchor_en: 'The ideal inverting CCM ratio is V_out/V_in = -D/(1-D); a flyback additionally scales this relation by the secondary-to-primary turns ratio.'
    practice_ko: 'Dot polarity와 ON·OFF 전류경로, Core reset, 누설에너지 clamp를 한 도면에 표시하고 최악 Duty에서 flux와 Device stress가 허용 범위인지 확인한다.'
    practice_en: 'Put dot polarity, on/off current paths, core reset, and the leakage-energy clamp on one schematic, then check flux and device stress at worst-case duty.'
  converter-control:
    body_ko: 'Small-signal model은 정상 Duty 주변의 작은 변화가 출력에 전달되는 경로를 선형화한다. Voltage-mode control은 출력전압 오차로 Duty를 직접 조절하고, Current-mode control은 내부 전류 ramp를 더해 plant의 차수와 과도응답을 바꾸며, Loop compensation이 원하는 crossover와 안정여유를 만든다.'
    body_en: 'A small-signal model linearizes how a small duty perturbation around an operating point reaches the output. Voltage-mode control drives duty from voltage error, current-mode control adds an inner current ramp that changes plant order and transient behavior, and loop compensation sets crossover and stability margin.'
    anchor_ko: '개방루프 T(s) = G_c(s) G_vd(s) H(s)를 기준으로 0 dB crossover에서 위상여유를 읽고, current-mode의 Duty가 0.5를 넘는 구간에서는 slope compensation 필요성도 함께 본다.'
    anchor_en: 'Use T(s) = G_c(s) G_vd(s) H(s) to read phase margin at the 0 dB crossover, and also examine slope-compensation need when current-mode duty exceeds 0.5.'
    practice_ko: 'Crossover를 switching frequency보다 충분히 낮게 두고 DC 정확도, 출력 LC pole, ESR zero, sampling delay가 Bode plot에서 같은 설계 목표를 만족하는지 확인한다.'
    practice_en: 'Keep crossover well below switching frequency and verify on one Bode plot that DC accuracy, the output-LC pole, capacitor-ESR zero, and sampling delay meet the same control target.'
  single-phase-inverter:
    body_ko: 'Half bridge는 분할 DC-link의 중점을 기준으로 두 전압을 만들고, Full bridge는 두 leg의 차로 출력 극성을 바꾼다. Bipolar PWM은 출력이 +Vdc와 -Vdc 사이를 직접 오가지만 Unipolar PWM은 0 상태를 더 사용해 유효 ripple 주파수와 공통모드 특성을 바꾼다.'
    body_en: 'A half bridge produces two voltage levels around the split DC-link midpoint, while a full bridge changes output polarity through the difference between two legs. Bipolar PWM switches directly between +Vdc and -Vdc; unipolar PWM also uses zero states, changing effective ripple frequency and common-mode behavior.'
    anchor_ko: 'Full bridge의 부하전압은 v_ab = v_aN - v_bN이며, sinusoidal PWM의 선형영역에서는 fundamental 성분이 modulation index에 비례한다.'
    anchor_en: 'Full-bridge load voltage is v_ab = v_aN - v_bN, and within the linear sinusoidal-PWM range the fundamental component scales with modulation index.'
    practice_ko: '두 leg의 Gate waveform과 v_ab를 나란히 그려 shoot-through 금지구간, zero state, fundamental과 switching sideband가 PWM 방식별로 어떻게 달라지는지 점검한다.'
    practice_en: 'Draw both leg-gate waveforms beside v_ab and compare shoot-through exclusion, zero states, the fundamental, and switching sidebands for bipolar and unipolar PWM.'
  three-phase-inverter:
    body_ko: 'Three-Phase Inverter의 세 leg는 여섯 active Space vector와 두 zero vector를 만든다. Six-step switching은 vector를 고정 순서로 사용하고, PWM은 각 vector의 dwell time을 조절하며, Line voltage는 두 상 pole voltage의 차이로 나타난다. Dead time은 같은 leg의 단락을 막지만 전압 오차를 만든다.'
    body_en: 'The three legs of a three-phase inverter create six active space vectors and two zero vectors. Six-step switching uses them in a fixed order, PWM adjusts vector dwell times, and line voltage is the difference between two phase pole voltages. Dead time prevents leg shoot-through but introduces voltage error.'
    anchor_ko: '각 선간전압은 v_ab = v_aN - v_bN처럼 계산하며, Space-vector plane에서는 기준 vector를 인접한 두 active vector와 zero vector의 시간 합으로 합성한다.'
    anchor_en: 'Each line voltage follows a relation such as v_ab = v_aN - v_bN; in the space-vector plane, the reference is synthesized from dwell times of two adjacent active vectors and a zero vector.'
    practice_ko: '한 switching period의 vector 순서와 dwell time 합을 확인하고, 상·하 switch가 동시에 켜지지 않는지와 Dead-time polarity 오차가 전류 방향에 따라 바뀌는지 점검한다.'
    practice_en: 'Check vector order and total dwell time over one switching period, ensure upper and lower devices never overlap, and inspect how dead-time voltage error changes with current direction.'
  filters-harmonics:
    body_ko: 'LC filter는 switching ripple을 감쇠하지만 고유 Resonance를 만들고, LCL filter는 고주파 감쇠를 더 높이는 대신 추가 공진모드를 갖는다. THD는 fundamental에 대한 harmonic RMS 비를 수치화하며, Resonance damping은 저항 또는 제어로 peak를 낮춘다.'
    body_en: 'An LC filter attenuates switching ripple but creates a natural resonance; an LCL filter provides steeper high-frequency attenuation at the cost of another resonant mode. Total harmonic distortion compares harmonic RMS content with the fundamental, and resonance damping reduces the peak through resistance or control.'
    anchor_ko: '단순 LC의 공진주파수는 f_0 = 1/(2 pi sqrt(LC))이고, THD = sqrt(sum from n=2 of V_n^2)/V_1로 정의한다.'
    anchor_en: 'A simple LC filter has f_0 = 1/(2 pi sqrt(LC)), and THD = sqrt(sum from n=2 of V_n^2)/V_1.'
    practice_ko: '공진주파수가 fundamental과 switching band에서 충분히 떨어지는지, capacitor ripple current와 inductor 포화, 수동 또는 능동 damping의 손실·안정성 trade-off를 함께 확인한다.'
    practice_en: 'Verify resonance separation from both fundamental and switching bands, then check capacitor ripple current, inductor saturation, and the loss-stability trade-off of passive or active damping.'
  protection-design:
    body_ko: 'Overcurrent 보호는 반도체가 견디기 전에 fault를 검출하고 Gate를 차단해야 한다. Snubber는 turn-off의 dv/dt와 누설 inductance spike를 제한하고, Gate isolation은 제어 기준전위와 power stage를 분리하며, 최종 Thermal margin은 반복 fault와 정상 손실을 모두 흡수해야 한다.'
    body_en: 'Overcurrent protection must detect a fault and remove gate drive before the semiconductor limit is exceeded. A snubber constrains turn-off dv/dt and leakage-inductance spikes, gate isolation separates control reference from the power stage, and final thermal margin must cover both normal loss and repeated fault stress.'
    anchor_ko: '1차 열점검은 T_j,max > T_a,max + P_loss R_theta,total이며, RC snubber의 시정수 tau = RC는 억제하려는 ringing 주기와 함께 선택한다.'
    anchor_en: 'A first thermal check is T_j,max > T_a,max + P_loss R_theta,total, while the RC-snubber time constant tau = RC is selected with respect to the ringing period being damped.'
    practice_ko: '과전류 threshold·blanking·shutdown 순서, 절연 내압과 creepage, Snubber 부품 pulse 정격, 냉각 고장 시 Junction temperature를 하나의 fault matrix로 점검한다.'
    practice_en: 'Review overcurrent threshold, blanking, and shutdown order together with isolation voltage, creepage, snubber pulse ratings, and junction temperature under cooling failure in one fault matrix.'

electrical-machines:
  magnetic-circuits:
    body_ko: 'Magnetomotive force가 magnetic path에 Flux를 만들고, Reluctance가 그 흐름을 제한하며, 단면적으로 나눈 Flux가 Flux density가 된다. Air gap은 투자율이 낮아 전체 Reluctance를 크게 지배하므로 같은 권선전류에서도 필요한 MMF와 저장에너지를 바꾼다.'
    body_en: 'Magnetomotive force drives flux through a magnetic path, reluctance opposes that flux, and flux divided by area gives flux density. Because an air gap has low permeability, it often dominates total reluctance and changes both required MMF and stored energy for the same winding current.'
    anchor_ko: 'F = NI, R_m = l/(mu A), Phi = F/R_m, B = Phi/A를 연속으로 쓰면 전기회로의 전압·저항·전류 대응관계를 이용해 자기회로를 계산할 수 있다.'
    anchor_en: 'The chain F = NI, R_m = l/(mu A), Phi = F/R_m, and B = Phi/A exposes the magnetic-circuit analogy to voltage, resistance, and current.'
    practice_ko: 'Core와 Air gap의 길이·단면적을 따로 넣고, fringing을 무시한 1차 계산 뒤 B가 재료의 포화영역에 들어가는지 확인한다.'
    practice_en: 'Enter core and air-gap lengths and areas separately, make a first calculation without fringing, and then check whether B enters the material saturation region.'
  magnetic-materials:
    body_ko: 'B-H curve의 기울기는 동작점의 투자율을, loop 면적은 주기당 Hysteresis 에너지를 보여 준다. 시간에 따라 변하는 Flux는 Core 안에 Eddy current를 만들며, 적층 두께와 주파수가 커질수록 이 손실이 증가해 전체 Core loss를 구성한다.'
    body_en: 'The slope of the B-H curve indicates permeability around an operating point, while loop area represents hysteresis energy per cycle. Time-varying flux induces eddy currents in the core, and increasing lamination thickness or frequency raises that contribution to total core loss.'
    anchor_ko: 'Core loss는 보통 P_core = P_h + P_e로 나누며, 경향 비교에서는 P_h가 f와 B의 지수에, P_e가 대략 f^2 B^2 t^2에 강하게 의존한다고 본다.'
    anchor_en: 'Core loss is commonly separated as P_core = P_h + P_e; for trend checks, hysteresis depends on powers of f and B, while eddy-current loss scales roughly with f^2 B^2 t^2.'
    practice_ko: '재료표의 허용 Flux density를 확인하고 같은 volt-second에서 주파수, Core 단면적, 적층 두께를 바꿀 때 B-H 동작점과 온도상승 경향이 어떻게 달라지는지 비교한다.'
    practice_en: 'Check allowable flux density from material data, then compare how frequency, core area, and lamination thickness shift the B-H operating point and heating trend at the same volt-second excitation.'
  transformer-principles:
    body_ko: 'Faraday law에 따라 1차 권선의 교번 Flux가 양 권선에 전압을 유도하고, Turns ratio가 전압·전류 비를 정한다. 부하 impedance를 한쪽으로 Referred하면 권선비의 제곱이 곱해지며, Dot polarity가 순간 전압의 같은 극성을 표시한다.'
    body_en: 'By Faraday law, alternating primary flux induces voltage in both windings, and turns ratio sets voltage and current ratios. Referring a load impedance to the other side multiplies it by the square of turns ratio, while dot polarity marks corresponding instantaneous voltage polarity.'
    anchor_ko: 'e = N dPhi/dt, V_1/V_2 = N_1/N_2 = a, Z_2를 1차로 환산하면 Z_2_prime = a^2 Z_2가 된다.'
    anchor_en: 'The key relations are e = N dPhi/dt, V_1/V_2 = N_1/N_2 = a, and Z_2 referred to the primary as Z_2_prime = a^2 Z_2.'
    practice_ko: 'Dot 방향과 기준전류를 먼저 표시한 뒤 전압비, 전류비, 환산 impedance가 power conservation과 일치하는지 확인한다.'
    practice_en: 'Mark dot orientation and reference currents first, then verify that voltage ratio, current ratio, and referred impedance remain consistent with power conservation.'
  transformer-equivalent:
    body_ko: 'Winding resistance는 copper loss를, Leakage reactance는 결합되지 않은 Flux의 전압강하를 나타낸다. Magnetizing branch의 R_c와 X_m은 각각 Core loss와 자화전류를 모델링하며, Referred circuit에서는 모든 impedance를 같은 권선 기준으로 옮겨 KVL을 적용한다.'
    body_en: 'Winding resistance represents copper loss, and leakage reactance represents voltage drop from uncoupled flux. In the magnetizing branch, R_c models core loss and X_m models magnetizing current; the referred circuit moves every impedance to one winding base before applying KVL.'
    anchor_ko: '2차 series impedance를 1차로 옮길 때 R_2_prime = a^2 R_2, X_2_prime = a^2 X_2이며, shunt branch는 입력전압에 병렬로 놓는 근사모델을 쓴다.'
    anchor_en: 'When secondary series impedance is referred to the primary, R_2_prime = a^2 R_2 and X_2_prime = a^2 X_2; the approximate model places the shunt branch across the input.'
    practice_ko: '회로를 어느 쪽 기준으로 환산했는지 제목에 적고, 각 resistance·reactance의 단위와 전압강하 합이 단자전압 식을 만족하는지 점검한다.'
    practice_en: 'Label the chosen referral side, then check units of every resistance and reactance and confirm that summed voltage drops satisfy the terminal-voltage equation.'
  transformer-tests:
    body_ko: 'Open-circuit test는 낮은 전류에서 Core loss와 Magnetizing branch를 주로 드러내고, Short-circuit test는 낮은 인가전압으로 정격전류를 흘려 Winding resistance와 Leakage reactance를 추출한다. 두 시험의 계기 오차와 온도는 Parameter extraction 불확실성으로 이어진다.'
    body_en: 'The open-circuit test mainly exposes core loss and the magnetizing branch at low current, while the short-circuit test applies low voltage to circulate rated current and extract winding resistance and leakage reactance. Instrument error and temperature propagate into parameter-extraction uncertainty.'
    anchor_ko: '무부하에서 R_c = V_oc^2/P_oc, I_w = P_oc/V_oc, X_m = V_oc/sqrt(I_oc^2-I_w^2)로 구하고, 단락에서 Z_eq = V_sc/I_sc와 R_eq = P_sc/I_sc^2를 이용한다.'
    anchor_en: 'From open circuit, use R_c = V_oc^2/P_oc, I_w = P_oc/V_oc, and X_m = V_oc/sqrt(I_oc^2-I_w^2); from short circuit, use Z_eq = V_sc/I_sc and R_eq = P_sc/I_sc^2.'
    practice_ko: '계기 범위와 기준 권선, 단상·3상 값의 구분을 기록하고 X_eq = sqrt(Z_eq^2-R_eq^2)가 실수가 되는지와 온도보정 필요성을 확인한다.'
    practice_en: 'Record meter ranges, reference winding, and whether values are per phase or three phase; then check that X_eq = sqrt(Z_eq^2-R_eq^2) is real and whether resistance needs temperature correction.'
  regulation-efficiency:
    body_ko: 'Copper loss는 부하전류의 제곱에 따라 변하고 Core loss는 일정 전압·주파수에서 대체로 고정된다. 두 손실이 Efficiency를 정하며, 부하 Power factor는 series impedance 전압강하의 위상을 바꾸어 Voltage regulation의 부호와 크기에 영향을 준다.'
    body_en: 'Copper loss varies with load current squared, while core loss is approximately fixed at constant voltage and frequency. Together they set efficiency, and load power factor changes the phase of series-impedance voltage drop, affecting both magnitude and sign of voltage regulation.'
    anchor_ko: 'eta = P_out/(P_out + P_core + P_cu)이고 Voltage regulation은 (V_noload - V_load)/V_load로 본다. 같은 전압에서 Maximum efficiency 조건은 가변 copper loss와 고정 core loss가 같을 때다.'
    anchor_en: 'Use eta = P_out/(P_out + P_core + P_cu) and voltage regulation = (V_noload - V_load)/V_load. At constant voltage, maximum efficiency occurs when variable copper loss equals fixed core loss.'
    practice_ko: '지상·진상 Power factor를 각각 대입해 regulation 곡선을 그리고, 부하율에 따른 P_cu와 P_core의 교차점이 효율 최대 조건과 맞는지 확인한다.'
    practice_en: 'Plot regulation for lagging and leading power factor, then check whether the crossing of load-dependent P_cu and fixed P_core agrees with the maximum-efficiency condition.'
  three-phase-transformers:
    body_ko: 'Y와 Delta 결선은 상전압·선간전압, 상전류·선전류의 관계를 다르게 만들고 특정 Phase displacement를 준다. 세 단상기를 Bank로 묶거나 하나의 3상 Core를 쓰더라도 정격은 선간전압과 선전류에서 계산하며, 결선은 neutral과 고조파 전류 경로도 결정한다.'
    body_en: 'Wye and delta connections create different phase-to-line voltage and current relations and impose a phase displacement. Whether three single-phase units form a bank or one three-phase core is used, rating follows line voltage and line current, and connection also determines neutral and harmonic-current paths.'
    anchor_ko: '평형 3상 정격은 S_3phi = sqrt(3) V_LL I_L이며, Y에서는 V_phase = V_LL/sqrt(3), Delta에서는 I_phase = I_L/sqrt(3)이다.'
    anchor_en: 'Balanced three-phase rating is S_3phi = sqrt(3) V_LL I_L; in wye, V_phase = V_LL/sqrt(3), while in delta, I_phase = I_L/sqrt(3).'
    practice_ko: 'Vector group의 clock notation과 Dot polarity를 phasor로 다시 그리고, 권선별 상전압·상전류가 개별 권선 정격을 넘지 않는지 확인한다.'
    practice_en: 'Redraw vector-group clock notation with dot polarity as phasors, then verify that phase voltage and current on each winding remain within individual winding ratings.'
  rotating-fields:
    body_ko: '공간적으로 120도 떨어진 권선에 시간적으로 120도 어긋난 Three-phase current를 흘리면 크기가 거의 일정한 Air-gap field가 회전한다. 회전속도는 주파수와 Pole count로 정해지고, 상순서를 바꾸면 field 방향이 반전된다.'
    body_en: 'Three-phase currents displaced by 120 electrical degrees in time, applied to windings displaced by 120 degrees in space, create an almost constant-magnitude rotating air-gap field. Frequency and pole count set its speed, and reversing phase sequence reverses field direction.'
    anchor_ko: '동기속도는 n_s = 120 f/P rpm이며, 2극·4극처럼 Pole count가 늘어나면 같은 주파수에서 회전속도는 반비례해 낮아진다.'
    anchor_en: 'Synchronous speed is n_s = 120 f/P rpm, so increasing pole count from two to four at fixed frequency halves the field speed.'
    practice_ko: 'a-b-c와 a-c-b 상순서의 세 정현파를 같은 축에 놓고 각 시점의 MMF vector 합을 그려 회전방향과 일정한 크기를 확인한다.'
    practice_en: 'Place a-b-c and a-c-b current sets on the same time axis and sum their MMF vectors at selected instants to verify direction reversal and near-constant magnitude.'
  induction-machines:
    body_ko: 'Induction Machine에서는 rotor가 Synchronous speed와 같아지면 유도전압과 torque가 사라지므로 Slip이 필요하다. Slip이 Rotor frequency를 정하고 rotor impedance를 바꾸어 Torque-speed curve를 만들며, 정지 시 slip 1에서 Starting current가 크게 나타난다.'
    body_en: 'An induction machine needs slip because induced voltage and torque vanish if the rotor reaches synchronous speed. Slip sets rotor frequency and effective rotor impedance, shaping the torque-speed curve; at standstill, slip equals one and starting current is large.'
    anchor_ko: 's = (n_s - n_r)/n_s, f_r = s f_s이며, motoring 영역에서는 0 < s < 1이다.'
    anchor_en: 'The defining relations are s = (n_s - n_r)/n_s and f_r = s f_s; normal motoring lies in 0 < s < 1.'
    practice_ko: '기동, 정격부근, breakdown torque 지점을 curve에 표시하고 각 지점의 slip·rotor frequency·전류 경향이 equivalent circuit과 일치하는지 점검한다.'
    practice_en: 'Mark starting, near-rated, and breakdown-torque points on the curve, then check whether slip, rotor frequency, and current trends agree with the equivalent circuit at each point.'
  synchronous-machines:
    body_ko: 'Synchronous Machine은 rotor Excitation이 만든 field가 stator 회전자계와 같은 속도로 잠긴다. 내부기전력의 크기를 바꾸면 무효전력과 Power factor control이 가능하고, 부하각이 커질수록 Power-angle relation의 유효전력이 증가하다 Pull-out torque 한계에 접근한다.'
    body_en: 'In a synchronous machine, the rotor field created by excitation locks to the stator rotating field. Changing internal-emf magnitude controls reactive power and power factor, while increasing load angle raises real power according to the power-angle relation until pull-out torque is approached.'
    anchor_ko: '저항을 무시한 원통형 기기의 3상 유효전력은 P 약 3VE/X_s sin(delta)로 보며, delta = 90도 부근이 이상적인 정태 안정 한계다.'
    anchor_en: 'For a cylindrical machine with resistance neglected, three-phase real power is approximately P = 3VE/X_s sin(delta), with the ideal steady-state limit near delta = 90 degrees.'
    practice_ko: 'Generator와 motor의 전류·전력 부호 기준을 먼저 정하고 Excitation 변화가 phasor, reactive power, Power factor에 주는 영향을 같은 그림에서 확인한다.'
    practice_en: 'Choose generator or motor current and power sign conventions first, then inspect how excitation changes the phasor, reactive power, and power factor on one diagram.'
  dc-machines:
    body_ko: 'DC Machine에서 Field winding의 Flux와 회전속도가 Back EMF를 만들고, armature current와 Flux의 곱이 Electromagnetic torque를 만든다. 전원전압에서 저항강하와 Back EMF를 뺀 값이 전류를 정하므로 Flux·부하 torque·Speed characteristic이 서로 묶인다.'
    body_en: 'In a DC machine, field-winding flux and rotor speed produce back EMF, while flux times armature current produces electromagnetic torque. Armature current follows from supply voltage minus resistance drop and back EMF, coupling flux, load torque, and the speed characteristic.'
    anchor_ko: 'E_a = k_e Phi omega, T_e = k_t Phi I_a, V_a = E_a + I_a R_a를 결합하면 일정 Flux에서 speed가 대략 (V_a - I_a R_a)/(k_e Phi)로 정리된다.'
    anchor_en: 'Combining E_a = k_e Phi omega, T_e = k_t Phi I_a, and V_a = E_a + I_a R_a gives speed approximately as (V_a - I_a R_a)/(k_e Phi) at constant flux.'
    practice_ko: '기동 시 omega = 0이라 Back EMF가 없는 조건을 넣어 armature current를 계산하고, 기동저항 또는 전류제한이 필요한 이유를 정격전류와 비교한다.'
    practice_en: 'Set omega = 0 at startup so back EMF is absent, calculate armature current, and compare it with rated current to establish the need for starting resistance or active current limiting.'
  transformer-calculation-review:
    body_ko: '변압기 계산기를 다시 읽을 때는 입력값 정의와 기준 권선을 먼저 고정해야 한다. 그다음 Equivalent-circuit calculation의 각 중간값에 단위를 붙이고, 최종값만이 아니라 Report-calculation comparison에서 같은 가정과 반올림을 사용했는지 확인한다.'
    body_en: 'When re-reading a transformer calculator, first fix every input definition and the reference winding. Then attach units to each equivalent-circuit intermediate value and verify in the report-calculation comparison that both sides use the same assumptions and rounding, not merely the same final number.'
    anchor_ko: '권선비 a, 환산 impedance a^2 Z, per-unit base Z_base = V_base^2/S_base를 순서대로 기록하면 기준 변경과 단위 누락을 추적하기 쉽다.'
    anchor_en: 'Recording turns ratio a, referred impedance a^2 Z, and per-unit base Z_base = V_base^2/S_base in order makes base changes and missing units easier to trace.'
    practice_ko: '입력 표, 중간 계산, 보고서 표를 한 줄씩 대조하고 전압은 V, impedance는 ohm, 손실은 W인지 확인한 뒤 한 입력값을 바꿨을 때 관련 출력만 물리적으로 맞는 방향으로 변하는지 점검한다.'
    practice_en: 'Compare the input table, intermediate calculation, and report row by row; check V, ohm, and W units, then vary one input and confirm that only related outputs move in a physically consistent direction.'

motor-control:
  dc-motor-model:
    body_ko: 'Armature equation은 인가전압이 저항강하, inductance 전압, Back EMF로 나뉘는 전기 동역학을 나타낸다. Torque constant가 armature current를 torque로 바꾸고, Inertia와 Friction이 Load torque와 함께 speed 변화를 정하므로 전기식과 기계식을 동시에 풀어야 한다.'
    body_en: 'The armature equation divides applied voltage among resistance drop, inductive voltage, and back EMF. The torque constant converts armature current into torque, while inertia and friction combine with load torque to determine speed change, so the electrical and mechanical equations must be solved together.'
    anchor_ko: 'V_a = R_a i_a + L_a di_a/dt + k_e omega와 J d_omega/dt = k_t i_a - B omega - T_L가 DC motor의 결합 state model을 만든다.'
    anchor_en: 'The coupled state model follows from V_a = R_a i_a + L_a di_a/dt + k_e omega and J d_omega/dt = k_t i_a - B omega - T_L.'
    practice_ko: '각 parameter의 SI 단위를 적고 무부하 정상상태와 rotor 정지 조건에서 미분항을 제거해 식의 부호와 Back EMF 방향이 물리적으로 맞는지 확인한다.'
    practice_en: 'Write SI units for every parameter, remove derivative terms for no-load steady state and locked rotor separately, and verify signs and back-EMF direction against physical behavior.'
  converter-h-bridge:
    body_ko: 'H-Bridge의 두 leg를 조합하면 motor 단자전압과 전류의 부호를 독립적으로 바꾸어 Four-quadrant drive가 가능하다. PWM duty가 평균전압을 정하고, switch가 꺼질 때 inductive current는 Freewheeling path를 따라 흐르며 감속에너지는 DC-link voltage 쪽으로 회생될 수 있다.'
    body_en: 'Combining two H-bridge legs allows independent signs of motor terminal voltage and current, enabling four-quadrant drive. PWM duty sets average voltage, inductive current follows a freewheeling path when switches turn off, and deceleration energy can regenerate into the DC link.'
    anchor_ko: 'Bipolar 구동의 이상 평균 motor 전압은 v_a,avg = (2D-1)V_dc로 볼 수 있으며, 전압과 전류의 부호 조합이 motoring과 regeneration 사분면을 구분한다.'
    anchor_en: 'For ideal bipolar drive, average motor voltage can be written v_a,avg = (2D-1)V_dc; the signs of voltage and current distinguish motoring and regeneration quadrants.'
    practice_ko: '네 사분면마다 켜지는 switch와 diode 전류경로를 그리고, 같은 leg의 shoot-through 방지 Dead time과 회생 시 DC-link 과전압 경로를 점검한다.'
    practice_en: 'Draw switch and diode current paths for all four quadrants, then check same-leg dead time and the DC-link overvoltage path during regeneration.'
  current-loop:
    body_ko: 'Back EMF를 느린 disturbance로 보면 전류 Plant는 armature R-L 회로가 된다. Current Loop의 Bandwidth를 충분히 높이면 torque command를 빠르게 따르지만, Current limit와 Sampling delay가 실제 가능한 응답속도를 제한한다.'
    body_en: 'Treating back EMF as a slower disturbance leaves the armature R-L circuit as the current plant. A high current-loop bandwidth makes torque command tracking fast, but current limit and sampling delay bound the achievable response.'
    anchor_ko: '전압에서 전류까지의 근사 Plant는 G_i(s) = 1/(L_a s + R_a)이고 electrical time constant는 tau_e = L_a/R_a이다.'
    anchor_en: 'The approximate voltage-to-current plant is G_i(s) = 1/(L_a s + R_a), with electrical time constant tau_e = L_a/R_a.'
    practice_ko: '목표 crossover를 switching·sampling frequency보다 낮게 두고 step torque 명령에서 peak current가 Current limit를 넘지 않는지, sensor filter delay가 phase margin을 잠식하지 않는지 확인한다.'
    practice_en: 'Keep target crossover below switching and sampling frequencies, then check peak current against the limit for a torque step and account for phase-margin loss from the sensor filter.'
  speed-loop:
    body_ko: 'Current Loop가 torque를 빠르게 만든다는 전제에서 Speed Loop의 기계 Plant는 Inertia와 Friction으로 정리된다. Speed feedback 오차가 torque 명령을 만들고, Load torque 변화는 disturbance로 들어오며, Response time은 기계 time constant와 외부 loop bandwidth가 좌우한다.'
    body_en: 'Assuming the current loop produces torque quickly, the speed-loop mechanical plant reduces to inertia and friction. Speed-feedback error creates a torque command, load torque enters as a disturbance, and response time depends on the mechanical time constant and outer-loop bandwidth.'
    anchor_ko: 'Torque에서 speed까지 G_omega(s) = 1/(J s + B)이고 tau_m = J/B이므로 Current Loop보다 느린 crossover를 잡아 cascade 가정을 지킨다.'
    anchor_en: 'Torque-to-speed dynamics are G_omega(s) = 1/(J s + B), with tau_m = J/B, so the crossover must be slower than the current loop to preserve the cascade assumption.'
    practice_ko: 'Speed reference step과 Load torque step을 구분해 예상 파형을 그리고, 전류제한에 걸린 동안의 가속기울기와 제한 해제 뒤 Response time을 따로 점검한다.'
    practice_en: 'Sketch expected waveforms for a speed-reference step and a load-torque step separately, then inspect acceleration slope during current limiting and response time after the limit clears.'
  pi-controller:
    body_ko: 'Proportional gain은 현재 오차에 즉시 반응하고 Integral gain은 누적 오차를 제거한다. 두 값의 비가 PI zero를 정하므로 Pole-zero placement와 plant pole의 관계를 먼저 잡아야 하며, Gain unit은 제어대상과 오차 신호의 단위에 따라 달라진다.'
    body_en: 'Proportional gain reacts to present error and integral gain removes accumulated error. Their ratio sets the PI zero, so pole-zero placement relative to the plant pole comes first, and gain units depend on controlled-output and error-signal units.'
    anchor_ko: 'G_PI(s) = K_p + K_i/s = K_p(s + K_i/K_p)/s이며 zero는 s = -K_i/K_p에 놓인다.'
    anchor_en: 'The controller is G_PI(s) = K_p + K_i/s = K_p(s + K_i/K_p)/s, placing its zero at s = -K_i/K_p.'
    practice_ko: 'K_p와 K_i에 전압/전류 또는 torque/speed 단위를 붙이고 연속시간 K_i를 digital 구현에 넣을 때 K_i T_s가 필요한 형식인지 확인한다.'
    practice_en: 'Attach voltage-current or torque-speed units to K_p and K_i, then verify whether the digital implementation expects continuous K_i or the sampled coefficient K_i T_s.'
  cascaded-control:
    body_ko: 'Cascaded control에서는 Inner current loop가 torque를 만들고 Outer speed loop가 그 Torque command를 생성한다. 충분한 Bandwidth separation이 있으면 외부 loop가 내부 loop를 거의 즉시 반응하는 actuator로 볼 수 있지만, 분리가 작으면 Loop interaction이 overshoot와 진동을 키운다.'
    body_en: 'In cascaded control, the inner current loop produces torque and the outer speed loop generates its torque command. Adequate bandwidth separation lets the outer loop treat the inner loop as a nearly immediate actuator; insufficient separation increases loop interaction, overshoot, and oscillation.'
    anchor_ko: '설계 순서는 current loop 폐루프를 먼저 확정한 뒤 그 전달함수를 speed plant에 포함하는 것이며, 일반적으로 omega_ci가 omega_cs보다 여러 배 높도록 둔다.'
    anchor_en: 'The design order is to close the current loop first and include its closed-loop transfer in the speed plant, keeping current crossover several times higher than speed crossover.'
    practice_ko: 'Torque command limiter를 두 loop 사이에 놓고 내부 loop step 응답이 settle된 뒤 외부 loop가 주로 움직이는지, saturation에서 두 integrator가 서로 밀어내지 않는지 확인한다.'
    practice_en: 'Place the torque-command limiter between loops, check that the inner response settles before the outer response dominates, and ensure both integrators do not drive against each other during saturation.'
  saturation-anti-windup:
    body_ko: 'Voltage limit 또는 Current limit에 걸리면 명령과 actuator 출력이 달라지지만 Integrator는 오차를 계속 누적해 windup을 만든다. Back calculation은 포화 전후 명령의 차를 integrator에 되먹여 실제 출력으로 빠르게 돌아오게 한다.'
    body_en: 'When voltage or current limiting separates commanded and actuator output, the integrator can keep accumulating error and wind up. Back calculation feeds the difference between saturated and unsaturated commands into the integrator so it returns toward the realizable output.'
    anchor_ko: 'Back-calculation 형태는 x_i_dot = K_i e + K_aw(u_sat - u_raw)로 쓰며, K_aw가 작으면 회복이 느리고 지나치게 크면 추가적인 빠른 동특성을 만든다.'
    anchor_en: 'A back-calculation form is x_i_dot = K_i e + K_aw(u_sat - u_raw); too little K_aw gives slow recovery, while too much adds an aggressive fast dynamic.'
    practice_ko: '큰 Speed step으로 voltage limit와 current limit가 순서대로 걸리는 상황을 가정하고 raw command, saturated command, integrator state가 제한 해제 후 매끄럽게 합쳐지는지 점검한다.'
    practice_en: 'Assume a large speed step that encounters voltage and current limits in sequence, then inspect whether raw command, saturated command, and integrator state reunite smoothly when limits clear.'
  pwm-ripple:
    body_ko: 'Switching frequency가 높아지면 같은 inductance에서 Current ripple이 줄지만 switching loss는 늘어난다. Timer의 Duty resolution은 작은 전압명령을 표현하는 한계를 만들고, Dead time은 shoot-through를 막는 대신 전류 방향에 따른 평균전압 오차와 저속 torque ripple을 만든다.'
    body_en: 'Raising switching frequency reduces current ripple for the same inductance but increases switching loss. Timer duty resolution limits small voltage commands, and dead time prevents shoot-through while introducing current-direction-dependent average-voltage error and low-speed torque ripple.'
    anchor_ko: '한 PWM 구간의 전류변화는 대략 Delta i = (v_applied - E_back) Delta t/L_a이며, timer count 수가 가능한 Duty step Delta D를 정한다.'
    anchor_en: 'Current change over one PWM interval is approximately Delta i = (v_applied - E_back) Delta t/L_a, while timer-count range sets the available duty step Delta D.'
    practice_ko: '최대 speed와 stall 조건에서 각각 ripple을 계산하고, 최소 pulse width·Dead time·timer resolution을 적용한 뒤 유효 Duty 범위가 요구전압을 표현하는지 확인한다.'
    practice_en: 'Estimate ripple at maximum speed and stall, apply minimum pulse width, dead time, and timer resolution, and then check whether the usable duty range can represent the required voltage.'
  field-weakening:
    body_ko: 'Base speed까지는 Flux를 유지하고 armature voltage로 speed를 높일 수 있지만, 그 이후에는 Back EMF가 Voltage limit에 닿는다. Field weakening은 Flux를 줄여 더 높은 speed를 허용하며, 전류가 제한된 상태에서는 torque가 줄어 Constant-power region에 가까워진다.'
    body_en: 'Up to base speed, flux can remain fixed while armature voltage raises speed; beyond that point, back EMF reaches the voltage limit. Field weakening reduces flux to permit higher speed, and with current limited the available torque falls toward a constant-power region.'
    anchor_ko: 'E = k_e Phi omega가 V_max를 넘지 않도록 Phi를 speed에 반비례해 줄이면 P = T omega가 대략 일정하고 T는 1/omega에 비례해 감소한다.'
    anchor_en: 'Reducing Phi roughly inversely with speed keeps E = k_e Phi omega below V_max; then P = T omega remains approximately constant and torque falls with 1/omega.'
    practice_ko: 'Speed별 Current limit와 Voltage limit를 같은 운전영역에 그려 Base speed 전후의 가능한 torque를 확인하고, 최소 Flux와 과속·정류 한계를 함께 점검한다.'
    practice_en: 'Plot current and voltage limits across speed, identify feasible torque below and above base speed, and include minimum-flux, overspeed, and commutation constraints.'
  sensing-estimation:
    body_ko: 'Current sensor는 shunt 또는 magnetic 방식의 전압을 ADC 값으로 바꾸고, Encoder는 일정 시간의 pulse 수나 edge 간격으로 Speed를 만든다. Filtering은 noise를 줄이지만 delay를 더하므로 Scaling과 offset 보정 뒤 제어 Bandwidth에 맞춰야 한다.'
    body_en: 'A current sensor converts shunt or magnetic sensing into an ADC value, while an encoder derives speed from pulse count over an interval or time between edges. Filtering reduces noise but adds delay, so it follows scaling and offset correction and must fit control bandwidth.'
    anchor_ko: '전류 환산은 i = (ADC_count - offset) V_ref/(ADC_fullscale G R_shunt), encoder speed는 omega = 2 pi Delta count/(N_pulse T_s) 형태로 확인할 수 있다.'
    anchor_en: 'Current scaling can be checked with i = (ADC_count - offset) V_ref/(ADC_fullscale G R_shunt), and encoder speed with omega = 2 pi Delta count/(N_pulse T_s).'
    practice_ko: '0전류 offset, 양·음전류 polarity, encoder wraparound와 저속 quantization을 시험벡터로 만들고 filter cutoff가 Current Loop와 Speed Loop의 위상여유를 해치지 않는지 확인한다.'
    practice_en: 'Create test vectors for zero-current offset, positive-negative polarity, encoder wraparound, and low-speed quantization, then check filter cutoff against current- and speed-loop phase margin.'
  psim-model:
    body_ko: 'PSIM Model에서는 Simulation step이 PWM edge와 전기 time constant를 충분히 나눠야 한다. Reference signal의 변화가 먼저 Current response에 나타나고 그 torque가 Speed response를 만드는 인과관계를 파형 순서로 읽으면 모델 연결 오류를 찾기 쉽다.'
    body_en: 'In a PSIM model, the simulation step must resolve PWM edges and the electrical time constant. Reading waveforms causally from reference signal to current response and then torque-driven speed response makes connection and sign errors easier to find.'
    anchor_ko: '고정 step Delta t는 switching period T_sw보다 충분히 작아야 하며, 전류·speed state update가 같은 sample instant를 쓰는지 time axis에서 확인한다.'
    anchor_en: 'Fixed step Delta t must be sufficiently smaller than switching period T_sw, and the time axis should show whether current and speed state updates use consistent sample instants.'
    practice_ko: 'Reference, limiter 출력, motor voltage, current, speed를 위에서 아래로 정렬하고 step 직후 current가 먼저 변한 뒤 speed slope가 바뀌는 예상 인과관계를 점검한다.'
    practice_en: 'Stack reference, limiter output, motor voltage, current, and speed traces, then check the expected sequence: current changes first after a step, followed by a change in speed slope.'
  tuning-review:
    body_ko: '계산한 PI gain을 Simulation에 넣을 때는 연속·이산 형식과 단위를 먼저 맞춰야 한다. 그 뒤 Overshoot와 Settling time을 읽되, Voltage·Current Limit에 걸린 구간은 선형 설계응답과 분리해야 계산과 파형을 공정하게 비교할 수 있다.'
    body_en: 'Before entering calculated PI gains into a simulation, continuous-discrete form and units must agree. Overshoot and settling time can then be compared, but intervals under voltage or current limits must be separated from the linear design response.'
    anchor_ko: '2차 근사에서는 M_p = exp(-pi zeta/sqrt(1-zeta^2)), 2 percent Settling time은 약 4/(zeta omega_n)이며, limiter가 활성화되면 이 관계의 선형 가정이 성립하지 않는다.'
    anchor_en: 'For a second-order approximation, M_p = exp(-pi zeta/sqrt(1-zeta^2)) and two-percent settling time is about 4/(zeta omega_n); these linear relations do not hold while a limiter is active.'
    practice_ko: 'Calculated gain, 실제 입력한 gain, sample time, Limit 조건을 한 표에 두고 reference와 load step 각각에서 Overshoot·Settling time을 같은 정의와 time window로 비교한다.'
    practice_en: 'Place calculated gain, entered gain, sample time, and limit conditions in one table, then compare overshoot and settling time for reference and load steps using identical definitions and time windows.'
