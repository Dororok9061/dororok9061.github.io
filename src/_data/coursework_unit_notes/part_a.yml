controller-logic:
  boolean-logic:
    body_ko: '2진 입력 조합을 진리표로 펼친 뒤 부울대수로 같은 출력을 묶으면, 논리 게이트 수와 단계가 줄어든다. 이 과정은 비트 표현이 실제 AND·OR·NOT 회로로 바뀌는 연결을 보여준다.'
    body_en: 'A truth table enumerates binary input combinations, Boolean algebra groups equivalent outputs, and logic gates realize the reduced expression. This connects bit-level representation to a physical AND, OR, and NOT network.'
    anchor_ko: '예를 들어 Y = A·¬B + ¬A·B는 두 입력이 다를 때만 1이 되는 XOR 진리표와 일치한다.'
    anchor_en: 'For example, Y = A·¬B + ¬A·B matches the XOR truth table: the output is one only when the two input bits differ.'
    practice_ko: '설계 확인에서는 A와 B의 00, 01, 10, 11 네 경우를 모두 대입해 식과 게이트 출력이 같은지 비교한다.'
    practice_en: 'A design check substitutes 00, 01, 10, and 11 for A and B, then compares the expression with the gate-level output.'
  combinational-design:
    body_ko: '최소항과 최대항은 진리표를 정규형 식으로 옮기는 출발점이고, 카르노맵은 인접 항을 묶어 논리식을 줄인다. 다만 최소 게이트 식도 경로별 전파 지연이 다르면 순간적인 해저드가 생길 수 있다.'
    body_en: 'Minterms and maxterms translate a truth table into canonical expressions, while a Karnaugh map combines adjacent terms to minimize the logic. Unequal propagation delays can still create a transient hazard in the reduced network.'
    anchor_ko: 'F(A,B,C) = Σm(1,3,5,7)은 카르노맵에서 네 칸을 한 묶음으로 만들면 F = C로 줄어든다.'
    anchor_en: 'For F(A,B,C) = Σm(1,3,5,7), one four-cell Karnaugh-map group reduces the entire function to F = C.'
    practice_ko: '정규형과 최소화 식의 8개 입력 출력을 대조하고, 입력 하나가 바뀔 때 여러 게이트 경로가 동시에 전환되는지도 살핀다.'
    practice_en: 'Compare all eight outputs of the canonical and minimized forms, then inspect transitions where one input change reaches the output through paths of different depth.'
  full-adder:
    body_ko: '1비트 전가산기는 두 피연산자와 입력 캐리로 합과 출력 캐리를 만든다. 이를 4단 직렬로 연결한 리플 캐리 가산기에서는 각 단계의 캐리 전파가 전체 결과 확정 시간을 결정한다.'
    body_en: 'A one-bit full adder combines two operand bits and carry-in to produce sum and carry-out. Cascading four cells forms a ripple-carry adder whose completion time is governed by carry propagation through the stages.'
    anchor_ko: 'S = A ⊕ B ⊕ Cin, Cout = A·B + Cin·(A ⊕ B)이며, 1111₂ + 0001₂에서는 캐리가 네 단을 모두 지난다.'
    anchor_en: 'S = A ⊕ B ⊕ Cin and Cout = A·B + Cin·(A ⊕ B); adding 1111₂ and 0001₂ forces a carry through all four stages.'
    practice_ko: '0000+0000, 0101+0011, 1111+0001을 넣어 합과 최종 캐리를 확인하고 마지막 경우의 단계별 캐리 파형을 추적한다.'
    practice_en: 'Check sum and final carry for 0000+0000, 0101+0011, and 1111+0001, then trace each intermediate carry in the last case.'
  decoder-multiplexer:
    body_ko: '3-to-8 디코더는 선택 신호 조합 하나를 단일 활성 출력으로 풀어내고, 8-to-1 멀티플렉서는 같은 선택 비트로 여덟 입력 중 하나를 되돌려 고른다. 작은 블록을 enable과 상위 선택선으로 묶으면 계층적 구성이 가능하다.'
    body_en: 'A three-to-eight decoder expands one select code into a one-hot output, whereas an eight-to-one multiplexer uses the same select width to route one of eight inputs. Enable lines and upper select bits support hierarchical composition.'
    anchor_ko: '선택선 S2S1S0 = 101이면 디코더의 D5만 활성화되고, 멀티플렉서 출력은 I5가 된다.'
    anchor_en: 'With select code S2S1S0 = 101, only decoder output D5 is active and the multiplexer output equals I5.'
    practice_ko: '선택 코드 000부터 111까지 순회해 one-hot 조건과 입력 전달을 확인하고, enable이 꺼졌을 때 하위 블록이 비활성인지 점검한다.'
    practice_en: 'Sweep select codes 000 through 111 to check the one-hot condition and routed input, then verify that a disabled lower-level block remains inactive.'
  vhdl-combinational:
    body_ko: 'entity는 포트와 자료형으로 회로 경계를 정의하고 architecture는 동작을 기술한다. 단순 논리는 concurrent assignment로, 조건이 많은 조합논리는 입력 전체를 sensitivity list에 둔 process로 쓰며 합성 가능한 구문만 남긴다.'
    body_en: 'The entity defines the circuit boundary through ports and types, and the architecture describes behavior. Concurrent assignments suit direct logic, while a combinational process must include every read signal in its sensitivity list and use synthesizable constructs.'
    anchor_ko: 'with sel select y <= a when ''0'', b when others; 는 2-to-1 멀티플렉서를 병렬 할당 한 줄로 표현한다.'
    anchor_en: 'The statement with sel select y <= a when ''0'', b when others; expresses a two-to-one multiplexer as one concurrent assignment.'
    practice_ko: '모든 입력 변화가 출력을 갱신하는지 확인하고, process의 각 분기에서 출력 기본값이 지정되어 의도치 않은 latch가 생기지 않는지 검토한다.'
    practice_en: 'Check that every input transition updates the output and that each process path assigns a default value so no unintended latch is inferred.'
  sequential-logic:
    body_ko: 'D 플립플롭은 지정된 clock edge에서만 D를 Q로 옮겨 조합논리와 시간 경계를 만든다. synchronous reset도 같은 edge에서 평가되며, setup과 hold 구간을 지켜야 샘플 값이 안정된다.'
    body_en: 'A D flip-flop transfers D to Q only on the selected clock edge, creating a time boundary around combinational logic. A synchronous reset is evaluated on that edge, and setup and hold intervals protect reliable sampling.'
    anchor_ko: 'rising_edge(clk)에서 reset = 1이면 Q ← 0, 아니면 Q ← D로 쓰면 reset은 clock 없이 즉시 Q를 바꾸지 않는다.'
    anchor_en: 'On rising_edge(clk), Q receives zero when reset is one and D otherwise; the synchronous reset therefore cannot change Q between clock edges.'
    practice_ko: 'D와 reset을 edge 직전·직후에 바꾸는 파형을 그려 Q가 edge에서만 갱신되는지, setup·hold 위반 가능 구간이 어디인지 표시한다.'
    practice_en: 'Draw D and reset transitions around a clock edge, verify that Q changes only at the edge, and mark the intervals that would violate setup or hold time.'
  registers:
    body_ko: '여러 D 플립플롭을 묶은 레지스터는 병렬 load로 한 번에 값을 저장하고, shift 경로를 선택하면 비트를 좌우로 이동한다. universal shift register에서는 hold·shift·load가 동시에 요청될 때 제어 우선순위를 명시해야 한다.'
    body_en: 'A register groups D flip-flops for parallel loading, while selectable feedback paths shift bits left or right. A universal shift register needs explicit control priority when hold, shift, and load requests overlap.'
    anchor_ko: '우선순위를 load > shift_left > shift_right > hold로 정하면 load = 1인 clock edge에서는 다른 제어와 무관하게 병렬 입력이 저장된다.'
    anchor_en: 'With priority load > shift_left > shift_right > hold, a clock edge with load asserted captures the parallel input regardless of the shift controls.'
    practice_ko: '초기값 1010에서 좌 shift, 우 shift, 병렬 load를 각각 적용하고, load와 shift가 함께 1인 경우 명시한 우선순위대로 동작하는지 확인한다.'
    practice_en: 'Starting from 1010, apply left shift, right shift, and parallel load, then check the simultaneous load-and-shift case against the declared priority.'
  fsm-foundations:
    body_ko: '상태도는 입력에 따른 전이를 시각화하고, 상태 부호화는 그 상태를 플립플롭 비트로 배치한다. 현재 상태와 입력으로 next-state logic을 만들고, 현재 상태 또는 입력 조합으로 output logic을 분리하면 FSM 구조가 선명해진다.'
    body_en: 'A state diagram visualizes input-driven transitions, and state encoding assigns those states to flip-flop bits. Separating next-state logic from output logic makes the dependency on current state and input explicit.'
    anchor_ko: '세 상태 S0, S1, S2를 00, 01, 10으로 부호화하면 사용하지 않는 11에서 S0로 복귀하는 전이도 정의할 수 있다.'
    anchor_en: 'Encoding three states S0, S1, and S2 as 00, 01, and 10 leaves 11 unused, so a recovery transition from 11 back to S0 should be defined.'
    practice_ko: '각 상태의 입력 0과 1에 대해 다음 상태와 출력을 표로 적고, 모든 상태·입력 조합과 미사용 부호의 복귀 경로가 있는지 점검한다.'
    practice_en: 'Tabulate next state and output for inputs zero and one in every state, then check coverage of all combinations and recovery from unused encodings.'
  mealy-sequence-detector:
    body_ko: 'Mealy 검출기는 현재 상태와 입력이 함께 출력을 정하므로 마지막 비트가 들어오는 같은 cycle에 101을 알릴 수 있다. 접두사 1과 10을 기억하는 세 상태를 쓰고, 중첩 검출을 위해 검출 뒤의 마지막 1을 다음 패턴의 시작으로 남긴다.'
    body_en: 'A Mealy detector derives output from both state and input, so it can assert detection in the cycle that completes 101. Three states remember prefixes 1 and 10, and overlapping detection preserves the final 1 as the start of another pattern.'
    anchor_ko: '입력 10101에서는 세 번째와 다섯 번째 비트에서 detect = 1이 되어 두 번의 중첩된 101을 표시한다.'
    anchor_en: 'For input stream 10101, detect becomes one at the third and fifth bits, marking two overlapping occurrences of 101.'
    practice_ko: '000, 101, 10101, 1101을 상태 전이표로 한 비트씩 추적해 출력 시점과 검출 후 상태가 의도와 같은지 비교한다.'
    practice_en: 'Trace 000, 101, 10101, and 1101 bit by bit through the transition table, checking output timing and the state retained after detection.'
  vhdl-testbench:
    body_ko: 'stimulus process는 시간 순서대로 입력을 만들고, 예상값 비교는 설계 출력과 기준 모델을 맞춘다. assertion에 실패 조건과 메시지를 넣으면 파형을 눈으로만 읽지 않고 자동 확인하면서도, 파형에서는 전이 순서와 지연을 다시 볼 수 있다.'
    body_en: 'A stimulus process schedules input sequences, and expected-value comparison checks the design against a reference result. Assertions automate failures, while waveform reading still reveals transition order and delay.'
    anchor_ko: 'assert sum = expected_sum report "sum mismatch" severity error; 는 현재 벡터의 계산값이 다를 때만 오류를 낸다.'
    anchor_en: 'assert sum = expected_sum report "sum mismatch" severity error; reports an error only when the current vector disagrees with the reference sum.'
    practice_ko: '경계값과 일반값을 포함한 입력 벡터를 순회하고, 의도적으로 예상값 하나를 바꿔 assertion이 정확한 시점에 실패하는지 확인 대상으로 삼는다.'
    practice_en: 'Iterate vectors containing boundary and ordinary cases, and use one deliberately wrong expected value to check whether the assertion identifies the correct instant.'
  timing-synthesis:
    body_ko: 'RTL elaboration은 entity와 generic, 연결 구조를 실제 논리망으로 펼치고 synthesis는 이를 목표 소자의 셀로 매핑한다. 그 결과의 가장 긴 critical path를 clock constraint와 비교해야 기능적으로 맞는 RTL이 요구 주기 안에도 동작 가능한지 판단할 수 있다.'
    body_en: 'RTL elaboration expands entities, generics, and hierarchy into a logic network, and synthesis maps it to target cells. Comparing the longest critical path with the clock constraint tests whether functionally correct RTL can meet the requested period.'
    anchor_ko: '요구 clock period가 10 ns이고 setup을 포함한 최장 경로가 11.2 ns라면 slack = 10 − 11.2 = −1.2 ns로 timing을 만족하지 못한다.'
    anchor_en: 'If the requested clock period is 10 ns and the longest setup path is 11.2 ns, slack = 10 − 11.2 = −1.2 ns and timing is not met.'
    practice_ko: '합성 보고서에서 최상위 clock, 시작점, 끝점, 조합 지연을 찾아 constraint 단위와 일치시키고 음수 slack 경로의 논리 단계를 검토한다.'
    practice_en: 'Locate the top-level clock, startpoint, endpoint, and combinational delay in the synthesis report, confirm constraint units, and inspect the logic depth of any negative-slack path.'
  design-integration:
    body_ko: 'component binding은 선언한 블록을 실제 구현에 연결하고 port mapping은 신호 방향과 폭을 맞춘다. 통합 뒤에는 self-checking simulation으로 계층 경계를 검증하고, 실패한 assertion을 해당 source와 waveform 전이까지 거슬러 올라간다.'
    body_en: 'Component binding connects an instantiated block to its implementation, and port mapping aligns signal direction and width. After integration, self-checking simulation verifies hierarchy and traces any assertion failure back through source and waveform transitions.'
    anchor_ko: '4비트 data_out을 3비트 신호에 연결하면 폭 불일치가 생기므로, 명시적 slice가 설계 의도인지 단순 연결 오류인지 먼저 구분해야 한다.'
    anchor_en: 'Connecting a four-bit data_out port to a three-bit signal creates a width mismatch, so an intentional slice must be distinguished from an integration error.'
    practice_ko: '각 instance의 generic과 포트 폭·방향을 대조한 뒤 회귀 벡터를 실행 대상으로 정의하고, assertion 이름에서 source 줄과 waveform 신호까지 추적할 경로를 적는다.'
    practice_en: 'Compare generics, port widths, and directions for every instance, define regression vectors, and map each assertion name to its source line and waveform signal for diagnosis.'
electronic-circuits-1:
  semiconductor-basics:
    body_ko: '반도체의 전자와 정공 농도는 도핑 종류와 농도로 달라지고, p형과 n형을 맞대면 확산으로 공핍층이 생긴다. 이동한 전하가 만든 전기장은 더 이상의 확산을 막는 내장 전위를 형성한다.'
    body_en: 'Doping sets electron and hole concentrations in each semiconductor region. Joining p-type and n-type material causes diffusion, leaving a depletion region whose electric field establishes the built-in potential.'
    anchor_ko: '열평형 PN 접합에서 Vbi = VT ln(NA·ND/ni²)이므로 도핑 농도가 커질수록 내장 전위가 로그 비율로 증가한다.'
    anchor_en: 'At thermal equilibrium, Vbi = VT ln(NA·ND/ni²), so increasing the doping concentrations raises the built-in potential logarithmically.'
    practice_ko: '순방향과 역방향 바이어스에서 공핍층 폭과 장벽 높이가 어느 방향으로 변하는지 에너지 밴드 그림에 표시한다.'
    practice_en: 'On an energy-band sketch, mark how depletion width and barrier height change under forward and reverse bias.'
  diode-models:
    body_ko: '이상 다이오드는 완전한 스위치로 시작점을 주고, 정전압 모델은 순방향 전압 강하를 포함한다. 지수 특성은 실제 전류 변화를 설명하며, 부하선과 교차시키면 회로의 동작점을 찾을 수 있다.'
    body_en: 'The ideal diode supplies a switch-level approximation, the constant-voltage model includes a forward drop, and the exponential characteristic describes current variation. Intersecting that curve with the load line locates the operating point.'
    anchor_ko: '직렬 저항 회로의 부하선은 ID = (VS − VD)/R이고, 다이오드 식 ID = IS(e^(VD/nVT) − 1)과의 교점이 Q-point다.'
    anchor_en: 'For a series resistor, the load line is ID = (VS − VD)/R; its intersection with ID = IS(e^(VD/nVT) − 1) is the quiescent point.'
    practice_ko: '같은 VS와 R에 이상 모델, 0.7 V 정전압 모델, 지수 모델을 각각 적용해 예측한 VD와 ID가 어떻게 달라지는지 비교한다.'
    practice_en: 'For the same VS and R, compare predicted VD and ID from the ideal, 0.7 V constant-drop, and exponential models.'
  rectifiers:
    body_ko: '반파 정류는 입력 한 극성만 부하에 전달하고 전파 정류는 두 반주기를 같은 극성으로 뒤집는다. 평활 커패시터는 정류 파형의 정점에서 충전되고 부하를 통해 방전되므로 ripple voltage가 생긴다.'
    body_en: 'Half-wave rectification passes one input polarity, while full-wave rectification folds both half-cycles into the same polarity. A smoothing capacitor charges near each peak and discharges through the load, producing ripple voltage.'
    anchor_ko: '작은 ripple 근사에서 전파 정류기의 ΔV ≈ Iload/(2fC)이며, 반파 정류는 같은 조건에서 대략 ΔV ≈ Iload/(fC)다.'
    anchor_en: 'For small ripple, a full-wave rectifier gives ΔV ≈ Iload/(2fC), whereas a half-wave rectifier gives approximately ΔV ≈ Iload/(fC).'
    practice_ko: '입력 정현파, 다이오드 출력, 커패시터 전압을 한 시간축에 그리고 충전 구간·방전 기울기·ripple 주기를 구분한다.'
    practice_en: 'Sketch the input sine wave, rectified output, and capacitor voltage on one time axis, marking charge intervals, discharge slope, and ripple period.'
  diode-applications:
    body_ko: 'clipper는 다이오드 도통 경계로 파형의 상한이나 하한을 제한하고, clamper는 커패시터 전하를 이용해 DC level을 옮긴다. Zener regulator도 항복 전압을 기준으로 출력 범위를 고정하므로 모든 경우를 구간별 회로로 나누어야 한다.'
    body_en: 'A clipper limits waveform extrema at a diode conduction boundary, while a clamper stores charge to shift the DC level. A Zener regulator fixes an output near breakdown voltage, so each circuit requires piecewise operating regions.'
    anchor_ko: '양의 0.7 V clipper에서는 Vin ≤ 0.7 V일 때 Vout ≈ Vin, Vin > 0.7 V일 때 Vout ≈ 0.7 V로 나누어 해석한다.'
    anchor_en: 'For a positive 0.7 V clipper, use Vout ≈ Vin when Vin ≤ 0.7 V and Vout ≈ 0.7 V when Vin > 0.7 V.'
    practice_ko: '각 입력 구간에서 다이오드 ON/OFF를 먼저 가정하고 계산 결과가 그 가정을 만족하는지 확인한 뒤 출력 파형의 DC 위치와 제한점을 표시한다.'
    practice_en: 'Assume diode ON or OFF in each input interval, test whether the calculated voltages support that assumption, and mark the output DC level and clipping threshold.'
  bjt-operation:
    body_ko: 'BJT의 cutoff에서는 두 접합이 필요한 순방향 조건을 갖지 못해 전류가 거의 없고, forward active에서는 base-emitter 접합과 전류 이득이 증폭을 만든다. base-collector 접합까지 순방향이 되면 saturation으로 들어가 스위치처럼 동작한다.'
    body_en: 'In cutoff a BJT carries negligible current, forward active operation uses the base-emitter junction and current gain for amplification, and saturation occurs when the collector side can no longer sustain active-region behavior.'
    anchor_ko: 'forward active 근사에서는 IC ≈ βIB이고 VCE > VCE,sat이어야 하며, 계산한 βIB가 부하가 허용하는 전류보다 크면 saturation을 다시 확인해야 한다.'
    anchor_en: 'The forward-active estimate IC ≈ βIB also requires VCE > VCE,sat; if βIB exceeds the load-limited current, saturation must be checked instead.'
    practice_ko: '주어진 IB와 collector 저항에 대해 cutoff, active, saturation을 차례로 가정하고 VCE와 IC가 각 영역 조건을 만족하는지 판정한다.'
    practice_en: 'For a chosen base current and collector resistor, test cutoff, active, and saturation assumptions by checking the resulting VCE and IC against each region condition.'
  bjt-bias:
    body_ko: '전압분배 bias는 base 전압을 정하고 emitter degeneration 저항은 전류 증가에 음의 되먹임을 건다. 이 조합은 β와 온도 변화에 따른 Q-point 이동을 줄여 thermal stability와 신호 swing 여유를 함께 확보한다.'
    body_en: 'Voltage-divider bias establishes the base voltage, and emitter degeneration feeds back an increase in current as an opposing emitter-voltage rise. Together they stabilize the quiescent point against beta and temperature variation while preserving signal swing.'
    anchor_ko: '분압망을 Thevenin 등가로 바꾸면 IB = (VTH − VBE)/(RTH + (β+1)RE)로 Q-point를 계산할 수 있다.'
    anchor_en: 'Replacing the divider by its Thevenin equivalent gives IB = (VTH − VBE)/(RTH + (β+1)RE) for the bias calculation.'
    practice_ko: 'β의 최소·최대값을 넣어 IC와 VCE 범위를 구하고, 두 극단에서도 transistor가 forward active이고 출력 swing이 잘리지 않는지 점검한다.'
    practice_en: 'Evaluate IC and VCE at minimum and maximum beta, then check that the transistor remains forward active and leaves unclipped output swing at both extremes.'
  bjt-small-signal:
    body_ko: 'Q-point 주변의 지수 특성을 선형화하면 transconductance gm이 생기고 hybrid-pi 모델의 rπ = β/gm으로 입력 저항을 표현한다. collector 쪽 ro까지 포함하면 입력과 출력 저항, 전압 이득을 같은 소신호 회로에서 계산할 수 있다.'
    body_en: 'Linearizing the transistor around its quiescent point yields transconductance gm, and the hybrid-pi model gives rπ = β/gm at the input. Including ro at the collector lets one circuit represent gain plus input and output resistance.'
    anchor_ko: 'gm = IC/VT이며 emitter가 AC ground인 경우 기본 전압 이득은 Av ≈ −gm(RC ∥ ro ∥ RL)로 근사한다.'
    anchor_en: 'With gm = IC/VT and the emitter at AC ground, the basic voltage gain is Av ≈ −gm(RC ∥ ro ∥ RL).'
    practice_ko: 'DC bias에서 얻은 IC로 gm과 rπ를 계산한 뒤, 신호원 저항과 부하를 포함한 전체 소신호 등가회로에서 gain을 다시 구한다.'
    practice_en: 'Use the DC bias current to calculate gm and rπ, then recompute gain from the complete small-signal equivalent including source resistance and load.'
  common-emitter:
    body_ko: 'common-emitter 증폭기는 collector 전압이 collector 전류와 반대로 움직여 180도 phase inversion을 만든다. coupling capacitor는 DC bias를 분리하고, bypass capacitor는 emitter degeneration을 AC에서 줄여 midband voltage gain을 높인다.'
    body_en: 'A common-emitter stage produces phase inversion because collector voltage falls as collector current rises. Coupling capacitors isolate DC bias, and an emitter bypass capacitor removes AC degeneration to increase midband voltage gain.'
    anchor_ko: 'bypass가 충분히 작동하면 Av ≈ −gmRC이고, bypass가 없으면 Av ≈ −gmRC/(1 + gmRE)로 feedback만큼 gain이 줄어든다.'
    anchor_en: 'With an effective bypass, Av ≈ −gmRC; without it, Av ≈ −gmRC/(1 + gmRE), showing the gain reduction from emitter feedback.'
    practice_ko: '입력과 출력의 midband 파형을 비교해 반전 여부를 확인하고, coupling·bypass capacitor가 만드는 각 저주파 pole의 등가 저항을 따로 계산한다.'
    practice_en: 'Compare input and output midband waveforms for inversion, then calculate the resistance seen by each coupling and bypass capacitor to locate its low-frequency pole.'
  emitter-follower:
    body_ko: 'emitter follower는 출력이 base 전압을 약 한 접합 전압 낮게 따라가므로 voltage gain은 1에 가깝다. 높은 input resistance와 낮은 output resistance가 앞단을 덜 부하시키고 다음 단을 구동해 impedance matching에 유리하다.'
    body_en: 'An emitter follower tracks the base voltage one junction drop lower, giving voltage gain near unity. Its high input resistance and low output resistance reduce loading on the source and improve impedance matching to the next stage.'
    anchor_ko: '소신호에서 Av ≈ RE/(RE + re)이고 re ≈ VT/IE이므로 RE가 re보다 충분히 크면 Av가 1에 가까워진다.'
    anchor_en: 'For small signals, Av ≈ RE/(RE + re) with re ≈ VT/IE, so gain approaches one when RE is much larger than re.'
    practice_ko: '신호원 저항과 부하 저항을 포함해 buffer 전후의 전달 전압을 계산하고, transistor의 peak 전류와 출력 swing 한계도 함께 확인한다.'
    practice_en: 'Include source and load resistances when calculating voltage transfer before and after the buffer, and also check peak transistor current and output-swing limits.'
  mosfet-operation:
    body_ko: 'MOSFET은 VGS가 threshold voltage를 넘어 channel이 생긴 뒤, 작은 VDS에서는 triode 영역의 전압제어 저항처럼 동작한다. VDS가 overdrive를 넘으면 saturation으로 들어가며 body effect는 source와 body 전위차에 따라 threshold를 바꾼다.'
    body_en: 'A MOSFET forms a channel after VGS exceeds threshold voltage, behaves like a voltage-controlled resistance in the triode region, and enters saturation when VDS exceeds the overdrive. Body effect shifts threshold when source and body potentials differ.'
    anchor_ko: '장채널 근사에서 saturation 조건은 VDS ≥ VGS − VTH이고, ID ≈ 0.5kn(VGS − VTH)²이다.'
    anchor_en: 'In the long-channel approximation, saturation requires VDS ≥ VGS − VTH and ID ≈ 0.5kn(VGS − VTH)².'
    practice_ko: 'VGS와 VDS가 주어졌을 때 cutoff·triode·saturation 조건을 먼저 판정하고, source가 올라간 회로에서는 body effect를 반영한 VTH 변화를 검토한다.'
    practice_en: 'Given VGS and VDS, identify cutoff, triode, or saturation before calculating current, and examine the threshold shift from body effect when the source rises above the body.'
  common-source:
    body_ko: 'common-source stage의 small-signal gain은 transconductance와 drain resistance가 정하고, source degeneration은 gain을 낮추는 대신 bias와 선형성을 안정시킨다. Q-point를 중앙에 두어야 drain 출력이 위아래로 충분히 swing한다.'
    body_en: 'Transconductance and drain resistance set common-source small-signal gain, while source degeneration trades gain for bias stability and linearity. The quiescent point must leave headroom for drain voltage swing in both directions.'
    anchor_ko: 'source bypass가 없으면 Av ≈ −gm(RD ∥ ro ∥ RL)/(1 + gmRS)이고, drain의 최대 무왜곡 swing은 cutoff와 triode 경계 중 가까운 쪽이 제한한다.'
    anchor_en: 'Without a source bypass, Av ≈ −gm(RD ∥ ro ∥ RL)/(1 + gmRS), and the nearest cutoff or triode boundary limits undistorted drain swing.'
    practice_ko: 'DC load line에 Q-point를 표시한 뒤 예상 입력 peak에 gain을 곱해 drain 최고·최저 전압이 saturation 조건과 cutoff 경계를 넘지 않는지 확인한다.'
    practice_en: 'Mark the quiescent point on the DC load line, multiply the expected input peak by gain, and verify that drain extrema stay within saturation and away from cutoff.'
  amplifier-review:
    body_ko: 'common-emitter·emitter follower·common-source를 비교할 때 voltage gain만 보면 용도를 놓치기 쉽다. input/output resistance, capacitor가 만든 frequency range, bias headroom을 함께 보면 증폭단과 buffer의 역할을 구분할 수 있다.'
    body_en: 'Comparing common-emitter, emitter-follower, and common-source stages by voltage gain alone hides their roles. Input and output resistance, capacitor-defined frequency range, and bias headroom distinguish gain stages from buffers.'
    anchor_ko: '두 단을 연결할 때 실제 첫 단 gain은 무부하 gain이 아니라 Av,loaded = Av0·Rin,2/(Rout,1 + Rin,2)로 줄어든다.'
    anchor_en: 'When two stages are connected, the first-stage gain becomes Av,loaded = Av0·Rin,2/(Rout,1 + Rin,2), not its unloaded value.'
    practice_ko: '세 구조를 gain 부호와 크기, Rin, Rout, 저주파 cutoff, 허용 swing 항목으로 표에 정리하고 주어진 source와 load에 가장 맞는 단을 선택한다.'
    practice_en: 'Tabulate gain sign and magnitude, Rin, Rout, low-frequency cutoff, and allowable swing for the three stages, then select the stage that fits a specified source and load.'
electronic-circuits-2:
  differential-pair:
    body_ko: '차동쌍은 두 입력의 차이인 differential mode를 증폭하고 두 입력에 함께 들어온 common mode는 억제한다. tail current가 두 소자의 동작점을 정하며, 차동 이득과 공통모드 이득의 비가 CMRR이다.'
    body_en: 'A differential pair amplifies the difference between its inputs and rejects their shared common-mode component. The tail current establishes both device operating points, and the ratio of differential to common-mode gain defines CMRR.'
    anchor_ko: '이상적인 대칭 BJT 차동쌍에서 vid = 0이면 각 collector 전류는 Itail/2이고, 작은 vid에 대한 단일 출력 transconductance는 대략 gm/2다.'
    anchor_en: 'For an ideal symmetric BJT pair at vid = 0, each collector carries Itail/2, and the small-signal single-ended transconductance is approximately gm/2.'
    practice_ko: '두 입력을 반대 방향으로 움직이는 경우와 같은 방향으로 움직이는 경우의 collector 파형을 그려 differential gain과 common-mode 잔류를 분리한다.'
    practice_en: 'Sketch collector responses for equal-and-opposite inputs and for inputs moving together, separating differential gain from common-mode residue.'
  current-mirrors:
    body_ko: 'current mirror는 diode-connected 기준 소자의 VBE 또는 VGS를 복사해 reference current를 출력 가지에 만든다. 큰 output resistance는 active load로 높은 gain을 주지만, compliance voltage가 부족하면 출력 소자가 원하는 영역을 벗어난다.'
    body_en: 'A current mirror copies the VBE or VGS of a diode-connected reference device to reproduce reference current in an output branch. High output resistance makes it an effective active load, but insufficient compliance voltage drives it out of the intended region.'
    anchor_ko: '일치한 BJT와 base-current 무시 근사에서는 Iout ≈ Iref이고, Early effect를 포함하면 Iout은 Vout에 따라 약간 기울어진다.'
    anchor_en: 'For matched BJTs with negligible base currents, Iout ≈ Iref; including the Early effect gives the output characteristic a finite slope versus Vout.'
    practice_ko: '요구 Iout에서 기준 저항을 계산하고, 출력 전압의 최소·최대값 전 구간에서 mirror 소자가 active 또는 saturation 조건을 유지하는지 확인한다.'
    practice_en: 'Calculate the reference resistor for the required Iout, then check that the mirror device remains in its active or saturation region over the full output-voltage range.'
  multistage-amplifiers:
    body_ko: '여러 증폭단을 연결하면 각 단의 input resistance가 앞단을 loading하여 개별 gain의 단순 곱보다 overall gain이 작아진다. 또한 DC level shift와 각 단의 Q-point가 누적되므로 마지막 출력까지 signal swing 여유를 배분해야 한다.'
    body_en: 'In a multistage amplifier, each following input resistance loads the preceding stage, so overall gain is smaller than a naive product of unloaded gains. DC level shifts and quiescent points must also preserve signal swing through the chain.'
    anchor_ko: '두 단 gain은 Av,total = Av1,loaded·Av2이며 Av1,loaded = Av1,0·Rin2/(Rout1 + Rin2)로 연결 부하를 포함한다.'
    anchor_en: 'For two stages, Av,total = Av1,loaded·Av2 with Av1,loaded = Av1,0·Rin2/(Rout1 + Rin2), explicitly including interstage loading.'
    practice_ko: '각 단의 DC 출력과 허용 peak swing을 순서대로 적고, 첫 단의 최대 신호가 다음 단의 입력 범위나 마지막 출력 rail을 넘지 않는지 계산한다.'
    practice_en: 'List each stage DC output and allowable peak swing, then calculate whether the first-stage maximum signal exceeds a later input range or final output rail.'
  op-amp-internals:
    body_ko: 'op-amp의 differential input stage는 두 입력 차이를 전류로 바꾸고, gain stage가 큰 open-loop gain을 만든다. output buffer는 부하 전류를 공급하며 bias network는 세 단계의 동작 전류와 DC level을 유지한다.'
    body_en: 'The differential input stage converts input difference to current, the gain stage builds large open-loop gain, and the output buffer supplies load current. A bias network establishes operating currents and DC levels throughout the three stages.'
    anchor_ko: '개방루프 gain을 단계별로 보면 A0 ≈ gm,input·Rout,input × gm,gain·Rout,gain × Av,buffer이며 buffer gain은 대체로 1에 가깝다.'
    anchor_en: 'A stage view gives A0 ≈ gm,input·Rout,input × gm,gain·Rout,gain × Av,buffer, with output-buffer voltage gain usually near one.'
    practice_ko: '내부 블록도에서 입력 offset이 증폭되는 경로, dominant pole을 만드는 고임피던스 node, 출력 전류가 흐르는 buffer 경로를 각각 표시한다.'
    practice_en: 'On an internal block diagram, mark the path that amplifies input offset, the high-impedance node forming the dominant pole, and the buffer path carrying load current.'
  negative-feedback:
    body_ko: 'negative feedback은 출력 일부를 입력에서 빼 open-loop gain A와 feedback factor β의 곱인 loop gain을 만든다. loop gain이 크면 closed-loop gain은 β가 정하고 소자 변화에 대한 sensitivity가 줄며 bandwidth는 넓어진다.'
    body_en: 'Negative feedback subtracts a fraction of output from input, creating loop gain Aβ. Large loop gain makes closed-loop gain depend mainly on β, reduces sensitivity to device variation, and extends bandwidth.'
    anchor_ko: '폐루프 이득은 Af = A/(1 + Aβ)이고, Aβ ≫ 1이면 Af ≈ 1/β이며 gain sensitivity는 약 1/(1 + Aβ)로 감소한다.'
    anchor_en: 'Closed-loop gain is Af = A/(1 + Aβ); when Aβ ≫ 1, Af ≈ 1/β and gain sensitivity falls by approximately 1/(1 + Aβ).'
    practice_ko: 'A가 공칭값에서 ±20% 변할 때 feedback 전후 gain 변화를 계산하고, gain-bandwidth product가 일정하다는 근사에서 새 bandwidth를 구한다.'
    practice_en: 'Calculate gain change for a ±20 percent variation in A before and after feedback, then estimate the new bandwidth using a constant gain-bandwidth product.'
  op-amp-nonideal:
    body_ko: 'input offset은 입력이 같아도 DC 출력 오차를 만들고, slew rate는 큰 신호의 최대 기울기를 제한한다. gain-bandwidth product는 소신호 대역을 제한하며 output saturation은 요구 출력이 supply rail에 닿을 때 파형을 자른다.'
    body_en: 'Input offset creates DC output error even with equal inputs, slew rate limits the slope of large signals, gain-bandwidth product limits small-signal bandwidth, and output saturation clips demands near the supply rails.'
    anchor_ko: '정현파 Vp sin(2πft)가 slew-rate 왜곡 없이 나오려면 SR ≥ 2πfVp이고, 폐루프 대역은 대략 GBW/|Af|다.'
    anchor_en: 'For Vp sin(2πft) to avoid slew-rate distortion, SR ≥ 2πfVp, while closed-loop bandwidth is approximately GBW/|Af|.'
    practice_ko: '요구 gain·주파수·출력 peak로 GBW와 SR 조건을 각각 계산하고, offset에 noise gain을 곱한 DC 오차가 출력 headroom 안인지 확인한다.'
    practice_en: 'From required gain, frequency, and output peak, check GBW and slew-rate limits separately, then verify that offset times noise gain fits within output headroom.'
  frequency-response:
    body_ko: 'coupling과 bypass capacitor는 low-frequency pole을 만들고, transistor 내부 capacitance는 high-frequency pole을 만든다. 특히 Miller effect는 입력과 출력 사이 capacitance를 gain만큼 확대해 Bode plot의 상단 cutoff를 낮춘다.'
    body_en: 'Coupling and bypass capacitors create low-frequency poles, while internal transistor capacitances create high-frequency poles. The Miller effect multiplies a feedback capacitance by gain and can lower the upper cutoff seen on a Bode plot.'
    anchor_ko: '반전 gain Av에서 입력 Miller capacitance는 Cin,M ≈ Cμ(1 − Av)이고, 각 1차 pole 뒤 magnitude 기울기는 20 dB/dec 더 내려간다.'
    anchor_en: 'For inverting gain Av, the input Miller capacitance is Cin,M ≈ Cμ(1 − Av), and each first-order pole adds another −20 dB/dec magnitude slope.'
    practice_ko: '저주파 capacitor별 저항과 고주파 node별 등가 capacitance를 구해 pole을 정렬하고, Bode magnitude의 corner와 기울기를 손으로 표시한다.'
    practice_en: 'Find the resistance seen by each low-frequency capacitor and the equivalent capacitance at each high-frequency node, order the poles, and mark Bode corners and slopes.'
  feedback-stability:
    body_ko: 'loop gain이 0 dB가 되는 지점의 phase margin과 위상이 −180도가 되는 지점의 gain margin은 feedback system의 발진 여유를 나타낸다. dominant pole compensation은 첫 pole을 낮춰 unity crossing 전에 고차 pole의 위상 지연이 겹치지 않게 한다.'
    body_en: 'Phase margin at the zero-dB loop-gain crossing and gain margin at the −180-degree phase crossing measure distance from oscillation. Dominant-pole compensation moves the first pole lower so later pole delays do not accumulate before unity gain.'
    anchor_ko: 'unity-gain 주파수에서 loop phase가 −135도이면 phase margin은 45도이며, 보상 capacitor를 키우면 crossing은 낮아지지만 일반적으로 margin은 늘어난다.'
    anchor_en: 'If loop phase is −135 degrees at the unity-gain frequency, phase margin is 45 degrees; increasing compensation capacitance usually lowers crossover and increases margin.'
    practice_ko: 'loop-gain Bode plot에서 0 dB와 −180도 교차를 각각 읽어 두 margin을 계산하고, 보상 전후 step response의 ringing 예상과 연결한다.'
    practice_en: 'Read zero-dB and −180-degree crossings from the loop-gain Bode plot, compute both margins, and relate compensation changes to expected step-response ringing.'
  active-filters:
    body_ko: 'active filter는 op-amp와 RC network로 low-pass 또는 high-pass 응답을 만들며, 두 에너지 저장 요소를 쓰면 second-order denominator가 생긴다. quality factor Q가 cutoff 부근의 peak와 감쇠 모양을 정한다.'
    body_en: 'An active filter combines an op-amp with an RC network for low-pass or high-pass response. Two energy-storage elements create a second-order denominator whose quality factor sets peaking and damping near cutoff.'
    anchor_ko: '표준 2차 저역통과식 H(s) = Kω0²/(s² + (ω0/Q)s + ω0²)에서 Butterworth 응답은 Q = 1/√2를 사용한다.'
    anchor_en: 'For H(s) = Kω0²/(s² + (ω0/Q)s + ω0²), a second-order Butterworth low-pass uses Q = 1/√2.'
    practice_ko: '목표 f0와 Q로 R·C 비를 정한 뒤 DC gain, f0에서의 magnitude, 한 decade 위의 −40 dB/dec 기울기가 설계식과 맞는지 확인한다.'
    practice_en: 'Choose R and C ratios from target f0 and Q, then check DC gain, magnitude at f0, and the eventual −40 dB/dec slope against the design equation.'
  oscillators:
    body_ko: 'oscillator는 주파수 선택 network와 증폭기가 한 loop를 이루며, Barkhausen 조건의 위상 0도와 loop-gain 크기 1이 정상 진동을 설명한다. startup에는 gain이 1보다 조금 커야 하고 RC·LC network가 주파수를 정하며 amplitude limiting이 성장을 멈춘다.'
    body_en: 'An oscillator closes an amplifier around a frequency-selective network. The Barkhausen phase and gain conditions describe steady oscillation, startup needs loop gain slightly above one, RC or LC elements set frequency, and amplitude limiting stops growth.'
    anchor_ko: 'Wien bridge에서 균등 R과 C를 쓰면 f0 = 1/(2πRC)이고 feedback factor가 1/3이므로 amplifier gain이 약 3이어야 한다.'
    anchor_en: 'With equal R and C in a Wien bridge, f0 = 1/(2πRC) and feedback is one third, so amplifier gain must settle near three.'
    practice_ko: '목표 주파수로 R과 C를 고르고 부품 공차에 따른 f0 범위를 계산한 뒤, startup gain과 limiter가 만든 정상상태 gain을 구분해 검토한다.'
    practice_en: 'Choose R and C for a target frequency, calculate the frequency range from tolerances, and distinguish startup gain from the steady-state gain imposed by the limiter.'
  power-amplifiers:
    body_ko: 'Class A는 전 주기 전류를 흘려 선형성이 좋지만 효율과 발열이 불리하다. Class B는 두 소자가 반주기씩 맡아 효율을 높이지만 zero crossing에 crossover distortion이 생기며, Class AB bias가 이 dead zone을 줄인다.'
    body_en: 'Class A conducts for the full cycle and favors linearity at the cost of efficiency and heat. Class B splits half-cycles between devices but creates crossover distortion, while Class AB bias reduces the zero-crossing dead zone.'
    anchor_ko: '이상적인 저항 부하 Class B push-pull stage의 최대 효율은 π/4 ≈ 78.5%이며, 실제 설계에서는 quiescent current와 소자 손실로 낮아진다.'
    anchor_en: 'An ideal resistively loaded Class B push-pull stage has maximum efficiency π/4 ≈ 78.5 percent, reduced in practice by quiescent and device losses.'
    practice_ko: '출력 정현파의 전압·전류 peak로 부하 전력과 DC 입력 전력을 계산하고, zero crossing 확대 파형에서 bias 부족·과다의 징후를 구분한다.'
    practice_en: 'Use output voltage and current peaks to calculate load and DC input power, then inspect an expanded zero-crossing waveform for underbias or excessive quiescent conduction.'
  analog-signal-chain:
    body_ko: 'analog signal chain은 sensor의 input range를 각 단의 허용 범위에 맞추고 전체 noise budget을 관리해야 한다. gain allocation은 작은 신호를 초기에 키우되 포화 여유를 남기며, 마지막 output drive는 부하의 전압과 전류를 모두 만족해야 한다.'
    body_en: 'An analog signal chain maps the sensor input range into every stage limit while controlling the total noise budget. Gain allocation should amplify early enough to overcome downstream noise without losing headroom, and output drive must satisfy load voltage and current.'
    anchor_ko: '독립 noise를 입력 환산하면 en,total = √(en1² + (en2/G1)² + (en3/(G1G2))²)처럼 앞단 gain이 뒤단 noise 기여를 줄인다.'
    anchor_en: 'Input-referred independent noise combines as en,total = √(en1² + (en2/G1)² + (en3/(G1G2))²), so early gain suppresses downstream contributions.'
    practice_ko: '최소·최대 sensor 입력에 대해 각 node의 DC와 peak 전압을 표로 계산하고, noise RMS·rail headroom·최종 부하 전류를 한 번에 점검한다.'
    practice_en: 'For minimum and maximum sensor inputs, tabulate DC and peak voltage at each node, then check RMS noise, rail headroom, and final load current together.'
digital-communications:
  communication-model:
    body_ko: '정보 source는 bit열을 만들고 transmitter는 channel에 맞는 baseband pulse 또는 passband waveform으로 바꾼다. receiver는 noise와 왜곡이 더해진 신호에서 bit를 추정하며, error rate와 bandwidth·power efficiency가 성능 지표가 된다.'
    body_en: 'An information source produces bits, and the transmitter maps them to baseband pulses or a passband waveform suited to the channel. The receiver estimates bits after noise and distortion, with error rate, bandwidth, and power efficiency as performance measures.'
    anchor_ko: '복소 baseband x(t)를 carrier에 올리면 passband 신호는 s(t) = Re{x(t)e^(j2πfct)}로 표현할 수 있다.'
    anchor_en: 'A complex baseband signal x(t) becomes the passband waveform s(t) = Re{x(t)e^(j2πfct)} at carrier frequency fc.'
    practice_ko: '하나의 링크 블록도에 source coding, modulation, channel, demodulation, decision을 순서대로 놓고 각 경계의 신호가 bit·sample·waveform 중 무엇인지 표시한다.'
    practice_en: 'Draw source coding, modulation, channel, demodulation, and decision in order, labeling each interface as bits, samples, or a continuous waveform.'
  sampling-quantization:
    body_ko: 'Nyquist sampling은 bandlimited 신호의 spectrum 복사본이 겹치지 않게 하고, sampling rate가 부족하면 aliasing이 원래 대역으로 접힌다. 각 sample을 유한 bit depth로 quantization하면 진폭 오차가 생겨 quantization noise가 추가된다.'
    body_en: 'Nyquist sampling keeps spectral replicas of a bandlimited signal from overlapping; an insufficient sample rate folds them into aliasing. Quantizing each sample to finite bit depth then adds amplitude error modeled as quantization noise.'
    anchor_ko: '최고 주파수가 B인 신호에는 fs > 2B가 필요하고, 균일 quantizer의 step은 Δ = Vrange/2^N, 오차 분산은 이상 근사에서 Δ²/12다.'
    anchor_en: 'A signal limited to B requires fs > 2B; for an N-bit uniform quantizer, Δ = Vrange/2^N and ideal quantization-error variance is Δ²/12.'
    practice_ko: '단일 tone을 fs가 2B보다 큰 경우와 작은 경우로 sample한 spectrum을 비교하고, bit depth를 1 bit 늘렸을 때 step과 이상 SQNR 변화도 계산한다.'
    practice_en: 'Compare sampled spectra for fs above and below 2B, then calculate how one extra quantizer bit changes step size and ideal SQNR.'
  pcm-line-coding:
    body_ko: 'PCM frame은 sampling된 값을 고정 길이 bit word로 묶고, line code가 그 bit를 전송 파형으로 바꾼다. NRZ는 bandwidth가 작지만 긴 동일 bit열과 DC content가 clock recovery를 어렵게 하며, Manchester는 매 bit 중앙 전이로 timing을 제공한다.'
    body_en: 'A PCM frame packages sampled values into fixed-length words, and line coding turns those bits into a transmit waveform. NRZ is bandwidth-efficient but long runs and DC content hinder clock recovery, whereas Manchester guarantees a mid-bit transition.'
    anchor_ko: 'sampling rate fs와 sample당 N bit라면 PCM bit rate는 Rb = Nfs이고, Manchester symbol transition rate는 NRZ보다 더 높아 필요한 대역이 넓어진다.'
    anchor_en: 'With sample rate fs and N bits per sample, PCM bit rate is Rb = Nfs; Manchester uses a higher transition rate than NRZ and therefore more bandwidth.'
    practice_ko: 'bit열 00111100을 unipolar NRZ, polar NRZ, Manchester로 각각 그리고 평균 level, 최대 무전이 구간, clock edge 위치를 비교한다.'
    practice_en: 'Draw 00111100 in unipolar NRZ, polar NRZ, and Manchester, then compare average level, longest transition-free interval, and available clock edges.'
  probability-noise:
    body_ko: 'random variable은 noise sample의 가능한 값과 확률을 기술하고 Gaussian model은 많은 독립 요인의 합을 다룬다. power spectral density는 noise power가 주파수에 분포한 모습을 나타내며, 수신 signal power와 noise power의 비가 SNR이다.'
    body_en: 'A random variable describes possible noise samples and their probabilities, while the Gaussian model represents sums of many independent effects. Power spectral density distributes noise power over frequency, and SNR compares received signal and noise powers.'
    anchor_ko: '양측 AWGN PSD가 N0/2이고 수신 filter의 noise-equivalent bandwidth가 Bn이면 출력 noise power는 대략 N0Bn이다.'
    anchor_en: 'For two-sided AWGN density N0/2 and receiver noise-equivalent bandwidth Bn, output noise power is approximately N0Bn.'
    practice_ko: 'Gaussian PDF에서 ±σ, ±2σ 구간을 표시하고, 주어진 signal RMS와 noise variance로 SNR = Ps/Pn 및 dB 값을 함께 계산한다.'
    practice_en: 'Mark ±σ and ±2σ on a Gaussian density, then calculate both linear SNR = Ps/Pn and its decibel value from signal RMS and noise variance.'
  pulse-shaping:
    body_ko: 'PAM은 symbol마다 amplitude를 고르고 symbol pulse를 시간축에 배치한다. raised-cosine filter는 symbol 시점의 zero crossing을 유지하면서 roll-off factor로 excess bandwidth와 시간영역 꼬리 길이를 절충한다.'
    body_en: 'PAM selects an amplitude for each symbol and places a symbol pulse in time. A raised-cosine filter preserves zero crossings at symbol instants while its roll-off factor trades excess bandwidth against time-domain tail length.'
    anchor_ko: 'symbol rate Rs와 roll-off α에서 raised-cosine baseband 한쪽 bandwidth는 B = Rs(1 + α)/2이다.'
    anchor_en: 'For symbol rate Rs and roll-off α, the one-sided raised-cosine baseband bandwidth is B = Rs(1 + α)/2.'
    practice_ko: '같은 Rs에서 α = 0, 0.5, 1의 bandwidth를 계산하고 pulse 파형의 side lobe와 zero-crossing 위치가 어떻게 달라지는지 비교한다.'
    practice_en: 'At the same Rs, calculate bandwidth for α = 0, 0.5, and 1, then compare pulse sidelobes and zero-crossing locations.'
  isi-nyquist:
    body_ko: 'channel과 filter가 symbol pulse를 이웃 symbol 시점까지 퍼뜨리면 inter-symbol interference가 생긴다. Nyquist zero-ISI 조건은 원하는 sampling 시점에서 자기 pulse만 남게 하며, eye diagram은 timing offset과 noise가 이 조건을 얼마나 훼손하는지 보여준다.'
    body_en: 'Inter-symbol interference occurs when channel and filter spreading carries one symbol pulse into neighboring decision instants. The Nyquist zero-ISI condition leaves only the desired pulse at each sample, and an eye diagram reveals timing-offset and noise penalties.'
    anchor_ko: '등가 pulse g(t)가 g(0) = 1, g(kT) = 0 for k ≠ 0을 만족하면 정확한 symbol timing에서 zero ISI가 된다.'
    anchor_en: 'An equivalent pulse satisfying g(0) = 1 and g(kT) = 0 for nonzero integer k gives zero ISI at the correct symbol timing.'
    practice_ko: '여러 symbol 구간을 T 길이로 겹쳐 eye diagram을 구성하고, 가장 큰 eye opening의 sampling point와 timing offset에 따른 수직 여유 감소를 표시한다.'
    practice_en: 'Overlay waveform segments one symbol period long, identify the sampling point at maximum eye opening, and mark loss of vertical margin as timing offset grows.'
  matched-filter:
    body_ko: 'correlator는 수신 신호와 기준 pulse의 내적을 decision statistic으로 만들고, matched filter는 같은 계산을 convolution 구조로 구현한다. AWGN에서 sampling 시점의 signal energy를 모아 noise 대비 출력을 최대화한 뒤 threshold로 symbol을 결정한다.'
    body_en: 'A correlator forms a decision statistic as an inner product with the reference pulse, while a matched filter implements the same operation by convolution. In AWGN it collects signal energy for maximum sampled SNR before threshold detection.'
    anchor_ko: 'pulse p(t)에 맞춘 filter는 h(t) = kp*(T − t)이고, 출력 y(T) = ∫r(t)p*(t)dt가 correlator 결과와 같다.'
    anchor_en: 'For pulse p(t), the matched impulse response is h(t) = kp*(T − t), and y(T) = ∫r(t)p*(t)dt equals the correlator output.'
    practice_ko: '두 binary hypothesis의 decision statistic 평균 사이에 threshold를 놓고, noise가 있을 때 어느 쪽 분포의 tail이 오류를 만드는지 그림으로 확인한다.'
    practice_en: 'Place a threshold between the mean decision statistics of two binary hypotheses and sketch which distribution tail produces each error event.'
  binary-modulation:
    body_ko: 'ASK는 amplitude, FSK는 주파수, PSK는 phase에 bit를 대응시킨다. coherent detection은 carrier 기준을 사용하고, signal constellation의 거리와 파형 간 orthogonality가 같은 bit energy에서 오류 가능성을 정한다.'
    body_en: 'ASK maps bits to amplitude, FSK to frequency, and PSK to phase. Coherent detection uses a carrier reference, while constellation distance and waveform orthogonality determine error susceptibility for a given bit energy.'
    anchor_ko: 'coherent BPSK의 두 점은 ±√Eb이고 Euclidean distance는 2√Eb이며, orthogonal coherent BFSK의 점 사이 거리는 √(2Eb)다.'
    anchor_en: 'Coherent BPSK points lie at ±√Eb with distance 2√Eb, whereas coherent orthogonal BFSK signals are separated by √(2Eb).'
    practice_ko: 'ASK·orthogonal FSK·BPSK의 basis-function 좌표를 그려 energy와 최소 거리를 비교하고, 각 방식의 receiver가 필요한 carrier·frequency 기준을 적는다.'
    practice_en: 'Draw basis-function coordinates for ASK, orthogonal FSK, and BPSK, compare energy and minimum distance, and list the carrier or frequency references each receiver needs.'
  qpsk-qam:
    body_ko: 'QPSK는 I/Q 두 직교 축에 2 bit symbol을 배치하고, QAM은 amplitude 단계까지 늘려 symbol당 bit 수를 높인다. Gray coding은 가까운 constellation 점이 한 bit만 다르게 하여 symbol error가 여러 bit error로 번지는 것을 줄인다.'
    body_en: 'QPSK places two-bit symbols on orthogonal I and Q axes, while QAM adds amplitude levels to carry more bits per symbol. Gray coding makes nearest constellation neighbors differ by one bit, limiting bit errors from a symbol mistake.'
    anchor_ko: 'M-QAM의 symbol당 bit 수는 k = log2M이고, 같은 bit rate Rb에서 symbol rate는 Rs = Rb/k다.'
    anchor_en: 'An M-QAM symbol carries k = log2M bits, so at bit rate Rb the symbol rate is Rs = Rb/k.'
    practice_ko: 'Gray-coded QPSK와 16-QAM constellation을 그리고 평균 energy로 정규화한 뒤 nearest-neighbor distance와 결정 경계를 비교한다.'
    practice_en: 'Draw Gray-coded QPSK and 16-QAM constellations, normalize average energy, and compare nearest-neighbor distances and decision boundaries.'
  error-probability:
    body_ko: 'Q-function은 Gaussian decision variable이 threshold를 넘는 tail 확률을 나타내며, Eb/N0는 bit energy를 noise density와 비교한다. theoretical BER curve는 receiver model의 기준선이고 Monte Carlo estimate는 충분한 오류 표본을 모아 그 곡선을 수치적으로 근사한다.'
    body_en: 'The Q-function gives a Gaussian decision variable tail probability, and Eb/N0 compares bit energy with noise density. A theoretical BER curve is the receiver-model reference, while a Monte Carlo estimate approximates it from observed error events.'
    anchor_ko: 'coherent BPSK의 이론 BER은 Pb = Q(√(2Eb/N0))이고, simulation estimate는 BERhat = Nerror/Nbit다.'
    anchor_en: 'For coherent BPSK, theoretical BER is Pb = Q(√(2Eb/N0)), and a simulation estimate is BERhat = Nerror/Nbit.'
    practice_ko: 'Eb/N0 지점별 목표 오류 수를 먼저 정하고 bit를 생성하는 계산 절차를 설계한 뒤, 오류가 너무 적은 고 SNR 지점은 신뢰구간이 넓어짐을 표시한다.'
    practice_en: 'Set a target number of errors per Eb/N0 point before defining the bit-generation loop, and mark high-SNR estimates with too few errors as statistically uncertain.'
  synchronization:
    body_ko: 'carrier offset은 constellation을 시간에 따라 회전시키고 phase offset은 고정 회전을 만든다. symbol timing이 어긋나면 eye opening이 줄며, 알려진 preamble은 carrier·phase·timing 오차를 data decision 전에 추정하는 기준이 된다.'
    body_en: 'Carrier offset rotates the constellation over time, phase offset creates a fixed rotation, and symbol-timing error narrows the eye opening. A known preamble provides a reference for estimating all three before data decisions.'
    anchor_ko: 'frequency offset Δf가 있으면 nth symbol phase error는 φ[n] = φ0 + 2πΔf·nT로 누적되어 constellation이 일정 각속도로 돈다.'
    anchor_en: 'With frequency offset Δf, phase error at symbol n is φ[n] = φ0 + 2πΔf·nT, causing steady constellation rotation.'
    practice_ko: 'preamble correlation peak로 frame 시작점을 찾고, 연속 preamble symbol의 phase 차로 Δf를 추정한 뒤 residual phase와 timing sample 위치를 별도로 점검한다.'
    practice_en: 'Use the preamble correlation peak for frame start, estimate Δf from phase change across known symbols, and then check residual phase and timing sample position separately.'
  channel-coding-simulation:
    body_ko: 'block code는 data bit에 parity를 더해 유효 codeword 사이 거리를 넓히고 coding gain을 얻는다. AWGN link에서는 encoder·modulator·noise·decoder를 같은 Eb/N0 기준으로 연결한 뒤 uncoded와 coded BER curve를 비교해야 한다.'
    body_en: 'A block code adds parity to data bits, increasing distance between valid codewords and providing coding gain. In an AWGN link, encoder, modulator, noise, and decoder must share a consistent Eb/N0 definition before coded and uncoded BER curves are compared.'
    anchor_ko: '(n,k) code의 code rate는 R = k/n이며, 같은 Eb/N0에서 symbol energy를 설정할 때 parity로 늘어난 전송 bit 수를 반영해야 한다.'
    anchor_en: 'An (n,k) block code has rate R = k/n, and symbol-energy scaling at a given Eb/N0 must account for the extra transmitted parity bits.'
    practice_ko: 'all-zero codeword부터 encoder와 syndrome decoder를 단위 확인 대상으로 만들고, uncoded·hard-decision coded link의 BER 축과 Eb/N0 정의를 동일하게 맞춘다.'
    practice_en: 'Use the all-zero codeword to check encoder and syndrome decoder logic, then align BER axes and Eb/N0 definitions for uncoded and hard-decision coded links.'
