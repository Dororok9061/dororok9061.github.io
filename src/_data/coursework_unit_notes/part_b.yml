automatic-control:
  dynamic-system-models:
    body_ko: "질량-스프링-댐퍼와 RLC 회로는 물리량은 다르지만 미분방정식으로 입력과 출력의 관계를 세운다는 점이 같다. 힘을 입력, 변위를 출력으로 두거나 전압을 입력, 전류를 출력으로 두면 어떤 상태를 모델에 남겨야 하는지 분명해진다."
    body_en: "A mass-spring-damper system and an RLC circuit use different physical quantities, yet both connect an input to an output through differential equations. Choosing force and displacement, or voltage and current, makes the model boundary and required states explicit."
    anchor_ko: "기계계의 기준식은 m x'' + c x' + kx = F(t)이다. 회로의 KVL 식과 항별로 대응시켜 관성·감쇠·복원 요소가 응답에 맡는 역할을 비교한다."
    anchor_en: "The mechanical reference is m x'' + c x' + kx = F(t). Comparing its terms with a KVL equation shows how inertia, damping, and restoring elements shape the response."
    practice_ko: "자유물체도 또는 회로도를 먼저 그리고, 각 항의 단위와 부호를 확인한 뒤 입력에서 출력까지의 인과 경로가 식에 빠짐없이 들어갔는지 점검한다."
    practice_en: "Start from a free-body or circuit diagram, check every term's units and sign, and confirm that the equation preserves the complete causal path from input to output."
  laplace-transfer-function:
    body_ko: "Laplace transform은 미분방정식을 대수식으로 바꾸지만 초기조건까지 자동으로 사라지는 것은 아니다. 전달함수는 초기조건을 0으로 둔 입력-출력 비이고, pole과 zero 및 분모 차수는 그 시스템의 동특성을 압축해 보여준다."
    body_en: "The Laplace transform turns a differential equation into an algebraic relation, but it does not erase initial conditions by itself. A transfer function is the zero-initial-condition input-output ratio, while poles, zeros, and denominator order summarize the dynamics."
    anchor_ko: "초기조건을 분리한 뒤 G(s)=Y(s)/U(s)로 둔다. 분모 근은 자연응답의 mode, 분자 근은 특정 입력-출력 경로가 약해지는 위치로 읽는다."
    anchor_en: "After separating the initial-condition terms, define G(s)=Y(s)/U(s). Denominator roots identify natural-response modes, whereas numerator roots mark frequencies or modes suppressed by the chosen input-output path."
    practice_ko: "같은 미분방정식에서 초기조건 응답과 영초기조건 전달함수를 각각 적고, pole-zero 상쇄를 하기 전 실제 시스템 차수가 가려지는지 확인한다."
    practice_en: "Write the initial-condition response and the zero-state transfer function separately, then check whether any apparent pole-zero cancellation hides a physical system order."
  block-diagram:
    body_ko: "직렬 연결은 전달함수를 곱하고 병렬 연결은 더하지만 feedback loop는 신호가 되돌아오는 부호까지 포함해야 한다. 복잡한 block diagram은 reduction으로 줄일 수 있고, 얽힌 signal-flow graph는 Mason gain formula로 같은 전체 전달함수를 확인할 수 있다."
    body_en: "Series blocks multiply and parallel paths add, whereas a feedback loop also depends on the return-path sign. Block reduction simplifies nested structures, and Mason's gain formula provides an independent route through a signal-flow graph."
    anchor_ko: "음의 feedback의 기본 결과 Gcl=G/(1+GH)를 기준으로 삼는다. Signal-flow graph에서는 forward path gain과 서로 닿지 않는 loop 조합이 분모를 어떻게 바꾸는지 표시한다."
    anchor_en: "Use Gcl=G/(1+GH) as the negative-feedback reference. In a signal-flow graph, mark each forward-path gain and the non-touching loop products that form Mason's determinant."
    practice_ko: "합산점과 pickoff point를 옮길 때 신호 scale이 유지되는지 확인하고, reduction 결과와 Mason 식의 분자·분모가 같은지 비교한다."
    practice_en: "When moving a summing or pickoff point, verify that signal scaling is preserved, then compare the numerator and denominator obtained by block reduction and Mason's formula."
  time-response:
    body_ko: "표준 2차계의 step response는 자연주파수와 감쇠비가 rise time, overshoot, settling time을 함께 결정한다. 빠른 응답만 좇으면 감쇠가 부족해 overshoot가 커질 수 있으므로 네 시간영역 지표를 한 곡선에서 같이 읽어야 한다."
    body_en: "For a standard second-order system, natural frequency and damping ratio jointly determine rise time, overshoot, and settling time. Pursuing speed alone can reduce damping and increase overshoot, so the time-domain measures must be read from the same step-response curve."
    anchor_ko: "분모를 s^2+2ζωn s+ωn^2와 맞추고, 0<ζ<1에서 Mp=exp(-πζ/sqrt(1-ζ^2))를 사용해 pole 위치와 peak 크기를 연결한다."
    anchor_en: "Match the denominator to s^2+2ζωn s+ωn^2. For 0<ζ<1, Mp=exp(-πζ/sqrt(1-ζ^2)) connects pole location to peak overshoot."
    practice_ko: "Step plot에 10–90% rise 구간, 첫 peak, 허용오차 band를 따로 표시하고 각각의 정의를 혼용하지 않았는지 확인한다."
    practice_en: "Mark the 10–90% rise interval, first peak, and settling band separately on a step plot so that the response-time definitions are not mixed."
  steady-state-error:
    body_ko: "정상상태 오차는 feedback 구조의 system type과 입력 형태가 함께 정한다. 원점 pole 수가 늘면 step와 ramp 추종 능력이 달라지고, error constant와 final value theorem이 그 차이를 수치식으로 연결한다."
    body_en: "Steady-state error depends jointly on feedback system type and reference shape. The number of open-loop poles at the origin changes step and ramp tracking, and error constants connect that structure to the final-value result."
    anchor_ko: "Unity feedback에서 ess=lim(s→0) sE(s)를 먼저 쓰고 Kp=lim G(s), Kv=lim sG(s)를 입력 종류에 맞게 적용한다. Final value theorem은 폐루프가 안정할 때만 사용한다."
    anchor_en: "For unity feedback, start with ess=lim(s→0) sE(s), then apply Kp=lim G(s) or Kv=lim sG(s) according to the input. The final value theorem is valid only when the required closed-loop poles are stable."
    practice_ko: "같은 loop에 step와 ramp 입력을 각각 넣어 오차 식을 만들고, type 판정과 극한 계산이 같은 결론을 주는지 대조한다."
    practice_en: "Form error expressions for step and ramp inputs on the same loop, then check that the system-type rule and direct limit calculation agree."
  routh-stability:
    body_ko: "Routh-Hurwitz 표는 characteristic equation의 계수만으로 우반평면 pole 수를 판정한다. 첫 열의 부호 변화가 안정도와 연결되고, 계수에 gain이 포함되면 모든 첫 열 항이 같은 부호가 되는 범위가 허용 gain 범위가 된다."
    body_en: "A Routh-Hurwitz array determines the number of right-half-plane poles directly from the characteristic-polynomial coefficients. Sign changes in the first column reveal instability, and a symbolic gain turns the same conditions into an admissible gain interval."
    anchor_ko: "a_n s^n+...+a_0=0의 계수를 두 행에 교대로 배치한 뒤 첫 열을 끝까지 계산한다. 첫 열이 모두 양수라는 부등식을 동시에 풀어 gain 조건을 얻는다."
    anchor_en: "Place alternating coefficients of a_n s^n+...+a_0=0 in the first two rows and complete the first column. Solve all first-column positivity inequalities together to obtain the gain condition."
    practice_ko: "첫 열의 0과 한 행 전체가 0인 특수 경우를 구분하고, 경계 gain에서는 허수축 근이 생기는지 보조다항식으로 확인한다."
    practice_en: "Treat a zero leading element separately from an all-zero row, and use the auxiliary polynomial to check for imaginary-axis roots at a boundary gain."
  root-locus:
    body_ko: "Root locus는 loop gain이 변할 때 폐루프 pole이 open-loop pole에서 출발해 zero 또는 무한대로 이동하는 경로다. Branch 수, asymptote, breakaway point를 먼저 잡고 angle condition으로 실제 궤적을 가려낸 뒤 gain을 선택한다."
    body_en: "A root locus traces closed-loop poles from open-loop poles toward zeros or infinity as loop gain changes. Branch count, asymptotes, and breakaway points establish the geometry; the angle condition selects the valid path before gain is chosen."
    anchor_ko: "1+KG(s)H(s)=0에서 angle G(s)H(s)=(2q+1)180°를 만족하는 점만 locus에 놓인다. 실수축 breakaway 후보는 K(s)=-1/[G(s)H(s)]에서 dK/ds=0으로 찾는다."
    anchor_en: "From 1+KG(s)H(s)=0, only points satisfying angle G(s)H(s)=(2q+1)180° lie on the locus. Real-axis breakaway candidates follow from dK/ds=0 applied to K(s)=-1/[G(s)H(s)]."
    practice_ko: "원하는 감쇠비 선과 자연주파수 원을 s-plane에 겹치고, 교점에서 magnitude condition으로 gain을 계산한 뒤 다른 pole의 위치도 함께 점검한다."
    practice_en: "Overlay the desired damping-ratio line and natural-frequency circle on the s-plane, compute gain from the magnitude condition at their intersection, and inspect every remaining pole."
  frequency-response:
    body_ko: "Sinusoidal steady state에서는 G(jω)의 magnitude가 진폭비, phase가 시간 지연의 위상 표현이 된다. Pole과 zero가 만든 주파수별 변화에서 resonance와 bandwidth를 읽으면 시간응답과 다른 관점으로 시스템 속도와 감쇠를 볼 수 있다."
    body_en: "In sinusoidal steady state, the magnitude of G(jω) gives the amplitude ratio and its phase gives the relative phase delay. Pole-zero effects across frequency reveal resonance and bandwidth, complementing the time-domain view of speed and damping."
    anchor_ko: "입력 u=A sin ωt에 대한 정상응답은 |G(jω)|A sin(ωt+∠G(jω))로 적는다. Magnitude peak와 -3 dB 교차점을 같은 plot에 표시해 resonance와 bandwidth를 구분한다."
    anchor_en: "For u=A sin ωt, write the steady response as |G(jω)|A sin(ωt+∠G(jω)). Mark the magnitude peak and the -3 dB crossing on the same plot to distinguish resonance from bandwidth."
    practice_ko: "몇 개의 대표 주파수에서 복소수 G(jω)를 직접 계산하고, magnitude와 phase 곡선이 저주파·고주파 극한 및 pole 차수와 맞는지 확인한다."
    practice_en: "Evaluate complex G(jω) at several representative frequencies and verify that the magnitude and phase limits agree with the pole count at low and high frequency."
  bode-plot:
    body_ko: "Bode plot은 log frequency 축에서 각 pole과 zero의 magnitude 기울기와 phase 변화를 더해 전체 응답을 만든다. Asymptotic sketch로 corner의 구조를 먼저 잡고 gain crossover와 phase crossover를 정확한 곡선에서 찾아 margin 해석으로 이어간다."
    body_en: "A Bode plot builds total response by adding each pole's and zero's magnitude slope and phase contribution on a logarithmic frequency axis. An asymptotic sketch exposes the corner structure, while the exact curves locate gain and phase crossover frequencies."
    anchor_ko: "1차 pole 하나는 corner 이후 magnitude 기울기에 -20 dB/dec를 더한다. |L(jωgc)|=1인 ωgc와 ∠L(jωpc)=-180°인 ωpc를 서로 다른 교차점으로 표시한다."
    anchor_en: "Each first-order pole adds -20 dB/dec after its corner. Mark ωgc where |L(jωgc)|=1 and ωpc where ∠L(jωpc)=-180° as two distinct crossover frequencies."
    practice_ko: "상수 gain, 원점 pole, 실수 pole·zero를 항별로 분해해 직선 근사를 그린 다음 corner 근처의 정확한 값과 phase 누적을 별도로 보정한다."
    practice_en: "Factor the loop into constant gain, origin terms, and real poles or zeros; draw their straight-line contributions, then correct magnitude and accumulated phase near each corner."
  nyquist-margin:
    body_ko: "Nyquist criterion은 open-loop frequency response가 -1점을 어떻게 감싸는지와 open-loop 우반평면 pole 수를 결합해 closed-loop 안정도를 판단한다. 같은 곡선에서 -1점까지의 거리와 각도를 읽으면 gain margin과 phase margin도 연결된다."
    body_en: "The Nyquist criterion combines encirclements of -1 by the open-loop response with the number of open-loop right-half-plane poles to determine closed-loop stability. The same curve relates distance and angle to gain and phase margins."
    anchor_ko: "선택한 contour 방향과 부호 convention을 먼저 고정한 뒤 N, P, Z 관계를 일관되게 적용한다. Unit-circle 교차와 음의 실수축 교차를 표시해 phase margin과 gain margin을 각각 읽는다."
    anchor_en: "Fix the contour direction and encirclement sign convention before applying the N, P, Z relation. Use the unit-magnitude crossing for phase margin and the negative-real-axis crossing for gain margin."
    practice_ko: "양의 주파수 궤적을 그린 뒤 실수계 전달함수의 켤레대칭으로 음의 주파수 구간을 완성하고, -1점 통과 여부와 encirclement 방향을 확대해 확인한다."
    practice_en: "Plot the positive-frequency path, complete the negative-frequency half by conjugate symmetry for a real system, and inspect the neighborhood of -1 for crossings and encirclement direction."
  pid-control:
    body_ko: "P 동작은 현재 오차에 반응하고, I 동작은 누적 오차를 없애며, D 동작은 오차 변화에 제동을 건다. 세 항을 함께 쓰면 rise time, 정상상태 오차, overshoot 사이의 trade-off뿐 아니라 적분 포화와 미분 noise도 같이 고려해야 한다."
    body_en: "Proportional action responds to present error, integral action removes accumulated offset, and derivative action adds damping from error rate. Combining them trades rise time, steady-state error, and overshoot against integral windup and derivative noise sensitivity."
    anchor_ko: "u(t)=Kp e(t)+Ki∫e(t)dt+Kd de(t)/dt를 기준으로 각 항만 켠 세 응답을 비교한다. 실제 구현을 가정할 때는 D 항에 저역통과 filter를 둔 형태도 함께 적는다."
    anchor_en: "Use u(t)=Kp e(t)+Ki∫e(t)dt+Kd de(t)/dt as the reference and compare responses with each action introduced separately. For an implementable form, include a low-pass filter on the derivative path."
    practice_ko: "동일 plant와 reference에서 P, PI, PID의 step response와 control effort를 나란히 그려, 개선된 지표가 actuator 요구량이나 noise 증폭을 악화시키지 않는지 점검한다."
    practice_en: "Place P, PI, and PID step responses beside their control-effort plots for the same plant and reference, checking whether improved tracking demands excessive actuation or amplifies noise."
  controller-design-review:
    body_ko: "Controller 비교는 한 지표의 승패가 아니라 시간영역 조건, 주파수영역 조건, robustness와 계산된 control effort를 같은 설계 문제로 묶는 과정이다. Simulation comparison은 동일한 plant, 입력, 제한조건을 사용해야 설계 차이를 공정하게 보여준다."
    body_en: "Controller comparison is not a contest on one metric; it combines time-domain requirements, frequency-domain requirements, robustness, and control effort in one design decision. Simulation comparisons are meaningful only under the same plant, input, and limits."
    anchor_ko: "Step plot에는 overshoot와 settling band를, loop Bode plot에는 crossover와 margin을, 별도 plot에는 u(t)를 표시한다. Plant parameter를 바꾼 곡선 묶음으로 robustness를 본다."
    anchor_en: "Annotate overshoot and settling bands on the step plot, crossover and margins on the loop Bode plot, and u(t) on a separate axis. A family of curves under plant-parameter variation exposes robustness."
    practice_ko: "후보 controller마다 같은 요구조건 표를 채우고, nominal 성능뿐 아니라 gain 변화와 포화 제한에서 어떤 조건이 먼저 깨지는지 설계 근거로 남긴다."
    practice_en: "Complete the same requirement matrix for each candidate controller and note which condition fails first under gain variation or saturation, rather than ranking nominal response alone."
applied-control:
  state-variable-model:
    body_ko: "State는 현재 값만 알면 입력과 함께 이후 거동을 정할 수 있는 최소 변수 집합이다. State equation은 내부 변화, output equation은 관측되는 신호, 초기상태는 zero-input response의 출발점을 각각 맡는다."
    body_en: "A state is part of the smallest variable set whose present value and future input determine later behavior. The state equation governs internal evolution, the output equation selects observable signals, and the initial state starts the zero-input response."
    anchor_ko: "연속 LTI 모델을 x'=Ax+Bu, y=Cx+Du로 적는다. Block diagram에서는 적분기 출력들을 state로 두고 A의 연결, B의 입력 경로, C의 관측 경로를 따로 표시한다."
    anchor_en: "Write a continuous LTI model as x'=Ax+Bu and y=Cx+Du. In its block diagram, use integrator outputs as states and show the A interconnections, B input path, and C measurement path separately."
    practice_ko: "후보 state가 서로 독립인지, 모델 차수와 state 수가 맞는지, x(0)을 바꾸었을 때 입력이 없어도 출력이 달라질 수 있는지 식으로 확인한다."
    practice_en: "Check that candidate states are independent, their count matches model order, and a changed x(0) can alter the output even with zero input."
  linearization:
    body_ko: "비선형 system의 linearization은 operating point 주변의 작은 perturbation만 다루는 국소 근사다. Jacobian이 state와 input 변화의 1차 민감도를 만들며, perturbation이 커지면 무시한 고차항 때문에 모델 유효범위를 벗어난다."
    body_en: "Linearization of a nonlinear system is a local approximation for small perturbations around an operating point. Jacobians supply first-order state and input sensitivities, while neglected higher-order terms limit the model's valid region."
    anchor_ko: "f(x,u)를 (x0,u0)에서 전개해 δx'=Aδx+Bδu로 두며 A=∂f/∂x, B=∂f/∂u를 그 점에서 계산한다. 평형점이면 f(x0,u0)=0인지 먼저 확인한다."
    anchor_en: "Expand f(x,u) at (x0,u0) to obtain δx'=Aδx+Bδu, with A=∂f/∂x and B=∂f/∂u evaluated there. For an equilibrium linearization, first verify f(x0,u0)=0."
    practice_ko: "원 비선형 함수와 1차 근사를 operating point 양쪽에서 겹쳐 그려 오차가 빠르게 커지는 구간을 찾고, 그 범위를 넘어선 예측은 사용하지 않는다."
    practice_en: "Overlay the nonlinear function and its first-order approximation on both sides of the operating point, identify where their error grows, and avoid claims beyond that range."
  state-transition:
    body_ko: "State transition matrix는 초기상태가 시간에 따라 어떻게 이동하는지 나타내고, 입력 convolution 항은 zero-state response를 더한다. A의 eigenvalue는 e^(At)에 포함된 mode를 정하므로 응답의 성장·감쇠·진동을 한꺼번에 설명한다."
    body_en: "The state-transition matrix propagates the initial state, while the input convolution contributes the zero-state response. Eigenvalues of A define the modes inside e^(At), linking state motion to growth, decay, and oscillation."
    anchor_ko: "해는 x(t)=e^(At)x(0)+∫[0,t]e^(A(t-τ))Bu(τ)dτ이다. 첫 항과 둘째 항을 분리해 그리고, eigenvector 방향마다 e^(λt)가 붙는 구조를 확인한다."
    anchor_en: "The solution is x(t)=e^(At)x(0)+∫[0,t]e^(A(t-τ))Bu(τ)dτ. Separate the two terms and identify how each eigenvector direction carries an e^(λt) mode."
    practice_ko: "A가 대각행렬인 간단한 경우부터 matrix exponential을 계산하고, t=0에서 transition matrix가 I가 되는지와 계산한 x(t)가 state equation을 만족하는지 대입 점검한다."
    practice_en: "Begin with a diagonal A, verify that the transition matrix equals I at t=0, and substitute the resulting x(t) back into the state equation."
  controllability:
    body_ko: "Controllability는 제한된 시간 안에 입력으로 state를 원하는 위치까지 옮길 수 있는지 묻는다. Controllability matrix의 rank가 부족하면 reachable state 공간이 줄어들며, actuator placement가 B를 바꾸어 그 결과를 좌우한다."
    body_en: "Controllability asks whether an input can move the state to any desired point in finite time. Rank loss in the controllability matrix shrinks the reachable subspace, and actuator placement changes B and therefore the result."
    anchor_ko: "n차계에서 Cc=[B AB ... A^(n-1)B]를 만들고 rank(Cc)=n인지 검사한다. 두 actuator 후보의 B를 각각 넣어 rank와 작은 singular value를 함께 비교한다."
    anchor_en: "For an n-state model, form Cc=[B AB ... A^(n-1)B] and test rank(Cc)=n. Compare candidate actuator locations by replacing B and inspecting rank and the smallest singular value."
    practice_ko: "Rank만 계산하고 끝내지 않고, controllability가 약한 state 방향을 찾아 물리적으로 어떤 mode에 actuator 힘이 전달되지 않는지 block 또는 mode 그림에 표시한다."
    practice_en: "Do not stop at rank; identify weakly controllable state directions and mark the physical mode that receives little actuator authority."
  observability:
    body_ko: "Observability는 출력 기록과 알려진 입력으로 초기state를 구별할 수 있는지 판단한다. Observability matrix의 rank가 부족하면 서로 다른 내부 state가 같은 출력으로 보이는 hidden mode가 생기며, sensor selection이 C를 통해 이를 바꾼다."
    body_en: "Observability determines whether output history and known inputs can distinguish the initial state. Rank deficiency creates hidden modes whose internal states produce identical outputs, and sensor selection changes this through C."
    anchor_ko: "n차계에서 Oc=[C; CA; ...; CA^(n-1)]를 쌓아 rank(Oc)=n을 확인한다. Sensor 후보별 C를 바꿔 어느 eigenvector가 C와 직교해 보이지 않는지 살핀다."
    anchor_en: "For an n-state model, stack Oc=[C; CA; ...; CA^(n-1)] and test rank(Oc)=n. Change C for each sensor candidate and inspect which eigenvector is nearly orthogonal to the measurement."
    practice_ko: "한 state만 달리한 두 초기조건의 출력 곡선을 비교해 구분 가능성을 생각하고, noise가 있으면 작은 출력 차이가 실질적으로 관측 가능한지도 별도로 판단한다."
    practice_en: "Compare output curves from two initial states differing in one component, then consider separately whether a small distinction remains usable in measurement noise."
  state-feedback:
    body_ko: "State feedback은 u=-Kx+r로 state를 입력에 되돌려 A-BK의 closed-loop pole을 배치한다. Ackermann formula는 controllable SISO 모델에서 K를 계산하지만, 빠른 pole을 요구할수록 feedback gain과 입력 크기가 커질 수 있다."
    body_en: "State feedback uses u=-Kx+r so that K places the closed-loop poles of A-BK. Ackermann's formula computes K for a controllable SISO model, but aggressive poles can demand large gains and input magnitude."
    anchor_ko: "원하는 characteristic polynomial을 정한 뒤 K를 구하고 eig(A-BK)가 목표 pole과 일치하는지 확인한다. 동시에 u(t)=-Kx(t)+r의 peak를 actuator 한계와 비교한다."
    anchor_en: "Choose the desired characteristic polynomial, compute K, and verify that eig(A-BK) matches the target poles. Also compare the peak of u(t)=-Kx(t)+r with actuator limits."
    practice_ko: "서로 다른 pole 세트에 대해 state response와 control effort를 나란히 그려, 정착시간 개선이 과도한 입력이나 민감도 증가로 바뀌지 않았는지 검토한다."
    practice_en: "Plot state response and control effort for several pole sets to see whether faster settling is purchased with excessive input or sensitivity."
  observer:
    body_ko: "Luenberger observer는 모델 입력과 측정 출력의 오차를 이용해 측정되지 않은 state를 추정한다. Estimation error는 A-LC로 움직이고, observer pole과 controller pole을 따로 정할 수 있다는 separation principle이 설계를 단순화한다."
    body_en: "A Luenberger observer combines the model input with output innovation to estimate unmeasured states. Estimation error follows A-LC, and the separation principle allows observer and controller poles to be selected independently."
    anchor_ko: "xhat'=Axhat+Bu+L(y-Cxhat), e=x-xhat라 두면 e'=(A-LC)e이다. Error pole을 고른 뒤 observer와 state-feedback을 결합한 block diagram에서 innovation 경로를 표시한다."
    anchor_en: "With xhat'=Axhat+Bu+L(y-Cxhat) and e=x-xhat, the error obeys e'=(A-LC)e. After selecting error poles, mark the innovation path in the combined observer-feedback block diagram."
    practice_ko: "초기 추정오차가 있는 조건에서 실제 state와 추정 state를 겹쳐 보고, observer를 지나치게 빠르게 잡을 때 measurement noise가 L을 통해 커질 가능성도 함께 확인한다."
    practice_en: "Overlay true and estimated states from a nonzero initial estimation error, and inspect how overly fast observer poles can amplify measurement noise through L."
  servo-integral:
    body_ko: "Servo control은 reference tracking을 목표로 하고, output error를 적분한 state를 추가하면 상수 disturbance에도 정상상태 오차를 줄일 수 있다. 대신 증강된 system의 controllability와 actuator saturation을 다시 확인해야 한다."
    body_en: "Servo control targets reference tracking, and augmenting an integral state of output error can reject constant disturbances and remove offset. The augmented system's controllability and actuator saturation must then be reconsidered."
    anchor_ko: "ξ'=r-y를 추가하고 [x;ξ]에 대한 증강 행렬을 만든다. u=-Kx-Kiξ로 둔 block diagram에서 reference와 disturbance가 각각 어느 합산점으로 들어오는지 구분한다."
    anchor_en: "Add ξ'=r-y and form the augmented model for [x;ξ]. In the u=-Kx-Kiξ block diagram, distinguish where the reference and disturbance enter."
    practice_ko: "Reference step와 plant 입력의 상수 disturbance를 따로 가해 output error와 integral state를 비교하고, 포화가 생긴 경우에는 적분 누적을 그대로 허용할지 점검한다."
    practice_en: "Consider a reference step and a constant plant-input disturbance separately, compare output error with the integral state, and check whether integration should continue during saturation."
  discretization:
    body_ko: "연속 model을 digital controller에서 쓰려면 sampling period와 hold 가정을 포함해 discrete state matrix로 바꿔야 한다. Zero-order hold에서는 연속 pole이 z=e^(sT)로 mapping되며, T가 너무 크면 빠른 mode와 transient 정보를 놓친다."
    body_en: "A continuous model must be converted to discrete state matrices with an explicit sampling period and hold assumption before digital control. Under a zero-order hold, continuous poles map as z=e^(sT), and a large T can hide fast modes and transients."
    anchor_ko: "Ad=e^(AT), Bd=∫[0,T]e^(Aτ)B dτ를 사용한다. s-plane의 감쇠 선과 자연주파수 선이 z-plane에서 어디로 이동하는지 pole map으로 연결한다."
    anchor_en: "Use Ad=e^(AT) and Bd=∫[0,T]e^(Aτ)B dτ. Map representative damping and natural-frequency locations from the s-plane into the z-plane."
    practice_ko: "여러 T 후보에서 discrete pole 위치와 step 응답을 비교하되, 단순 Euler 근사와 정확한 ZOH 결과가 얼마나 달라지는지도 별도로 본다."
    practice_en: "Compare discrete poles and step responses for several T choices, and separately quantify the difference between a simple Euler approximation and exact zero-order-hold discretization."
  digital-controller:
    body_ko: "Digital controller는 연속식이 아니라 sample마다 갱신되는 difference equation으로 동작한다. Sample timing, coefficient quantization, computation delay가 이상적인 제어법칙에 추가되며, 한 sample 지연도 closed-loop phase를 바꾼다."
    body_en: "A digital controller operates through a difference equation updated at each sample. Sample timing, coefficient quantization, and computation delay modify the ideal law, and even one sample of delay changes closed-loop phase."
    anchor_ko: "예를 들어 u[k]=u[k-1]+a e[k]+b e[k-1] 형태로 상태 update 순서를 명시한다. Sensor sample, 계산, PWM update를 한 주기 timeline에 배치해 z^-1 지연 위치를 표시한다."
    anchor_en: "For example, specify update order in u[k]=u[k-1]+a e[k]+b e[k-1]. Place sensing, computation, and PWM update on one sample-period timeline and mark every z^-1 delay."
    practice_ko: "Floating-point 식과 제한된 word length 식의 pole·출력을 비교하고, 최악 실행시간이 다음 update 시점 전에 끝나는지 timing budget으로 확인한다."
    practice_en: "Compare poles and outputs for floating-point and limited-word-length coefficients, then verify through a timing budget that worst-case computation finishes before the next update."
  optimal-control:
    body_ko: "LQR은 state error와 input 사용량을 quadratic cost로 함께 벌점화한다. Q와 R weight가 state-input trade-off를 정하고, Riccati equation의 해가 feedback gain으로 이어지므로 원하는 pole을 직접 찍는 방식과 설계 관점이 다르다."
    body_en: "LQR penalizes state deviation and input effort together in a quadratic cost. Q and R weights set the state-input trade-off, and the Riccati equation yields feedback gain without directly prescribing every pole."
    anchor_ko: "J=∫(x^TQx+u^TRu)dt를 쓰고 Riccati 해 P에서 K=R^-1 B^T P를 얻는다. Q의 특정 대각항 또는 R을 바꿀 때 pole과 u(t)가 함께 이동하는 모습을 비교한다."
    anchor_en: "Write J=∫(x^TQx+u^TRu)dt and obtain K=R^-1 B^T P from the Riccati solution P. Vary one diagonal weight in Q or R and compare the resulting poles and u(t)."
    practice_ko: "State 단위를 무시한 weight 선택을 피하고, normalization 전후 Q를 비교한다. 얻은 K에 대해 안정성뿐 아니라 peak input과 각 state의 settling도 점검한다."
    practice_en: "Avoid weights that ignore state units by comparing Q before and after normalization; then check peak input and each state's settling in addition to stability."
  simulation-reading:
    body_ko: "저장된 simulation 영상은 입력과 응답의 시간 정렬, transient 구간, clipping 같은 saturation 징후를 순서대로 읽어야 한다. Parameter 비교는 동일한 축과 초기조건을 유지할 때만 응답 차이를 설계 변수와 연결할 수 있다."
    body_en: "A saved simulation should be read by aligning input and response time axes, isolating the transient, and looking for clipping or other saturation signs. Parameter comparisons are interpretable only with consistent axes and initial conditions."
    anchor_ko: "Frame 또는 plot에서 reference 변화 시각 t0를 정하고 y(t), u(t), state를 같은 시간축에 배치한다. 두 parameter 조건의 차이는 Δy(t)=y2(t)-y1(t)처럼 정의해 비교 기준을 고정한다."
    anchor_en: "Choose the reference-change instant t0 from the frame or plot and align y(t), u(t), and states on one time axis. Define a difference such as Δy(t)=y2(t)-y1(t) to keep parameter comparisons explicit."
    practice_ko: "영상에서 직접 보이는 곡선과 해석으로 추정한 원인을 구분해 메모하고, scale·legend·parameter 표기가 없는 값은 측정치로 단정하지 않는다."
    practice_en: "Separate features directly visible in the recording from inferred causes, and do not present values without a scale, legend, or parameter label as measurements."
high-frequency-engineering:
  distributed-circuits:
    body_ko: "회로 크기가 파장에 비해 충분히 작지 않으면 한 node의 전압과 전류를 동시에 같다고 보는 lumped model이 약해진다. 전기적 길이와 위상속도가 위치별 phase 차이를 만들기 때문에 전송 구조를 distributed model로 읽어야 한다."
    body_en: "When a circuit is not electrically small compared with wavelength, a lumped model cannot treat voltage and current as uniform across a node. Electrical length and phase velocity create position-dependent phase, requiring a distributed-circuit view."
    anchor_ko: "전기적 길이는 θ=βl=2πl/λ이고 위상속도는 vp=ω/β이다. 같은 물리 길이 l도 주파수가 올라가 λ가 짧아지면 더 큰 phase shift를 만든다."
    anchor_en: "Electrical length is θ=βl=2πl/λ and phase velocity is vp=ω/β. The same physical length produces a larger phase shift as frequency rises and wavelength shortens."
    practice_ko: "회로의 가장 긴 배선 길이를 관심 주파수의 유도파장과 비교하고, θ가 무시하기 어려운 구간에서는 lumped 소자 사이 연결도 transmission line으로 표시한다."
    practice_en: "Compare the longest interconnect with guided wavelength at the frequency of interest, and represent interconnects as transmission lines once their electrical length is no longer negligible."
  transmission-lines:
    body_ko: "Transmission line equation은 단위길이 R, L, G, C가 전압·전류의 위치 변화를 만든다는 데서 시작한다. Characteristic impedance와 propagation constant가 forward와 reflected wave의 비와 감쇠·위상을 정하며, lossless line은 R=G=0인 특별한 경우다."
    body_en: "Transmission-line equations begin with per-unit-length R, L, G, and C causing voltage and current to vary with position. Characteristic impedance and propagation constant set forward/reflected-wave relations and attenuation or phase; a lossless line is the R=G=0 case."
    anchor_ko: "Z0=sqrt((R+jωL)/(G+jωC)), γ=sqrt((R+jωL)(G+jωC))를 기준으로 V(z)=V+e^-γz+V-e^γz를 적는다. Lossless이면 Z0=sqrt(L/C), γ=jωsqrt(LC)로 줄어든다."
    anchor_en: "Use Z0=sqrt((R+jωL)/(G+jωC)) and γ=sqrt((R+jωL)(G+jωC)) with V(z)=V+e^-γz+V-e^γz. For a lossless line these reduce to Z0=sqrt(L/C) and γ=jωsqrt(LC)."
    practice_ko: "주어진 per-unit-length 값의 단위를 먼저 맞추고, 계산한 Z0와 γ의 실수·허수부가 수동선로의 감쇠 및 진행방향 convention과 일치하는지 확인한다."
    practice_en: "Normalize the per-unit-length units first, then check that the real and imaginary parts of Z0 and γ agree with passive-line attenuation and the chosen propagation convention."
  reflection-vswr:
    body_ko: "Load mismatch가 생기면 입사파 일부가 반사되고 reflection coefficient의 크기와 phase가 그 비를 표현한다. Return loss는 반사 크기를 dB로, VSWR은 선로 위 최대·최소 전압비로 나타내므로 모두 같은 mismatch를 다른 방식으로 읽는다."
    body_en: "A load mismatch reflects part of the incident wave, with reflection-coefficient magnitude and phase describing that ratio. Return loss expresses its magnitude in decibels, whereas VSWR uses the line's maximum-to-minimum voltage ratio."
    anchor_ko: "ΓL=(ZL-Z0)/(ZL+Z0), RL=-20log10|ΓL|, VSWR=(1+|ΓL|)/(1-|ΓL|)를 한 묶음으로 계산한다. ZL=Z0이면 Γ=0, RL은 무한대, VSWR은 1이 된다."
    anchor_en: "Compute ΓL=(ZL-Z0)/(ZL+Z0), RL=-20log10|ΓL|, and VSWR=(1+|ΓL|)/(1-|ΓL|) together. For ZL=Z0, Γ=0, return loss tends to infinity, and VSWR equals one."
    practice_ko: "Open, short, matched load 세 경우를 먼저 대입해 부호와 극한을 점검하고, 복소 Γ를 magnitude만으로 줄일 때 잃는 위치·phase 정보도 구분한다."
    practice_en: "Test open, short, and matched loads to verify signs and limits, and note which position and phase information is lost when complex Γ is reduced to magnitude alone."
  smith-chart:
    body_ko: "Smith chart는 normalized impedance를 reflection coefficient 평면에 옮긴 그림이다. Constant-resistance circle과 reactance arc를 따라 load를 찾고, admittance 변환과 line rotation을 이용해 series 또는 shunt matching 위치를 읽는다."
    body_en: "The Smith chart maps normalized impedance onto the reflection-coefficient plane. Constant-resistance circles and reactance arcs locate the load, while admittance conversion and line rotation support series or shunt matching."
    anchor_ko: "z=Z/Z0를 표시한 뒤 chart 중심을 기준으로 180° 회전하면 y=1/z 점을 얻는다. Lossless line에서 load 쪽과 generator 쪽 이동은 |Γ| circle 위의 반대 방향 회전이다."
    anchor_en: "Plot z=Z/Z0 and rotate 180 degrees about the chart center to obtain y=1/z. Along a lossless line, motion toward the load and generator follows opposite directions on the constant-|Γ| circle."
    practice_ko: "복소수 식으로 계산한 Γ와 chart 위치를 대조하고, wavelength scale에서 읽은 회전량이 실제 선로 길이의 2βl phase 변화와 맞는지 확인한다."
    practice_en: "Compare the chart point with Γ calculated algebraically, and verify that the wavelength-scale rotation corresponds to the 2βl change in reflection phase."
  impedance-matching:
    body_ko: "Impedance matching은 source에서 load로 전달되는 전력을 높이거나 반사를 줄이도록 입력 impedance를 기준값에 맞추는 과정이다. L-network, quarter-wave transformer, single-stub은 같은 목표를 다른 소자와 공간 구조로 이루며 각 방식의 bandwidth가 다르다."
    body_en: "Impedance matching transforms the input impedance toward a reference value to improve power transfer or reduce reflection. L-networks, quarter-wave transformers, and single stubs reach that goal with different elements and bandwidth behavior."
    anchor_ko: "실수 load 두 개를 λ/4 선로로 잇는 경우 Zt=sqrt(Z0 ZL)를 쓴다. L-network와 stub은 design frequency에서 residual reactance 또는 susceptance가 0이 되도록 정한다."
    anchor_en: "For two real impedances connected by a quarter-wave section, use Zt=sqrt(Z0 ZL). An L-network or stub is selected so residual reactance or susceptance vanishes at the design frequency."
    practice_ko: "세 matching 방식의 |S11| 곡선을 같은 주파수축에 그린다는 설계안을 세우고, 중심주파수의 match뿐 아니라 허용 return-loss 구간의 폭도 비교한다."
    practice_en: "Plan a common-frequency-axis comparison of |S11| for all three methods, evaluating not only the center-frequency match but also the width meeting a return-loss target."
  microstrip:
    body_ko: "Microstrip은 conductor와 ground 사이 field 일부가 substrate, 일부가 공기에 놓여 effective permittivity로 전파속도를 표현한다. Line width와 substrate height 비가 characteristic impedance를 좌우하고, 주파수가 오르면 dispersion 때문에 단일 εeff 근사가 달라질 수 있다."
    body_en: "A microstrip's fields occupy both substrate and air, so effective permittivity describes its propagation speed. The line-width to substrate-height ratio strongly sets characteristic impedance, while dispersion makes a single εeff approximation frequency dependent."
    anchor_ko: "W/h와 εr에서 εeff와 Z0를 구한 뒤 guided wavelength λg=c/(f sqrt(εeff))를 계산한다. 같은 Z0를 목표로 W를 바꿀 때 fabrication 가능한 폭인지도 함께 본다."
    anchor_en: "Estimate εeff and Z0 from W/h and εr, then calculate λg=c/(f sqrt(εeff)). When solving for W at a target Z0, also check whether the width is manufacturable."
    practice_ko: "Substrate height와 εr 공차를 각각 흔들어 Z0와 전기적 길이 민감도를 표로 만들고, 급격한 폭 변화와 reference-plane 위치도 layout 점검항목에 넣는다."
    practice_en: "Vary substrate height and εr within plausible tolerances to tabulate Z0 and electrical-length sensitivity, and include abrupt width changes and reference-plane placement in the layout review."
  s-parameters:
    body_ko: "S-parameter는 정한 reference impedance에서 port로 들어가고 나오는 power wave의 비를 나타낸다. S11은 input reflection과 return loss, S21은 forward transmission과 insertion loss를 연결하며 dB 표현은 복소 크기의 비를 읽기 쉽게 바꾼다."
    body_en: "S-parameters relate incident and outgoing power waves at ports referenced to a chosen impedance. S11 describes input reflection and return loss, while S21 describes forward transmission and insertion loss; decibels compact their magnitude ratios."
    anchor_ko: "Magnitude plot에서는 Sij,dB=20log10|Sij|를 사용한다. Passive two-port에서 |S21|이 1을 넘는 것처럼 보이면 reference impedance, normalization, active element 여부를 먼저 확인한다."
    anchor_en: "For magnitude plots use Sij,dB=20log10|Sij|. If a passive two-port appears to have |S21| greater than one, first inspect reference impedance, normalization, and whether any active element is present."
    practice_ko: "Plot legend와 port 번호를 회로도에 직접 대응시키고, S11 minimum과 S21 level을 같은 marker frequency에서 읽어 서로 다른 주파수 값을 섞지 않는다."
    practice_en: "Map plot legends directly to schematic port numbers, then read the S11 minimum and S21 level at the same marker frequency rather than mixing frequencies."
  cadence-workflow:
    body_ko: "Cadence workflow는 schematic 구성, port와 reference 설정, frequency sweep, marker 판독이 하나의 검증 사슬이다. 앞 단계의 port 번호나 단위가 틀리면 마지막 graph가 매끄러워도 해석 대상이 달라질 수 있다."
    body_en: "A Cadence workflow links schematic construction, port and reference setup, frequency sweep, and marker reading into one verification chain. Incorrect port numbering or units upstream can make a smooth final graph describe the wrong circuit."
    anchor_ko: "회로도에서 각 port의 번호·Zref·ground를 표로 옮기고, sweep의 start/stop/step 또는 points-per-decade를 기록한다. Marker는 curve 이름과 frequency, complex 또는 dB 값을 함께 읽는다."
    anchor_en: "Transfer each port's number, Zref, and ground from the schematic into a setup table, and record sweep start, stop, and resolution. Read every marker with curve name, frequency, and complex or dB value."
    practice_ko: "Netlist 전에 floating node와 잘못 연결된 ground를 점검하고, simulation 뒤에는 예상 limiting case와 curve order를 확인해 단순 screenshot 모양만으로 결론내리지 않는다."
    practice_en: "Check for floating nodes and incorrect grounds before netlisting, then verify limiting behavior and curve order after simulation rather than judging only the screenshot shape."
  l-network-stub:
    body_ko: "L-matching은 series reactance와 shunt susceptance 두 자유도로 load를 design frequency에서 맞춘다. 분포소자 방식에서는 open stub 길이가 shunt susceptance를 만들며, 원하는 match는 특정 주파수에서만 정확하므로 frequency response를 같이 봐야 한다."
    body_en: "An L-match uses series reactance and shunt susceptance to transform a load at one design frequency. In a distributed implementation, an open stub supplies the shunt susceptance, so the exact match is inherently frequency selective."
    anchor_ko: "Series 요소로 normalized impedance를 g=1 circle 또는 적절한 resistance 지점으로 옮긴 뒤 shunt B로 center에 도달한다. Open stub은 lossless 근사에서 입력 susceptance가 tan(βl)에 비례한다."
    anchor_en: "Use the series element to move normalized impedance to the required conductance or resistance locus, then cancel the remaining shunt term with B. For a lossless open stub, input susceptance is proportional to tan(βl)."
    practice_ko: "Design frequency marker에서 실수부와 허수부를 따로 확인하고, stub 길이를 조금 바꾼 sweep으로 S11 minimum 위치가 어느 방향으로 이동하는지 설계 민감도를 본다."
    practice_en: "At the design-frequency marker, inspect real and imaginary parts separately, then sweep a small stub-length variation to see how the S11 minimum shifts."
  wilkinson-divider:
    body_ko: "Wilkinson divider는 두 quarter-wave arm으로 input power를 균등 분배하고 output 사이 isolation resistor로 odd-mode energy를 흡수한다. 대칭·matched 조건에서는 S21과 S31이 같은 크기지만 output isolation은 resistor와 arm의 전기적 길이에 의존한다."
    body_en: "A Wilkinson divider uses two quarter-wave arms for equal power split and an isolation resistor to absorb odd-mode energy between outputs. Under symmetric matched conditions S21 and S31 have equal magnitude, while isolation depends on the resistor and arm electrical length."
    anchor_ko: "Equal-split 설계에서 각 arm impedance는 sqrt(2)Z0, resistor는 2Z0, arm 길이는 design frequency의 λg/4가 기준이다. Ideal 전달 크기는 각 output에서 약 -3.01 dB다."
    anchor_en: "For an equal split, each arm uses sqrt(2)Z0, the isolation resistor uses 2Z0, and arm length is λg/4 at the design frequency. Ideal transmission to either output is about -3.01 dB."
    practice_ko: "S21과 S31의 amplitude balance뿐 아니라 S11 match와 output 간 S23 isolation을 같은 frequency marker에서 확인하는 four-curve 점검안을 만든다."
    practice_en: "Define a four-curve check that reads S21/S31 amplitude balance, S11 input match, and S23 output isolation at the same frequency marker."
  branch-line-hybrid:
    body_ko: "Branch-line hybrid는 네 개의 quarter-wave branch로 input을 coupled port와 through port에 나누면서 약 90도 phase difference를 만든다. 네-port network의 대칭이 amplitude balance를 정하고, 남은 port는 isolated 상태가 되어야 한다."
    body_en: "A branch-line hybrid uses four quarter-wave branches to divide an input between through and coupled ports with an approximately ninety-degree phase difference. Four-port symmetry controls amplitude balance, and the remaining port should be isolated."
    anchor_ko: "Design frequency에서 두 전달경로의 |S|와 phase를 함께 그려 Δφ=unwrap(∠Scoupled-∠Sthrough)를 계산한다. Isolation port의 S값은 같은 marker에서 별도로 읽는다."
    anchor_en: "Plot magnitude and phase of both transmission paths at the design frequency and compute Δφ=unwrap(angle Scoupled-angle Sthrough). Read the isolated-port S-parameter at the same marker."
    practice_ko: "Port 배치가 그림과 S-parameter index에서 일치하는지 먼저 확인하고, amplitude imbalance, phase error, isolation을 각기 다른 축이나 표로 분리해 평가한다."
    practice_en: "First reconcile physical port placement with S-parameter indices, then evaluate amplitude imbalance, phase error, and isolation as separate quantities."
  result-interpretation:
    body_ko: "S-parameter 그림을 다시 읽을 때는 marker frequency, 설계 target, 실제 curve의 차이를 같은 단위로 비교해야 한다. Resonance shift는 원인을 추정할 단서지만, archived figure와 새로 그린 도식의 출처를 구분해야 과거 결과를 재실행 결과처럼 오해하지 않는다."
    body_en: "Re-reading an S-parameter figure requires comparing marker frequency, design target, and curve result in consistent units. Resonance shift can guide diagnosis, but archived figures must remain distinct from redrawn diagrams or new runs."
    anchor_ko: "Target frequency ft와 curve minimum 또는 crossing fr를 정하고 Δf=fr-ft, 상대 shift=Δf/ft를 계산하는 틀을 쓴다. 각 그림에는 archive, redraw, simulation 여부와 읽은 trace 이름을 함께 기록한다."
    anchor_en: "Define target frequency ft and observed minimum or crossing fr, then use Δf=fr-ft and relative shift Δf/ft. Label each figure as archive, redraw, or simulation and record the trace name used."
    practice_ko: "축 범위·dB scale·port index·marker label을 순서대로 확인한 뒤 target 표와 비교한다. 그림만 남아 조건을 알 수 없는 값은 관측된 표시로만 적고 원인이나 재현성을 단정하지 않는다."
    practice_en: "Check axis range, dB scale, port index, and marker label before comparing with the target table. When conditions are absent, report only what the figure displays and avoid claims about cause or reproducibility."
