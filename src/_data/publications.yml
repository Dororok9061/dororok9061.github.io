  abstract_ko: PPG에서 추출한 HRV 특징을 사용해 인지 과제 수행 능력을 분류하고 CNN 접근법을 평가한 연구입니다.
  abstract_en: This study classifies cognitive task performance from PPG-derived HRV features and evaluates a convolutional neural network approach.
  research_problem_ko: 생리신호 기반 HRV 특징이 인지 과제 수행 상태를 구분하는 데 유효한지 분석했습니다.
  research_problem_en: The work examines whether physiological HRV features can distinguish cognitive task performance states.
  architecture_ko: PPG 취득 → IBI 산출 → HRV 특징 구성 → CNN 분류 → 평가 지표 산출의 흐름입니다.
  architecture_en: The pipeline proceeds from PPG acquisition to IBI extraction, HRV feature construction, CNN classification, and metric reporting.
  methods_ko: PPG 기반 timing과 IBI·HRV 전처리를 거친 특징을 CNN 입력으로 구성했습니다.
  methods_en: PPG timing and IBI/HRV preprocessing produce features used as inputs to the CNN.
  results_ko: 논문 Abstract에 보고된 평균 AUC는 0.85, F1-Score는 0.82입니다.
  results_en: The paper abstract reports an average AUC of 0.85 and an F1-score of 0.82.
  boundary_ko: 논문 Abstract·Conclusion의 평균 AUC 0.85·F1-Score 0.82, DBpia abstract의 AUC 0.99·F1 0.992와 본문 Fold 5 수치는 평가 범위가 다릅니다. 다음에는 동일한 dataset split과 metric 정의로 다시 계산해 차이를 비교할 계획입니다.
  boundary_en: The paper abstract and conclusion report average AUC 0.85 and F1-score 0.82, while the DBpia abstract reports AUC 0.99 and F1 0.992 and the paper body lists Fold 5 values. These use different evaluation scopes; next, I plan to recalculate them with the same dataset split and metric definitions.
