  abstract_ko: ECG R-peak 기준으로 ECG·SCG·FMCW Radar 신호를 정렬하고 848개 대응 beat에서 morphology 기반 AO/AC 후보 시점 분포를 분석한 연구입니다.
  abstract_en: This study aligns ECG, SCG, and FMCW radar signals to ECG R-peaks and analyzes morphology-based AO/AC candidate timing across 848 corresponding beats.
  research_problem_ko: 비접촉 FMCW Radar의 심장 미세변위 파형에서 판막 사건과 관련된 후보 시점을 일관되게 분석하는 절차를 다뤘습니다.
  research_problem_en: The work studies a repeatable procedure for analyzing valve-event-related candidate timings in non-contact FMCW radar cardiac displacement waveforms.
  architecture_ko: ECG·SCG·BGT60TR13C Radar 동시취득 → ECG R-peak 정렬 → beat segmentation → Radar morphology 후보 분석입니다.
  architecture_en: The pipeline uses concurrent ECG, SCG, and BGT60TR13C radar acquisition, ECG R-peak alignment, beat segmentation, and radar morphology candidate analysis.
  methods_ko: 600초 동시취득 신호에서 대응되는 848개 beat를 구성하고 AO/AC 관련 후보 시점의 분포를 분석했습니다.
  methods_en: From 600 seconds of concurrent acquisition, 848 corresponding beats were assembled for AO/AC-related candidate timing analysis.
  results_ko: 공개 근거가 지원하는 결과는 600초 동시취득과 848개 대응 beat 분석입니다.
  results_en: Public evidence supports 600 seconds of concurrent acquisition and analysis of 848 corresponding beats.
  boundary_ko: Radar-derived AO/AC candidate timing이며 대동맥판 직접 영상화, 임상적 valve detection 또는 의료기기 성능을 의미하지 않습니다.
  boundary_en: These are radar-derived AO/AC candidate timings, not direct valve imaging, clinical valve detection, or medical-device performance.
