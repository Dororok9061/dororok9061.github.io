  evidence_ko:
    - KiCad hierarchical schematic과 PCB 원본
    - front·back copper, mask, paste, silkscreen Gerber
    - PTH·NPTH drill과 Gerber job 파일
  evidence_en:
    - KiCad hierarchical schematic and PCB source
    - Front/back copper, mask, paste, and silkscreen Gerbers
    - PTH/NPTH drill and Gerber job files
  contribution_ko:
    - STM32F411RETx 전원·clock·SWD·UART 회로 구성
    - 두 SFH7070 입력과 OPA2333 기반 저잡음 analog signal path 배치
    - bottom GND plane과 2-layer routing 후 제조 파일 생성
  contribution_en:
    - Built STM32F411RETx power, clock, SWD, and UART circuitry
    - Laid out two SFH7070 inputs and OPA2333-based low-noise analog paths
    - Added a bottom ground plane, routed two layers, and generated fabrication files
  boundary_ko: 설계·배선·제조 파일 단계까지 확인했습니다. 실제 PPG waveform, SNR, filter cutoff, 생체신호 정확도와 차량용 규격 시험 결과는 현재 자료에 없습니다.
  boundary_en: The available work reaches schematic, routing, and fabrication-output stages. The archive does not include measured PPG waveforms, SNR, filter cutoff, biosignal accuracy, or automotive qualification results.
  problem_ko: 작은 광학 신호를 다루는 analog front-end와 MCU의 clock·digital interface를 한 PCB에서 배치하면서 전원과 return path를 관리하는 문제입니다.
  problem_en: The task was to place a small-signal optical front end alongside MCU clocks and digital interfaces while managing power and return paths on one PCB.
  architecture_ko: 두 SFH7070 sensor → OPA2333 증폭·filter stage → STM32F411 ADC A0/A1 → UART, SWD debug와 8 MHz·32.768 kHz clock 지원.
  architecture_en: Two SFH7070 sensors → OPA2333 amplification/filter stages → STM32F411 ADC A0/A1 → UART, with SWD debug and 8-MHz/32.768-kHz clocks.
  stack_ko: [KiCad, STM32F411RETx, SFH7070, OPA2333, SPX3819, SWD, UART, Gerber]
  stack_en: [KiCad, STM32F411RETx, SFH7070, OPA2333, SPX3819, SWD, UART, Gerber]
  data_flow_ko: Optical sensor → analog amplification·filter → MCU ADC → digital processing·UART, 5 V input → 3.3 V LDO → analog·digital rail.
  data_flow_en: Optical sensor → analog amplification/filter → MCU ADC → digital processing/UART, with 5-V input → 3.3-V LDO → analog/digital rails.
  methods_ko:
    - STM과 Analog hierarchical sheet로 기능 분리
    - analog input 주변 부품과 MCU·clock·connector placement 조정
    - copper·mask·paste·silkscreen·drill 파일을 한 제조 묶음으로 출력
  methods_en:
    - Split functions into STM and Analog hierarchical sheets
    - Arranged analog-input components relative to the MCU, clocks, and connectors
    - Exported copper, mask, paste, silkscreen, and drill files as one fabrication package
  results_ko:
    - 약 80.6 × 52.2 mm 2-layer PCB 구성
    - 69 modules, 83 nets, 602 tracks와 56 plated holes 확인
    - KiCad 원본부터 Gerber·drill까지 제조 전달 자료 완성
  results_en:
    - Created an approximately 80.6 × 52.2 mm two-layer PCB
    - Confirmed 69 modules, 83 nets, 602 tracks, and 56 plated holes
    - Completed a fabrication handoff from KiCad source through Gerber and drill files
