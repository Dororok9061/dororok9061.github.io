    - Decomposed the INA250 current path, AD7997 ADC, OPA703 voltage path, and AD5629R DAC functions
    - Organized multichannel connector/net flow, BOM, and PCB artifacts
  boundary_ko: 12채널 MPPT 구조는 Kelzenberg·Loke·Atwater의 공개 연구를 참고했습니다. 현재 자료에는 계측 정확도, 효율, 온도 특성이나 양산 수율 측정 결과가 없습니다.
  boundary_en: The 12-channel MPPT architecture references the published work of Kelzenberg, Loke, and Atwater. The current archive does not contain measured accuracy, efficiency, temperature behavior, or production-yield results.
  problem_ko: 여러 Solar Cell 채널을 한 시스템에서 인가·측정하려면 공통 전원과 기준전압, 채널별 전류·전압 signal chain, MCU 통신을 구조적으로 분리해야 합니다.
  problem_en: Driving and measuring multiple solar-cell channels requires a clear separation of shared power/reference rails, per-channel current/voltage signal chains, and MCU communication.
  architecture_ko: 12 V 입력 → 5 V·3.3 V rail → STM32F401 mainboard → 세 measurement module connector → ADC·DAC·op-amp·current sensor → USB/UART.
  architecture_en: 12-V input → 5-V/3.3-V rails → STM32F401 mainboard → three measurement-module connectors → ADC, DAC, op amp, and current sensor → USB/UART.
  stack_ko: [STM32F401, PADS Logic, PADS Layout, INA250, AD7997, OPA703, AD5629R, USB UART]
  stack_en: [STM32F401, PADS Logic, PADS Layout, INA250, AD7997, OPA703, AD5629R, USB UART]
  data_flow_ko: Cell channel → current·voltage analog path → ADC → MCU → USB/UART, MCU setpoint → DAC → channel control path.
  data_flow_en: Cell channel → current/voltage analog path → ADC → MCU → USB/UART, with MCU setpoints → DAC → channel-control path.
  methods_ko:
    - 메인보드와 측정 모듈을 connector·net 기준으로 나눠 추적
    - 전원, 기준전압, ADC, DAC와 증폭기를 기능 블록으로 분해
    - 공개 MPPT 구조와 저장된 PADS 설계를 비교하고 출처를 명시
  methods_en:
    - Traced the mainboard and measurement modules by connectors and nets
    - Decomposed power, reference, ADC, DAC, and amplifier functions into blocks
    - Compared the stored PADS design with a published MPPT architecture and cited its source
  results_ko:
    - STM32F401 mainboard와 세 측정 모듈의 연결 구조 정리
    - 8채널 전류·전압 측정 블록과 ADC·DAC 경로 확인
    - 설계 원본과 BOM을 공개용 archive로 선별
  results_en:
    - Mapped the STM32F401 mainboard and three measurement-module connections
    - Identified eight-channel current/voltage measurement blocks and ADC/DAC paths
    - Curated design-source and BOM files for the public archive
