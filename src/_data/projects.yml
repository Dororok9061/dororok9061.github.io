  summary_ko: F411 보드 검사 영상을 기준으로 품질 게이트, ROI 정렬, PatchCore/FR-PatchCore, DINOv3 계열 특징, 논문형 그림과 공개 홈페이지를 한 흐름으로 정리한 PCB inspection 프로젝트입니다.
  summary_en: A PCB inspection project that connects F411-board visual intake, quality gating, ROI alignment, PatchCore/FR-PatchCore, DINOv3-style features, paper figures, and public project publishing.
  status: PUBLICATION BUILD
  status_class: measured
  status_label_ko: 논문형 그림·홈페이지 반영
  status_label_en: Paper-style figures and homepage integrated
  image_webp: /assets/images/projects/pcb-visual-inspection/pcb_fig31a_capture_quality_gate.webp
