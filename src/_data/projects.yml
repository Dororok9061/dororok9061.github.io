  summary_ko: 두 개의 SFH7070 광학 센서, OPA2333 아날로그 front-end와 STM32F411을 한 보드로 통합하고 2-layer Gerber까지 구성한 KiCad PCB 설계입니다.
  summary_en: A KiCad PCB integrating two SFH7070 optical sensors, OPA2333 analog front ends, and an STM32F411, with a complete two-layer Gerber package.
  status: DESIGN + GERBER
  status_class: source
  status_label_ko: KiCad 원본·제조 출력물
  status_label_en: KiCad source and fabrication outputs
  image_webp: /assets/images/projects/stm32f411-ppg-pcb/pcb-front.webp
