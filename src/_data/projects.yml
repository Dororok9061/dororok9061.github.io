- id: mmwave-visualizer
  title_ko: TI mmWave 3D People Tracking Visualizer
  title_en: TI mmWave 3D People Tracking Visualizer
  domain_ko: mmWave Radar · Embedded Integration · System Validation
  domain_en: mmWave Radar · Embedded Integration · System Validation
  summary_ko: IWR6843 EVM의 센서 설정, C674x DSS 빌드 구조, dual-UART 데이터 경로와 3D 사람 추적 출력을 한 흐름으로 점검한 레이더 시스템 통합 경험입니다.
  summary_en: A radar-system integration project covering IWR6843 sensor configuration, the C674x DSS build structure, dual-UART data flow, and 3D people-tracking output.
  status: HARDWARE + ARCHIVE
  status_class: source
  status_label_ko: 실제 장비·실행 화면·설정 자료
  status_label_en: Hardware, runtime screens, and configuration records
  image_webp: /assets/images/projects/mmwave-visualizer/lab-setup.webp
  image_jpg: /assets/images/projects/mmwave-visualizer/lab-setup.jpg
  image_width: 1200
  image_height: 1600
  alt_ko: 실험실 스탠드에 장착한 IWR6843 mmWave 레이더와 Visualizer 실행 환경
  alt_en: IWR6843 mmWave radar mounted on a lab stand with the Visualizer environment
  evidence_ko:
    - IWR6843ISK 계열 EVM 실험 장비 사진
    - 3D People Tracking 실행 프레임과 Visualizer 설정 화면
    - C674x DSS·SYS/BIOS build artifact와 IWR6843AOP target configuration
  evidence_en:
    - Photographs of the IWR6843ISK-family EVM setup
    - 3D People Tracking frames and Visualizer configuration screens
    - C674x DSS/SYS/BIOS build artifacts and an IWR6843AOP target configuration
  contribution_ko:
    - 센서 높이·방향·FOV·range·threshold 설정 조정
    - CLI 115200 bps와 data 921600 bps dual-UART 연결 확인
    - point cloud·tracking box·range profile·vital-sign 화면 비교
  contribution_en:
    - Adjusted sensor height, direction, FOV, range, and thresholds
    - Checked the 115200-bps CLI and 921600-bps data UART paths
    - Compared point-cloud, tracking-box, range-profile, and vital-sign views
  boundary_ko: TI Radar Toolbox와 SDK 예제를 기반으로 설정·빌드·연결·출력을 분석했습니다. MSS는 바이너리만 남아 있어 수정 범위에 포함하지 않았고, 생체신호 화면의 수치는 의료 정확도로 평가하지 않았습니다.
  boundary_en: I analyzed configuration, build, connectivity, and output using TI Radar Toolbox and SDK examples. The MSS side is available only as a binary, and the vital-sign display was not evaluated for medical accuracy.
  problem_ko: 레이더 알고리즘, DSP 빌드, 직렬 통신과 GUI가 나뉜 개발 환경에서 설정값이 실제 3D 추적 출력까지 이어지는 경로를 확인하는 문제입니다.
  problem_en: The task was to trace how configuration values propagate to 3D tracking output across radar algorithms, a DSP build, serial links, and a GUI.
  architecture_ko: IWR6843 sensor → range·Doppler 처리와 2D Capon/MVDR·CFAR → DSS/MSS shared memory·mailbox → dual UART → Visualizer.
  architecture_en: IWR6843 sensor → range/Doppler processing with 2D Capon/MVDR and CFAR → DSS/MSS shared memory and mailbox → dual UART → Visualizer.
  stack_ko: [IWR6843ISK, IWR6843AOP, TI Radar Toolbox, Code Composer Studio, C674x DSP, SYS/BIOS, UART]
  stack_en: [IWR6843ISK, IWR6843AOP, TI Radar Toolbox, Code Composer Studio, C674x DSP, SYS/BIOS, UART]
  data_flow_ko: Radar chirp → range·Doppler·angle 처리 → dynamic/static CFAR → point cloud·target list → serial packet → 3D 화면.
  data_flow_en: Radar chirps → range, Doppler, and angle processing → dynamic/static CFAR → point cloud and target list → serial packet → 3D display.
  methods_ko:
    - EVM과 PC의 제어·데이터 COM port를 분리해 연결
    - 실험 공간에 맞춰 sensor position, boundary와 detection parameter 조정
    - 시간대가 다른 추적 프레임과 여러 Visualizer 화면을 비교
  methods_en:
    - Separated the EVM control and data COM ports
    - Tuned sensor position, boundaries, and detection parameters for the test space
    - Compared tracking frames at different times and across Visualizer views
  results_ko:
    - 18.17초 실행 영상에서 3D target 추적 흐름 확인
    - point cloud와 tracking box, range profile 화면 확보
    - 장비·설정·DSP·GUI를 잇는 시스템 수준 점검 항목 정리
  results_en:
    - Observed the 3D target-tracking flow in an 18.17-second run
    - Captured point-cloud, tracking-box, and range-profile views
    - Organized system-level checks spanning hardware, configuration, DSP, and GUI
