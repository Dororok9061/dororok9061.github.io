- id: fmcw-radar
  title_ko: FMCW Radar Cardiac Timing
  title_en: FMCW Radar Cardiac Timing
  domain_ko: Radar · Biomedical Signal Processing
  domain_en: Radar · Biomedical Signal Processing
  summary_ko: ECG·SCG·비접촉 FMCW Radar를 beat-relative axis에 정렬하고 radar morphology에서 AO/AC 후보 시점을 분석합니다.
  summary_en: Aligns ECG, SCG, and non-contact FMCW radar on a beat-relative axis and analyzes morphology-based AO/AC candidate timing.
  status: SOURCE + HARDWARE
  status_class: source
  status_label_ko: 분석 코드와 실제 실험 장비
  status_label_en: Analysis source and real hardware
  image_webp: /assets/images/projects/radar-hardware.webp
  image_jpg: /assets/images/projects/radar-hardware.jpg
  image_width: 1200
  image_height: 800
  alt_ko: ECG, SCG, FMCW Radar 실제 실험 하드웨어와 센서 구성
  alt_en: ECG, SCG, and FMCW radar experimental hardware and sensor setup
  evidence_ko:
    - 분석 source와 설정·export 문서
    - STM32·ESP32 acquisition firmware
    - ECG·SCG·Radar 동시취득에 사용한 하드웨어 사진
  evidence_en:
    - Analysis source plus configuration and export documentation
    - STM32 and ESP32 acquisition firmware
