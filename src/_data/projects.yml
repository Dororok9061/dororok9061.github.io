    - Radar phase displacement와 beat segmentation
    - Detector fusion, SQI, CTI export
  contribution_en:
    - ECG R-peak anchoring and SCG reference timing
    - Radar phase displacement and beat segmentation
    - Detector fusion, SQI, and CTI export
  boundary_ko: 현재 AO/AC는 radar morphology에서 찾은 후보 시점입니다. Direct valve imaging이나 임상 성능으로 확장하려면 echo·ICG·PCG와 독립적으로 비교하는 후속 실험이 필요합니다.
  boundary_en: The current AO/AC values are candidate timings derived from radar morphology. Extending this work to direct valve imaging or clinical performance requires follow-up comparison with independent echo, ICG, or PCG measurements.
  problem_ko: 비접촉 FMCW Radar 심장 미세변위 파형에서 ECG·SCG와 시간 정렬 가능한 AO/AC 관련 후보 시점을 분석하는 문제입니다.
  problem_en: The project analyzes AO/AC-related candidate timings in non-contact FMCW radar cardiac displacement waveforms aligned with ECG and SCG.
  architecture_ko: ECG·SCG·BGT60TR13C Radar 동시취득 → ECG R-peak 기준 정렬 → beat segmentation → phase displacement와 morphology 후보 분석 → SQI·CTI export.
  architecture_en: Concurrent ECG/SCG/BGT60TR13C radar acquisition → ECG R-peak alignment → beat segmentation → phase-displacement and morphology candidate analysis → SQI/CTI export.
  stack_ko: [BGT60TR13C, STM32F411, ESP-32S, MPU6050, Python, NumPy, SciPy]
  stack_en: [BGT60TR13C, STM32F411, ESP-32S, MPU6050, Python, NumPy, SciPy]
  data_flow_ko: 동시취득된 600초 신호를 공통 시간축에 맞추고 848개 대응 beat를 구성해 후보 시점 분포를 분석합니다.
  data_flow_en: Six hundred seconds of concurrent signals are aligned to a common time axis, producing 848 corresponding beats for candidate-timing distribution analysis.
  methods_ko:
    - ECG R-peak anchor와 SCG reference timing 구성
    - Radar phase displacement 산출과 beat-relative segmentation
    - Detector fusion, signal quality index와 candidate timing interval export
  methods_en:
    - Constructed ECG R-peak anchors and SCG reference timings
    - Calculated radar phase displacement and beat-relative segments
    - Exported detector fusion, signal-quality indices, and candidate timing intervals
  results_ko:
    - ECG·SCG·Radar 600초 동시취득
    - 848개 대응 beat 분석
    - Radar-derived AO/AC candidate timing 분포 구성
  results_en:
    - 600 seconds of concurrent ECG, SCG, and radar acquisition
    - 848 corresponding beats analyzed
    - Radar-derived AO/AC candidate timing distributions constructed
