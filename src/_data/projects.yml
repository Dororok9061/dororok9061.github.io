  alt_en: PCB capture and quality-gate figure with separated camera, video, and ROI panels
  evidence_ko:
    - "PCB 전용 공개 홈페이지의 v9 분리형 갤러리와 클릭 확대 동작"
    - "fig31a부터 fig31j까지 900×900 논문형 정사각형 그림"
    - "GitHub Pages에 미러된 전체 Research Publication Workbench"
    - "PatchCore, FR-PatchCore, DINOv3 기반 그림 재작성 기록"
  evidence_en:
    - "v9 separated gallery and click-to-enlarge behavior in the PCB public homepage"
    - "Ten 900×900 paper-style square figures, fig31a through fig31j"
    - "Full Research Publication Workbench mirrored into GitHub Pages"
    - "PatchCore, FR-PatchCore, DINOv3, and source-checked figure-redraw record"
  contribution_ko:
    - "VIScan 등 PCB inspection과 무관한 항목 제외"
    - "카메라/영상 입력, 품질 게이트, ROI, 특징 추출, 검토/배포 흐름 재정리"
    - "논문, GitHub, Notion, 홈페이지에 재사용 가능한 낱장 figure atlas 구성"
  contribution_en:
    - "Removed non-PCB-inspection VIScan material"
    - "Reorganized camera/video intake, quality gate, ROI, feature extraction, review, and publication flow"
    - "Built a reusable single-figure atlas for paper, GitHub, Notion, and homepage reuse"
  boundary_ko: 현재 공개 허브에는 논문형 그림과 프로젝트 연결을 게시합니다. 수치 성능 주장은 로컬 실험 로그와 gold-label 검증이 있는 범위로 제한하고, 생산 수율이나 제조 결함 판정 claim은 별도 검증 전까지 보류합니다.
  boundary_en: The public hub publishes the paper-style figures and project links. Quantitative claims remain limited to locally verified evidence; production-yield and manufacturing-defect claims are held until gold-label validation is approved.
  problem_ko: PCB 검사 프로젝트에서 카메라 입력, ROI 정렬, anomaly heatmap, mask, 표, 논문 그림, 홈페이지 게시물이 서로 흩어지지 않도록 하나의 출판 가능한 구조로 묶는 문제입니다.
  problem_en: The project turns camera intake, ROI alignment, anomaly heatmaps, masks, tables, paper figures, and homepage publishing into one coherent PCB inspection publication structure.
  architecture_ko: USB/industrial camera 또는 파일 입력 → 품질 게이트 → ROI 정렬 → ViT/DINO/PatchCore 계열 특징 → anomaly score/heatmap/mask → reviewer gate → 논문·GitHub·Notion·홈페이지 출판.
  architecture_en: USB/industrial camera or file intake → quality gate → ROI alignment → ViT/DINO/PatchCore-style features → anomaly score/heatmap/mask → reviewer gate → paper, GitHub, Notion, and homepage publishing.
  stack_ko: [Python, OpenCV, PyTorch, CUDA, PatchCore, FR-PatchCore, DINOv3, Jekyll, GitHub Pages, Notion]
  stack_en: [Python, OpenCV, PyTorch, CUDA, PatchCore, FR-PatchCore, DINOv3, Jekyll, GitHub Pages, Notion]
  data_flow_ko: 원본 frame과 ROI evidence를 분리 저장하고, 각 figure는 contact sheet가 아니라 독립된 정사각형 panel로 공개 페이지와 논문에 재사용합니다.
  data_flow_en: Raw frames and ROI evidence are kept separate, and each figure is reused as an independent square panel rather than a bundled contact sheet.
  methods_ko:
    - "참고 묶음의 레이아웃 문법을 실제 자료 기준으로 추출"
    - "박스 안 글자, 축 라벨, 화살표, color bar, 중앙 정렬을 정사각형 figure 기준으로 재작성"
    - "홈페이지 갤러리는 낱장 이미지 클릭 확대를 기본 동작으로 구성"
  methods_en:
    - "Extracted layout grammar from the supplied figure bundles using a source-checked reference-intake route"
    - "Redrew text boxes, axis labels, arrows, color bars, and centered panels as square publication figures"
    - "Configured the homepage gallery around individually clickable enlarged images"
  results_ko:
    - "PCB 방법론 figure 10장을 독립 카드로 분리"
    - "로컬 8765 포털을 GitHub Pages 공개 경로에 미러"
    - "브라우저에서 첫 방법론 figure 클릭 확대 동작 확인"
    - "PCB 저장소와 공개 허브에 v9 gallery cache-bust와 분리형 figure references 반영"
  results_en:
    - "Separated ten PCB methodology figures into independent cards"
    - "Mirrored the local 8765 portal into a public GitHub Pages route"
    - "Verified click-to-enlarge behavior for the first methodology figure in the browser"
    - "Published the v9 gallery cache-bust and separated figure references in the PCB repo and public hub"
