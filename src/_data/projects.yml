      alt_ko: STM32 보드와 ECG 전극을 포함한 FMCW Radar 심장신호 동시취득 실험 구성
      alt_en: FMCW radar cardiac-signal acquisition setup with an STM32 board and ECG electrodes
      caption_ko: 개인정보 검토를 거친 실제 ECG·SCG·Radar 동시취득 하드웨어
      caption_en: Privacy-reviewed hardware for concurrent ECG, SCG, and radar acquisition
