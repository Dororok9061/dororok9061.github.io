- id: fpga-delay-logic
  title_ko: FPGA Programmable Delay Logic
  title_en: FPGA Programmable Delay Logic
  domain_ko: FPGA · RTL · Digital Verification
  domain_en: FPGA · RTL · Digital Verification
  summary_ko: 동일한 cycle-delay contract를 Shift Register, Circular Queue, Memory-Based Driver/Checker 구조로 발전시킨 parameterized SystemVerilog 설계입니다.
  summary_en: A parameterized SystemVerilog design that evolves one cycle-delay contract across shift-register, circular-queue, and memory-based Driver/Checker architectures.
  status: EXECUTED
  status_class: executed
  image_webp: /assets/images/projects/fpga-architecture.webp
  image_jpg: /assets/images/projects/fpga-architecture.jpg
  image_width: 1200
  image_height: 517
  alt_ko: Shift Register, Circular Queue, Memory-Based 구조로 발전하는 FPGA delay logic architecture
  alt_en: FPGA delay-logic architecture progressing from a shift register to circular queue and memory-based design
  evidence_ko:
    - "Project 1: Icarus Verilog 20 checks PASS"
    - "Project 2: 26 architecture-equivalence checks PASS"
    - "Project 3: 3 file-driven scenarios PASS"
  evidence_en:
    - "Project 1: 20 Icarus Verilog checks passed"
    - "Project 2: 26 architecture-equivalence checks passed"
    - "Project 3: three file-driven scenarios passed"
  contribution_ko:
    - Parameterized SystemVerilog RTL
    - Independent reference model
    - Self-checking testbench와 deterministic regression
  contribution_en:
    - Parameterized SystemVerilog RTL
    - Independent reference model
    - Self-checking testbench and deterministic regression
  boundary_ko: Functional simulation은 실행했습니다. Quartus synthesis, timing, power, Fmax와 수치 PPA는 도구 보고서를 찾지 못해 값을 적지 않았습니다.
  boundary_en: I ran the functional simulation. I did not find Quartus synthesis, timing, power, Fmax, or numerical PPA reports, so those values are not reported.
  problem_ko: 동일한 cycle-delay 동작을 여러 RTL architecture로 구현하면서 latency contract와 결과 일치성을 독립적으로 검증하는 문제입니다.
  problem_en: The project implements one cycle-delay contract across multiple RTL architectures while independently checking latency and output equivalence.
  architecture_ko: Shift Register → Circular Queue → Memory-Based Driver/Checker로 architecture를 확장하고 독립 reference model과 비교합니다.
  architecture_en: The architecture progresses from a shift register to a circular queue and a memory-based Driver/Checker, compared against an independent reference model.
  stack_ko: [SystemVerilog, Icarus Verilog, VHDL, GHDL, Quartus, ModelSim/Questa]
  stack_en: [SystemVerilog, Icarus Verilog, VHDL, GHDL, Quartus, ModelSim/Questa]
  data_flow_ko: Parameter와 입력 vector → DUT와 reference model → cycle-aligned checker → deterministic PASS/FAIL log.
  data_flow_en: Parameters and input vectors → DUT and reference model → cycle-aligned checker → deterministic PASS/FAIL log.
  methods_ko:
    - Width·depth·delay parameter를 바꿔도 유지되는 RTL contract 정의
    - DUT와 분리된 reference model 및 self-checking testbench 작성
    - File-driven scenario와 architecture-equivalence regression 실행
  methods_en:
    - Defined an RTL contract that remains stable across width, depth, and delay parameters
    - Built an independent reference model and self-checking testbench
    - Executed file-driven scenarios and architecture-equivalence regressions
  results_ko:
    - Project 1 Icarus Verilog 20 checks PASS
    - Project 2 architecture-equivalence 26 checks PASS
    - Project 3 file-driven 3 scenarios PASS
  results_en:
    - Project 1 passed 20 Icarus Verilog checks
    - Project 2 passed 26 architecture-equivalence checks
    - Project 3 passed three file-driven scenarios
