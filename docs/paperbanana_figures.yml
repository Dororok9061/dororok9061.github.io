# Academic-figure backlog for PaperBanana. These prompts must not invent measurements,
# hardware, datasets, or results beyond the linked source pages.
- id: fmcw-radar-system-flow
  page: /projects/fmcw-radar/
  source: projects.yml:fmcw-radar
  output: /assets/images/generated/paperbanana/fmcw-radar-system-flow.png
  caption_ko: ECG·SCG·FMCW Radar 동시취득부터 beat 정렬과 AO·AC 후보 시점 분석까지의 처리 흐름
  caption_en: Processing flow from concurrent ECG/SCG/FMCW radar acquisition to beat alignment and AO/AC candidate timing analysis
  prompt: >-
    Create a clean academic method diagram for a multimodal cardiac sensing study. Show four stages only:
    concurrent ECG/SCG/BGT60TR13C radar acquisition; ECG R-peak anchored synchronization and beat segmentation;
    radar phase-displacement and morphology analysis; SQI/CTI export with AO/AC candidate timing.
    Use neutral scientific styling, explicit arrows, compact labels, and no clinical or performance claims beyond the text.

- id: ppg-hrv-model-flow
  page: /projects/ppg-hrv/
  source: projects.yml:ppg-hrv
  output: /assets/images/generated/paperbanana/ppg-hrv-model-flow.png
  caption_ko: 귓불 PPG 취득에서 IBI·HRV 특징과 CNN+Transformer 평가까지의 연구 흐름
  caption_en: Research flow from earlobe PPG acquisition through IBI/HRV features to CNN+Transformer evaluation
  prompt: >-
    Draw a publication-quality pipeline with earlobe PPG sensor and AFE, STM32 acquisition, peak/IBI extraction,
    time- and frequency-domain HRV feature construction, and CNN plus Transformer evaluation.
    Distinguish paper-reported metrics from code-archive evaluation by visual grouping. Do not invent extra metrics.

- id: fpga-delay-verification-flow
  page: /projects/fpga-delay-logic/
  source: projects.yml:fpga-delay-logic
  output: /assets/images/generated/paperbanana/fpga-delay-verification-flow.png
  caption_ko: Shift Register·Circular Queue·Memory-Based 구조와 독립 reference model 검증 흐름
  caption_en: Shift-register, circular-queue, and memory-based architectures with independent reference-model verification
  prompt: >-
    Create an academic digital-design diagram showing one cycle-delay contract implemented as Shift Register,
    Circular Queue, and Memory-Based Driver/Checker architectures. Add an independent reference model and cycle-aligned checker.
    Emphasize architecture equivalence and deterministic regression without adding synthesis or PPA results.

- id: drowsiness-two-node-flow
  page: /projects/drowsiness-monitor/
  source: projects.yml:drowsiness-monitor
  output: /assets/images/generated/paperbanana/drowsiness-two-node-flow.png
  caption_ko: PPG sensing node와 Camera/EAR analysis node를 잇는 졸음 모니터 데이터 흐름
  caption_en: Drowsiness-monitor data flow connecting the PPG sensing node and Camera/EAR analysis node
  prompt: >-
    Draw a two-node embedded-system architecture. Node A acquires PPG. Node B performs camera/EAR analysis.
    Connect them through the documented TCP/IP/file IPC path and show GPIO/I2C LCD and alarm outputs.
    Use only the listed interfaces and do not invent latency or classification accuracy.

- id: rf-smith-matching-study
  page: /blog/category/rf-radar-signal/
  source: RF study notes and high-frequency coursework
  output: /assets/images/generated/paperbanana/rf-smith-matching-study.png
  caption_ko: 50 Ω 정규화부터 Smith Chart와 전송선 정합으로 이어지는 RF 학습 지도
  caption_en: RF study map from 50-ohm normalization through Smith-chart and transmission-line matching
  prompt: >-
    Create a textbook-style RF study diagram linking 50-ohm reference impedance, reflection coefficient,
    Smith-chart normalization, lumped matching, transmission-line movement, and stub/microstrip matching.
    Use conceptual relationships only; do not present fabricated measurements.

- id: stm32-acquisition-study
  page: /study/stm32/
  source: verified STM32 study materials
  output: /assets/images/generated/paperbanana/stm32-acquisition-study.png
  caption_ko: STM32 Clock·ADC·Timer·UART·DSP 흐름을 연결한 학습 구조도
  caption_en: STM32 study architecture connecting clock, ADC, timer, UART, and DSP stages
  prompt: >-
    Create a clear MCU study flow with clock configuration, timer-triggered acquisition, ADC sampling,
    optional DMA where present in the source, UART transfer, and CMSIS-DSP processing.
    Keep it generic to the verified source and do not invent peripheral configurations.

- id: pads-pcb-study-flow
  page: /study/pads/
  source: verified PADS study materials
  output: /assets/images/generated/paperbanana/pads-pcb-study-flow.png
  caption_ko: PADS Symbol·Part·Decal·Schematic·Layout·DRC·Gerber 학습 흐름
