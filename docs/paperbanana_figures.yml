- id: motor-control-cascade-flow
  page: /blog/category/control-motor-power/
  source: motor-control coursework
  output: /assets/images/generated/paperbanana/motor-control-cascade-flow.png
  caption_ko: DC Motor 전류 PI·속도 PI와 약자속 제어의 계층 구조
  caption_en: Cascaded DC-motor current PI, speed PI, and field-weakening control structure
  prompt: >-
    Create an academic control block diagram for a DC motor with outer speed PI loop, inner current PI loop,
